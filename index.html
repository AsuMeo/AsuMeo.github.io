nter;color:var(--muted);font-size:12px;margin:16px}.bubblewrap{display:flex;margin:5px 0;align-items:flex-end;gap:8px}.bubblewrap.mine{justify-content:flex-end}.bubble{max-width:min(72%,650px);background:var(--panel2);border:1px solid var(--line);border-radius:18px 18px 18px 5px;padding:10px 12px;box-shadow:0 4px 14px #0002;position:relative;overflow:hidden}.mine .bubble{background:#20242a;border-color:#30363e;border-radius:18px 18px 5px 18px}.replybox{border-left:2px solid #aeb5bd;padding:5px 8px;margin-bottom:7px;color:#b9c0c8;font-size:12px;background:#ffffff06;border-radius:5px}.msgtext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.42}.meta{display:flex;align-items:center;justify-content:flex-end;gap:5px;color:#858d97;font-size:10px;margin:5px 0 -3px 12px;float:right}.ticks{letter-spacing:-3px;color:#9ea6af}.media{max-width:100%;max-height:420px;border-radius:12px;display:block;background:#090a0c}.circle{width:min(260px,65vw);aspect-ratio:1;border-radius:50%;object-fit:cover}.audio{width:min(310px,65vw)}.filecard{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;padding:7px}.reacts{display:flex;gap:3px;clear:both;padding-top:6px}.react{border:1px solid #3a4149;background:#ffffff09;border-radius:20px;padding:2px 7px;font-size:13px;cursor:pointer}.composerwrap{padding:10px max(14px,calc((100% - 950px)/2)) max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0d0f12}.replypreview{padding:7px 12px;border-left:2px solid #eee;background:var(--panel2);border-radius:9px;margin-bottom:8px;font-size:12px;display:flex;justify-content:space-between}.composer{display:flex;gap:7px;align-items:flex-end}.composer textarea{resize:none;min-height:44px;max-height:130px;padding:11px 14px}.send{background:#eee;color:#111;flex:none}.send.recording{background:var(--danger);color:white;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.55}}.modalback{position:fixed;inset:0;background:#000b;z-index:20;display:gr <div class="auth" id="auth"><div class="authcard"><div class="logo">M</div><h1 style="margin:0 0 5px">MEOW</h1><p class="small" id="authHint">Войдите в защищённый мессенджер</p><form id="authForm"><label>Уникальный username</label><input id="authUser" autocomplete="username" placeholder="@username" maxlength="24" required><label>Пароль</label><input id="authPass" type="password" autocomplete="current-password" minlength="6" placeholder="Минимум 6 символов" required><div id="regFields" class="hidden"><label>Отображаемое имя</label><input id="authName" maxlength="40" placeholder="Как вас называть?"></div><button class="btn primary" style="width:100%;margin-top:18px" id="authSubmit">Войти</button></form><div class="authswitch"><span id="switchText">Нет аккаунта?</span> <span class="link" id="authSwitch">Регистрация</span></div><div class="notice">Пароль защищает вход и облачную копию вашего ключа. Не теряйте его: восстановить E2E-данные без пароля невозможно.</div></div></div>

<script type="module">

const firebaseConfig={apiKey:"AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",authDomain:"meow-874ce.firebaseapp.com",databaseURL:"https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",projectId:"meow-874ce",storageBucket:"meow-874ce.firebasestorage.app",messagingSenderId:"471541334599",appId:"1:471541334599:web:567af3e7dbe70a37572762"};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getDatabase(fb);const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const S={me:null,profile:null,peer:null,chatId:null,priv:null,chatKey:null,unsubs:[],typingTimer:null,reply:null,tab:'chats',pc:null,stream:null,callId:null,rec:null,recChunks:[],circle:false};
const enc=new TextEncoder(),dec=new TextDecoder();const svg={file:'<svg class="icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>'};
function toast(t,bad=false){let e=document.createElement('div');e.className='toast';e.style.borderColor=bad?'#713b40':'';e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),3500)}
function safe(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function username(v){return v.trim().toLowerCase().replace(/^@/,'')}function validUser(v){return/^[a-z0-9_]{3,24}$/.test(v)}function emailFor(u){return`${u}@meow.local`}function chatId(a,b){return[a,b].sort().join('_')}function initials(p){return(p?.name||p?.username||'?').trim()[0].toUpperCase()}function avatar(el,p){el.innerHTML=p?.avatar?`<img src="${p.avatar}" alt="">`:safe(initials(p))}function ago(t){if(!t)return'давно';let s=Math.max(0,(Date.now()-t)/1000);if(s<60)return'только что';if(s<3600)return`${Math.floor(s/60)} мин. назад`;if(s<86400)return`${Math.floor(s/3600)} ч. назад`;return new Date(t).toLocaleDateString('ru',{day:'numeric',month:'short'})}function time(t){return new Date(t||Date.now()).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}function modal(html,wide=false){$('#modalRoot').innerHTML=`<div class="modalback" id="modalBack"><div class="modal ${wide?'wide':''}">${html}</div></div>`;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}}function closeModal(){$('#modalRoot').innerHTML=''}
function b64(buf){let a=new Uint8Array(buf),s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)}function unb64(s){let x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a.buffer}async function hash(s){return b64(await crypto.subtle.digest('SHA-256',enc.encode(s)))}
async function passwordKey(pass,salt){let base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:180000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function aesEncrypt(key,data){let iv=crypto.getRandomValues(new Uint8Array(12)),raw=typeof data==='string'?enc.encode(data):data;let out=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,raw);return{iv:b64(iv),data:b64(out)}}async function aesDecrypt(key,o,raw=false){let out=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.data));return raw?out:dec.decode(out)}

const rtc={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};async function makeCall(video){if(!S.peer)return;try{S.callId=push(ref(db,'calls')).key;S.stream=await navigator.mediaDevices.getUserMedia({audio:true,video});showCall(video,'Исходящий звонок…');S.pc=new RTCPeerConnection(rtc);S.stream.getTracks().forEach(t=>S.pc.addTrack(t,S.stream));wirePC(true);let offer=await S.pc.createOffer();await S.pc.setLocalDescription(offer);await set(ref(db,`calls/${S.callId}`),{from:S.me.uid,to:S.peer.uid,video,state:'ringing',offer:{type:offer.type,sdp:offer.sdp},at:Date.now()});onValue(ref(db,`calls/${S.callId}/answer`),async s=>{if(s.exists()&&!S.pc.currentRemoteDescription)await S.pc.setRemoteDescription(s.val())});onChildAdded(ref(db,`calls/${S.callId}/calleeCandidates`),s=>S.pc?.addIceCandidate(s.val()).catch(()=>{}))}catch(e){toast('Звонок не начат: '+e.message,true);endCall()}}function wirePC(caller){S.pc.ontrack=e=>$('#remoteVideo').srcObject=e.streams[0];S.pc.onicecandidate=e=>e.candidate&&push(ref(db,`calls/${S.callId}/${caller?'callerCandidates':'calleeCandidates'}`),e.candidate.toJSON());S.pc.onconnectionstatechange=()=>{$('#callStatus').textContent=({connected:'Соединено',connecting:'Соединение…',failed:'Сбой соединения',disconnected:'Соединение потеряно'}[S.pc.connectionState]||S.pc.connectionState);if(['failed','closed'].includes(S.pc.connectionState))endCall()}}
function listenCalls(){onChildAdded(query(ref(db,'calls'),orderByChild('to'),equalTo(S.me.uid)),async s=>{let c=s.val();if(c.state!=='ringing'||Date.now()-c.at>60000)return;let from=(await get(ref(db,`users/${c.from}`))).val();S.peer=from;S.callId=s.key;if(confirm(`${from.name} звонит (${c.video?'видео':'аудио'}). Ответить?`))answerCall(c);else update(ref(db,`calls/${s.key}`),{state:'declined'})})}async function answerCall(c){try{S.stream=await navigator.mediaDevices.getUserMedia({audio:true,video:c.video});showCall(c.video,'Соединение…');S.pc=new RTCPeerConnection(rtc);S.stream.getTracks().forEach(t=>S.pc.addTrack(t,S.stream));wirePC(false);await S.pc.setRemoteDescription(c.offer);let answer=await S.pc.createAnswer();await S.pc.setLocalDescription(answer);await update(ref(db,`calls/${S.callId}`),{answer:{type:answer.type,sdp:answer.sdp},state:'active'});onChildAdded(ref(db,`calls/${S.callId}/callerCandidates`),s=>S.pc?.addIceCandidate(s.val()).catch(()=>{}));onValue(ref(db,`calls/${S.callId}/state`),s=>s.val()==='ended'&&endCall(false))}catch(e){toast(e.message,true);endCall()}}function showCall(video,status){$('#call').classList.remove('hidden');$('#callName').textContent=S.peer?.name||'Звонок';$('#callStatus').textContent=status;avatar($('#callAvatar'),S.peer);$('#localVideo').srcObject=S.stream;$('#localVideo').classList.toggle('hidden',!video);$('#camBtn').classList.toggle('hidden',!video);$('#callAvatar').classList.toggle('hidden',video)}async function endCall(write=true){if(write&&S.callId)update(ref(db,`calls/${S.callId}`),{state:'ended',endedAt:Date.now()});S.pc?.close();S.stream?.getTracks().forEach(t=>t.stop());S.pc=null;S.stream=null;S.callId=null;$('#call').classList.add('hidden');$('#remoteVideo').srcObject=null;$('#localVideo').srcObject=null}$('#audioCall').onclick=()=>makeCall(false);$('#videoCall').onclick=()=>makeCall(true);$('#endCall').onclick=()=>endCall();$('#muteBtn').onclick=e=>{let t=S.stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;e.currentTarget.style.opacity=t.enabled?1:.4}};$('#camBtn').onclick=e=>{let t=S.stream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;e.currentTarget.style.opacity=t.enabled?1:.4}};
window.addEventListener('beforeunload',()=>{if(S.chatId&&S.me)remove(ref(db,`typing/${S.chatId}/${S.me.uid}`))});
</script>
