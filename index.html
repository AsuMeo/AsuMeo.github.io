<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Messenger — Компас + Калман + Высота</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh}

/* === LOGIN === */
#loginScreen{position:fixed;inset:0;background:#0a0a0f;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#loginScreen h1{color:#00ff88;font-size:26px;margin-bottom:6px;text-shadow:0 0 20px #00ff8840}
#loginScreen p{color:#888;font-size:13px;margin-bottom:25px;text-align:center}
#loginScreen input{width:100%;max-width:300px;padding:14px 18px;border-radius:12px;border:1px solid #333;background:#151520;color:#fff;font-size:16px;margin-bottom:12px;outline:none}
#loginScreen input:focus{border-color:#00ff88}
#loginScreen button{width:100%;max-width:300px;padding:14px;border-radius:12px;border:none;background:#00ff88;color:#000;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}
#loginScreen button:hover{background:#00cc6a}
#loginScreen .hint{color:#666;font-size:12px;margin-top:18px;text-align:center;line-height:1.6}

/* === CAMERA === */
#cameraView{position:fixed;inset:0;z-index:1}
#cameraFeed{width:100%;height:100%;object-fit:cover}
#cameraOverlay{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}

/* === COMPASS BAR === */
#compassBar{position:fixed;top:50px;left:0;right:0;z-index:10;height:36px;background:rgba(10,10,15,0.85);border-bottom:1px solid #222;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}
#compassBar .tick{position:absolute;top:0;bottom:0;width:1px;background:#333}
#compassBar .tick.major{background:#00ff8860;width:2px}
#compassBar .tickLabel{position:absolute;top:2px;font-size:9px;color:#666;transform:translateX(-50%)}
#compassNeedle{position:absolute;top:0;bottom:0;width:2px;background:#ff6b35;z-index:2;box-shadow:0 0 8px #ff6b35}
#compassCenter{position:absolute;top:0;bottom:0;width:3px;background:#00ff88;z-index:3;box-shadow:0 0 10px #00ff88}
#compassDeg{position:fixed;top:88px;left:50%;transform:translateX(-50%);z-index:10;font-size:11px;color:#888;font-family:monospace}

/* === RADAR === */
#radar{position:fixed;top:130px;right:12px;z-index:10;width:110px;height:110px;border-radius:50%;background:rgba(10,10,15,0.9);border:2px solid #333;overflow:hidden;pointer-events:none}
#radar .center{position:absolute;top:50%;left:50%;width:6px;height:6px;background:#00ff88;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 8px #00ff88;z-index:5}
#radar .ring{position:absolute;top:50%;left:50%;width:50px;height:50px;border:1px solid #333;border-radius:50%;transform:translate(-50%,-50%)}
#radar .ring2{position:absolute;top:50%;left:50%;width:90px;height:90px;border:1px solid #222;border-radius:50%;transform:translate(-50%,-50%)}
#radar .blip{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);z-index:3}
#radar .blip.near{background:#00ff88;box-shadow:0 0 6px #00ff88}
#radar .blip.far{background:#ff6b35;box-shadow:0 0 6px #ff6b35}
#radarDir{position:fixed;top:245px;right:12px;z-index:10;font-size:10px;color:#888;text-align:center;width:110px}

/* === AR MESSAGES — привязаны к направлению === */
.ar-msg{position:absolute;background:rgba(0,0,0,0.82);backdrop-filter:blur(12px);border:1px solid #00ff8860;border-radius:16px;padding:14px 18px;max-width:280px;pointer-events:auto;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 40px rgba(0,255,136,0.2);transition:left .3s ease}
.ar-msg .author{color:#00ff88;font-size:12px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ar-msg .author .ava{width:22px;height:22px;border-radius:50%;background:#00ff88;display:flex;align-items:center;justify-content:center;color:#000;font-size:11px;font-weight:800}
.ar-msg .text{color:#fff;font-size:15px;line-height:1.5;word-break:break-word}
.ar-msg .meta{color:#888;font-size:11px;margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.ar-msg .meta span{display:flex;align-items:center;gap:4px}
.ar-msg .exact{color:#ffd700;font-size:10px;margin-top:4px;font-weight:700}
.ar-msg .dirArrow{color:#ff6b35;font-size:16px;margin-left:4px}
@keyframes popIn{from{opacity:0;transform:scale(0.3) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* === UI === */
#topBar{position:fixed;top:0;left:0;right:0;z-index:10;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,0.85),transparent);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#topBar>*{pointer-events:auto}
#gpsStatus{display:flex;align-items:center;gap:6px;font-size:11px;color:#888}
#gpsStatus.online{color:#00ff88}
#gpsStatus .dot{width:7px;height:7px;border-radius:50%;background:#888}
#gpsStatus.online .dot{background:#00ff88;box-shadow:0 0 10px #00ff88}
#coordsDisplay{font-size:10px;color:#555;font-family:monospace}

#bottomBar{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 14px;background:linear-gradient(0deg,rgba(0,0,0,0.92),transparent);display:flex;gap:8px;align-items:flex-end;pointer-events:none}
#bottomBar>*{pointer-events:auto}
#msgInput{flex:1;padding:11px 14px;border-radius:14px;border:1px solid #333;background:rgba(21,21,32,0.95);color:#fff;font-size:15px;outline:none}
#msgInput:focus{border-color:#00ff88}
#sendBtn{width:46px;height:46px;border-radius:50%;border:none;background:#00ff88;color:#000;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;font-weight:700}
#sendBtn:hover{background:#00cc6a}
#camToggleBtn{width:46px;height:46px;border-radius:50%;border:none;background:#222;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
#camToggleBtn.on{background:#ff6b35}
#floorToggleBtn{width:46px;height:46px;border-radius:50%;border:none;background:#222;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;font-weight:700}
#floorToggleBtn.on{background:#00ccff}
#logoutBtn{position:fixed;top:10px;right:130px;z-index:11;padding:5px 12px;border-radius:8px;border:1px solid #333;background:rgba(0,0,0,0.7);color:#888;font-size:10px;cursor:pointer;pointer-events:auto}
#logoutBtn:hover{color:#ff4444;border-color:#ff4444}

/* === DISTANCE HUD === */
#distHud{position:fixed;top:55%;left:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;opacity:0;transition:.3s}
#distHud.show{opacity:1}
#distHud .bigDist{font-size:42px;font-weight:800;color:#00ff88;text-shadow:0 0 30px #00ff8860}
#distHud .bigDist.far{color:#ff6b35;text-shadow:0 0 30px #ff6b3560}
#distHud .label{font-size:12px;color:#888;margin-top:4px}

/* === NEARBY PANEL === */
#nearbyPanel{position:fixed;bottom:75px;left:10px;right:10px;max-height:200px;overflow-y:auto;background:rgba(10,10,15,0.96);border:1px solid #222;border-radius:14px;z-index:9;padding:12px;display:none;backdrop-filter:blur(10px)}
#nearbyPanel.show{display:block}
#nearbyPanel h3{color:#00ff88;font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.nearbyItem{padding:8px 0;border-bottom:1px solid #1a1a2e;font-size:12px}
.nearbyItem:last-child{border-bottom:none}
.nearbyItem .nAuthor{color:#00ff88;font-weight:700}
.nearbyItem .nText{color:#ccc}
.nearbyItem .nDist{color:#ff6b35;font-size:10px;margin-top:2px}
.nearbyItem .nExact{color:#ffd700;font-size:10px}

/* === LOADING === */
#loader{position:fixed;inset:0;background:#0a0a0f;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#loader .spinner{width:40px;height:40px;border:3px solid #222;border-top-color:#00ff88;border-radius:50%;animation:spin 1s linear infinite}
#loader p{color:#888;margin-top:14px;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}

/* === TOAST === */
#toast{position:fixed;top:55px;left:50%;transform:translateX(-50%) translateY(-120px);z-index:3000;background:#151520;border:1px solid #00ff8860;padding:10px 20px;border-radius:12px;font-size:12px;color:#00ff88;transition:.4s;opacity:0;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* === PINNED COORDS === */
#pinCoords{position:fixed;bottom:75px;left:10px;z-index:9;background:rgba(10,10,15,0.9);border:1px solid #333;border-radius:10px;padding:8px 12px;font-size:10px;color:#888;font-family:monospace;display:none;max-width:180px}
#pinCoords.show{display:block}
#pinCoords .val{color:#00ff88}
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p>Инициализация GPS + Компас...</p></div>

<div id="loginScreen">
  <h1>🗺️ AR Messenger</h1>
  <p>Компас · Калман · Этажи<br>Сообщения в направлении взгляда</p>
  <input type="text" id="nicknameInput" placeholder="Твой никнейм" maxlength="20" autocomplete="off">
  <button onclick="doLogin()">Войти</button>
  <p class="hint">📍 Разреши геолокацию<br>🧭 Поверни телефон — сообщения следуют<br>🏠 Кнопка этажа — различай этажи</p>
</div>

<div id="cameraView" style="display:none">
  <video id="cameraFeed" autoplay playsinline muted></video>
</div>
<div id="cameraOverlay"></div>

<div id="compassBar" style="display:none">
  <div id="compassCenter"></div>
  <div id="compassNeedle"></div>
</div>
<div id="compassDeg" style="display:none"></div>

<div id="radar" style="display:none">
  <div class="ring"></div>
  <div class="ring2"></div>
  <div class="center"></div>
</div>
<div id="radarDir" style="display:none"></div>

<div id="distHud"><div class="bigDist" id="bigDistVal">0.0м</div><div class="label" id="bigDistLabel">до ближайшего</div></div>

<div id="topBar" style="display:none">
  <div id="gpsStatus"><div class="dot"></div><span id="gpsText">GPS...</span></div>
  <div id="coordsDisplay">--.------, --.------</div>
</div>

<button id="logoutBtn" style="display:none" onclick="doLogout()">Выйти</button>

<div id="bottomBar" style="display:none">
  <input type="text" id="msgInput" placeholder="Напиши сообщение для ЭТОЙ точки..." maxlength="200" onkeydown="if(event.key==='Enter')sendMsg()">
  <button id="sendBtn" onclick="sendMsg()">➤</button>
  <button id="camToggleBtn" onclick="toggleCamera()">📷</button>
  <button id="floorToggleBtn" onclick="cycleFloor()">1F</button>
</div>

<div id="nearbyPanel"></div>
<div id="pinCoords"></div>
<div id="toast"></div>

<script>
// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
  authDomain: "meow-874ce.firebaseapp.com",
  databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "meow-874ce",
  storageBucket: "meow-874ce.firebasestorage.app",
  messagingSenderId: "471541334599",
  appId: "1:471541334599:web:567af3e7dbe70a37572762"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

// ===== STATE =====
let myUid=null,myNick='';
let myLat=null,myLng=null,myAlt=null,myAcc=999;
let myFloor=1;
let watchId=null,messages={};
let cameraOn=false,stream=null,rtdbRef=null;
let lastRender=0;

// ===== КОМПАС =====
let heading=0; // 0-360, 0=север
let hasCompass=false;
let compassMode='none'; // 'absolute', 'relative', 'none'

// ===== ФИЛЬТР КАЛМАНА =====
// 1D Kalman для lat и lng отдельно
class Kalman1D {
  constructor(q=0.01,r=1,x0=0,p0=1){
    this.q=q; // process noise
    this.r=r; // measurement noise
    this.x=x0; // estimate
    this.p=p0; // error covariance
    this.k=0;  // kalman gain
  }
  update(measurement){
    // Prediction
    this.p=this.p+this.q;
    // Update
    this.k=this.p/(this.p+this.r);
    this.x=this.x+this.k*(measurement-this.x);
    this.p=(1-this.k)*this.p;
    return this.x;
  }
}
const kalmanLat=new Kalman1D(0.001,10);
const kalmanLng=new Kalman1D(0.001,10);
let kalmanInit=false;

// ===== UTILS =====
function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}
function randHash(){return Math.random().toString(36).substring(2,10)}
function toRad(x){return x*Math.PI/180}
function toDeg(x){return x*180/Math.PI}

function distMeters(lat1,lng1,lat2,lng2){
  const R=6371000;
  const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function bearing(lat1,lng1,lat2,lng2){
  const dLng=toRad(lng2-lng1);
  const y=Math.sin(dLng)*Math.cos(toRad(lat2));
  const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLng);
  return (toDeg(Math.atan2(y,x))+360)%360;
}

// Разница углов (кратчайший путь)
function angleDiff(a,b){let d=(a-b+540)%360-180;return d}

// Проекция на экран по направлению
function screenXfromBearing(msgBearing,screenW,fov=60){
  const diff=angleDiff(msgBearing,heading);
  if(Math.abs(diff)>fov/2)return null; // за пределами поля зрения
  return screenW/2 + (diff/(fov/2))*(screenW/2);
}

function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return s+'с';
  if(s<3600)return Math.floor(s/60)+'м';
  if(s<86400)return Math.floor(s/3600)+'ч';
  return Math.floor(s/86400)+'д';
}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}

// ===== COMPASS INIT =====
function initCompass(){
  // Пробуем absolute orientation (iOS 13+)
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(state=>{
      if(state==='granted'){
        compassMode='absolute';
        window.addEventListener('deviceorientation',onCompass,true);
        hasCompass=true;
        showToast('🧭 Компас подключён (absolute)');
      }else{
        fallbackCompass();
      }
    }).catch(fallbackCompass);
  }else{
    // Android / старые устройства
    window.addEventListener('deviceorientationabsolute',onCompass,true);
    window.addEventListener('deviceorientation',onCompass,true);
    // Проверим через 2 сек есть ли данные
    setTimeout(()=>{
      if(!hasCompass){
        fallbackCompass();
      }else{
        compassMode='absolute';
        showToast('🧭 Компас подключён');
      }
    },2000);
  }
}

let lastAlpha=null;
function onCompass(e){
  let h=null;
  if(e.webkitCompassHeading!==undefined){
    h=e.webkitCompassHeading; // iOS
    compassMode='absolute';
    hasCompass=true;
  }else if(e.alpha!==null&&e.alpha!==undefined){
    h=(360-e.alpha)%360; // Android absolute
    if(e.absolute===true)compassMode='absolute';
    hasCompass=true;
  }
  if(h!==null){
    // Сглаживание компаса (простое экспоненциальное)
    if(lastAlpha===null)lastAlpha=h;
    else lastAlpha=lastAlpha*0.7+h*0.3;
    heading=lastAlpha;
  }
}

// Fallback: компаса нет — используем GPS-направление движения
let prevLat=null,prevLng=null,prevTime=null;
let gpsHeading=0;
function fallbackCompass(){
  compassMode='gps';
  showToast('🧭 Компаса нет. Использую направление движения по GPS');
  // GPS heading обновляется в updatePos
}

function updateGpsHeading(){
  if(compassMode!=='gps'||prevLat===null||myLat===null)return;
  const d=distMeters(prevLat,prevLng,myLat,myLng);
  if(d>2){ // минимум 2 метра движения
    gpsHeading=bearing(prevLat,prevLng,myLat,myLng);
    heading=gpsHeading;
  }
}

// ===== LOGIN =====
function doLogin(){
  const nick=document.getElementById('nicknameInput').value.trim();
  if(!nick||nick.length<2){showToast('Минимум 2 символа');return}
  myNick=nick;
  auth.signInAnonymously().then(cred=>{
    myUid=cred.user.uid;
    db.ref('users/'+myUid).set({nick:nick,lastSeen:Date.now()});
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('topBar').style.display='flex';
    document.getElementById('bottomBar').style.display='flex';
    document.getElementById('logoutBtn').style.display='block';
    document.getElementById('compassBar').style.display='flex';
    document.getElementById('compassDeg').style.display='block';
    document.getElementById('radar').style.display='block';
    document.getElementById('radarDir').style.display='block';
    initCompass();
    startGPS();
    listenMessages();
    showToast('Привет, '+nick+'! Стои на месте 10с');
  }).catch(e=>showToast('Ошибка: '+e.message));
}

function doLogout(){
  if(watchId)navigator.geolocation.clearWatch(watchId);
  if(rtdbRef)rtdbRef.off();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  auth.signOut().then(()=>location.reload());
}

// ===== GPS + КАЛМАН =====
function startGPS(){
  if(!navigator.geolocation){showToast('Геолокация не поддерживается');return}
  document.getElementById('loader').style.display='flex';

  navigator.geolocation.getCurrentPosition(
    pos=>{updatePos(pos,true);document.getElementById('loader').style.display='none';},
    err=>{showToast('GPS: '+err.message);document.getElementById('loader').style.display='none';},
    {enableHighAccuracy:true,timeout:20000,maximumAge:0}
  );

  watchId=navigator.geolocation.watchPosition(
    pos=>updatePos(pos,false),
    err=>showToast('GPS обновление: '+err.message),
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function updatePos(pos,isFirst){
  const rawLat=pos.coords.latitude;
  const rawLng=pos.coords.longitude;
  const rawAlt=pos.coords.altitude;
  const rawAcc=pos.coords.accuracy;

  // Калман-фильтр
  if(!kalmanInit){
    kalmanLat.x=rawLat;kalmanLng.x=rawLng;kalmanInit=true;
  }
  const smoothLat=kalmanLat.update(rawLat);
  const smoothLng=kalmanLng.update(rawLng);

  // Для GPS-heading fallback
  if(prevLat!==null)updateGpsHeading();
  prevLat=myLat;prevLng=myLng;prevTime=Date.now();

  myLat=smoothLat;
  myLng=smoothLng;
  myAlt=rawAlt;
  myAcc=rawAcc;

  document.getElementById('loader').style.display='none';
  const gs=document.getElementById('gpsStatus');
  gs.classList.add('online');
  document.getElementById('gpsText').textContent='GPS ±'+myAcc.toFixed(0)+'м';
  document.getElementById('coordsDisplay').textContent=myLat.toFixed(6)+', '+myLng.toFixed(6);

  db.ref('users/'+myUid).update({lat:myLat,lng:myLng,alt:myAlt,acc:myAcc,lastSeen:Date.now()});

  const now=Date.now();
  if(now-lastRender>250){
    lastRender=now;
    renderCompass();
    renderAR();
    updateRadar();
    updateDistHud();
    updateNearbyPanel();
  }
}

// ===== COMPASS BAR RENDER =====
function renderCompass(){
  const bar=document.getElementById('compassBar');
  const needle=document.getElementById('compassNeedle');
  const degText=document.getElementById('compassDeg');

  // Очищаем старые метки
  bar.querySelectorAll('.tick,.tickLabel').forEach(e=>e.remove());

  const w=bar.offsetWidth||window.innerWidth;
  const fov=90; // градусов видимости на шкале
  const step=15;

  for(let a=-180;a<=180;a+=step){
    const actual=(heading+a+360)%360;
    const x=w/2+(a/fov)*(w/2);
    if(x<-10||x>w+10)continue;

    const tick=document.createElement('div');
    tick.className='tick'+(a%45===0?' major':'');
    tick.style.left=x+'px';
    bar.appendChild(tick);

    if(a%45===0){
      const lbl=document.createElement('div');
      lbl.className='tickLabel';
      lbl.style.left=x+'px';
      const dirs={0:'N',45:'NE',90:'E',135:'SE',180:'S',225:'SW',270:'W',315:'NW'};
      lbl.textContent=dirs[Math.round(actual/45)*45%360]||Math.round(actual);
      bar.appendChild(lbl);
    }
  }

  degText.textContent=Math.round(heading)+'° '+(compassMode==='gps'?'(GPS)':compassMode==='absolute'?'(Компас)':'(?)');
}

// ===== RTDB =====
function listenMessages(){
  rtdbRef=db.ref('messages');
  rtdbRef.on('value',snap=>{
    messages=snap.val()||{};
    renderAR();updateRadar();updateDistHud();updateNearbyPanel();
  });
}

// ===== SEND =====
function sendMsg(){
  const inp=document.getElementById('msgInput');
  const text=inp.value.trim();
  if(!text){showToast('Введи текст');return}
  if(myLat===null){showToast('Жду GPS...');return}
  if(myAcc>25){showToast('Точность низкая (±'+myAcc.toFixed(0)+'м). Подожди');return}

  const msg={
    uid:myUid,nick:myNick,text:text,
    lat:myLat,lng:myLng,alt:myAlt,acc:myAcc,
    floor:myFloor,ts:Date.now()
  };

  db.ref('messages/'+Date.now()+'_'+randHash()).set(msg)
    .then(()=>{
      inp.value='';
      showToast('✅ Закреплено! '+myLat.toFixed(6)+', '+myLng.toFixed(6)+' Этаж '+myFloor);
      const pc=document.getElementById('pinCoords');
      pc.classList.add('show');
      pc.innerHTML='<div style="color:#00ff88;font-weight:700;margin-bottom:3px">📍 Закреплено:</div><div class="val">'+myLat.toFixed(7)+'</div><div class="val">'+myLng.toFixed(7)+'</div><div style="color:#00ccff;margin-top:3px">🏠 Этаж '+myFloor+'</div><div style="color:#666">±'+myAcc.toFixed(1)+'м</div>';
      setTimeout(()=>pc.classList.remove('show'),6000);
    })
    .catch(e=>showToast('Ошибка: '+e.message));
}

// ===== FLOOR TOGGLE =====
function cycleFloor(){
  myFloor=myFloor>=5?1:myFloor+1;
  document.getElementById('floorToggleBtn').textContent=myFloor+'F';
  showToast('Этаж: '+myFloor);
  renderAR();updateNearbyPanel();
}

// ===== RENDER AR — привязка к направлению =====
function renderAR(){
  const ov=document.getElementById('cameraOverlay');
  ov.innerHTML='';
  if(myLat===null)return;

  const w=window.innerWidth;
  const h=window.innerHeight;

  const nearby=[];
  Object.entries(messages).forEach(([id,m])=>{
    if(!m||!m.lat||!m.lng)return;
    // Фильтр по этажу
    const msgFloor=m.floor||1;
    if(msgFloor!==myFloor)return;
    const d=distMeters(myLat,myLng,m.lat,m.lng);
    if(d<80)nearby.push({id,d,brg:bearing(myLat,myLng,m.lat,m.lng),...m});
  });

  nearby.sort((a,b)=>a.d-b.d);

  // Рендерим сообщения в направлении взгляда
  nearby.forEach((m,i)=>{
    const sx=screenXfromBearing(m.brg,w,70);
    if(sx===null)return; // за пределами поля зрения

    const el=document.createElement('div');
    el.className='ar-msg';
    // Вертикальная позиция: чем ближе, тем ниже (ближе к горизонту)
    const vy=25+(m.d*0.4);
    el.style.left=Math.max(2,Math.min(75,sx/w*100))+'%';
    el.style.top=Math.min(65,vy)+'%';

    const isExact=m.d<4;
    const dirDiff=Math.abs(angleDiff(m.brg,heading));
    const arrow=dirDiff<10?'⬆':dirDiff<30?'↗':'→';

    el.innerHTML=`
      <div class="author"><div class="ava">${m.nick[0].toUpperCase()}</div>@${escapeHtml(m.nick)}<span class="dirArrow">${arrow}</span></div>
      <div class="text">${escapeHtml(m.text)}</div>
      <div class="meta">
        <span>📍 ${m.d.toFixed(1)}м</span>
        <span>🧭 ${Math.round(m.brg)}°</span>
        <span>⏱ ${timeAgo(m.ts)}</span>
      </div>
      ${isExact?'<div class="exact">🎯 ТЫ НА МЕСТЕ! Повернися на '+Math.round(m.brg)+'°</div>':''}
    `;
    ov.appendChild(el);
  });
}

// ===== RADAR =====
function updateRadar(){
  if(myLat===null)return;
  const radar=document.getElementById('radar');
  radar.querySelectorAll('.blip').forEach(b=>b.remove());

  const nearby=[];
  Object.entries(messages).forEach(([id,m])=>{
    if(!m||!m.lat||!m.lng)return;
    const msgFloor=m.floor||1;
    if(msgFloor!==myFloor)return;
    const d=distMeters(myLat,myLng,m.lat,m.lng);
    if(d<100)nearby.push({d,brg:bearing(myLat,myLng,m.lat,m.lng),...m});
  });

  nearby.sort((a,b)=>a.d-b.d);

  nearby.forEach(m=>{
    const blip=document.createElement('div');
    blip.className='blip '+(m.d<10?'near':'far');
    // Относительный угол на радаре (heading = вверх)
    const relAngle=toRad(m.brg-heading-90);
    const r=Math.min(48,(m.d/100)*48);
    const cx=55 + r*Math.cos(relAngle);
    const cy=55 + r*Math.sin(relAngle);
    blip.style.left=cx+'px';
    blip.style.top=cy+'px';
    radar.appendChild(blip);
  });

  if(nearby.length>0){
    const c=nearby[0];
    const dirs=['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];
    const idx=Math.round(c.brg/45)%8;
    document.getElementById('radarDir').innerHTML='🎯 '+c.d.toFixed(1)+'м<br>'+dirs[idx]+' · Этаж '+myFloor;
  }else{
    document.getElementById('radarDir').textContent='Нет сообщений · Этаж '+myFloor;
  }
}

// ===== DIST HUD =====
function updateDistHud(){
  if(myLat===null)return;
  const hud=document.getElementById('distHud');
  let closest=Infinity;
  Object.values(messages).forEach(m=>{
    if(!m||!m.lat||!m.lng)return;
    const mf=m.floor||1;
    if(mf!==myFloor)return;
    const d=distMeters(myLat,myLng,m.lat,m.lng);
    if(d<closest)closest=d;
  });

  if(closest<Infinity){
    hud.classList.add('show');
    const val=document.getElementById('bigDistVal');
    val.textContent=closest<1000?closest.toFixed(1)+'м':(closest/1000).toFixed(1)+'км';
    val.className='bigDist '+(closest<5?'':'far');
    document.getElementById('bigDistLabel').textContent=closest<4?'🎯 ТЫ НА МЕСТЕ!':'до ближайшего · Этаж '+myFloor;
  }else{
    hud.classList.remove('show');
  }
}

// ===== NEARBY PANEL =====
function updateNearbyPanel(){
  const p=document.getElementById('nearbyPanel');
  if(myLat===null){p.innerHTML='';return}
  const nearby=[];
  Object.entries(messages).forEach(([id,m])=>{
    if(!m||!m.lat||!m.lng)return;
    const mf=m.floor||1;
    if(mf!==myFloor)return;
    const d=distMeters(myLat,myLng,m.lat,m.lng);
    if(d<200)nearby.push({d,brg:bearing(myLat,myLng,m.lat,m.lng),...m});
  });
  nearby.sort((a,b)=>a.d-b.d);
  if(nearby.length===0){p.innerHTML='';return}
  let html='<h3>📍 Этаж '+myFloor+' — '+nearby.length+' сообщений</h3>';
  nearby.slice(0,12).forEach(m=>{
    const exact=m.d<4?'🎯 ТОЧНОЕ ПОПАДАНИЕ':'';
    const dirs=['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];
    const dir=dirs[Math.round(m.brg/45)%8];
    html+=`<div class="nearbyItem">
      <span class="nAuthor">@${escapeHtml(m.nick)}</span> <span class="nText">${escapeHtml(m.text)}</span>
      <div class="nDist">${m.d.toFixed(1)}м · ${dir} ${Math.round(m.brg)}° · ${timeAgo(m.ts)}</div>
      ${exact?'<div class="nExact">'+exact+'</div>':''}
    </div>`;
  });
  p.innerHTML=html;
}

// ===== CAMERA =====
async function toggleCamera(){
  const btn=document.getElementById('camToggleBtn');
  const view=document.getElementById('cameraView');
  const feed=document.getElementById('cameraFeed');

  if(cameraOn){
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    view.style.display='none';
    btn.classList.remove('on');
    cameraOn=false;
    document.body.style.background='#0a0a0f';
  }else{
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      feed.srcObject=stream;
      view.style.display='block';
      btn.classList.add('on');
      cameraOn=true;
      showToast('Камера ON. Наводи на '+Math.round(heading)+'°');
    }catch(e){showToast('Камера недоступна: '+e.message)}
  }
}

// ===== AUTO-LOGIN =====
auth.onAuthStateChanged(user=>{
  if(!user){
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('loader').style.display='none';
  }
});

document.getElementById('msgInput').addEventListener('focus',()=>{
  setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),300);
});
