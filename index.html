<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Meow</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0a0a0a; --surface:#141414; --surface2:#1e1e1e; --text:#fff; --text2:#888; --accent:#e60023; --radius:16px;
  }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #app { height:100%; display:flex; flex-direction:column; }

  /* Safe area for Android address bar */
  .safe-top { height:env(safe-area-inset-top,0); background:var(--bg); }

  /* Header */
  .header {
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 16px 4px; background:var(--bg); position:sticky; top:0; z-index:100;
  }
  .tabs { display:flex; gap:20px; }
  .tab { font-size:16px; font-weight:600; color:var(--text2); padding-bottom:6px; position:relative; cursor:pointer; }
  .tab.active { color:var(--text); }
  .tab.active::after { content:""; position:absolute; bottom:0; left:0; right:0; height:2.5px; background:var(--text); border-radius:2px; }
  .filter-btn {
    width:36px; height:36px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .filter-btn svg { width:18px; height:18px; stroke:var(--text); fill:none; stroke-width:2; }

  /* Feed */
  .feed-wrap { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 8px 80px; }
  .feed { column-count:2; column-gap:8px; }
  .pin {
    break-inside:avoid; margin-bottom:8px; border-radius:var(--radius); overflow:hidden; background:var(--surface); position:relative; cursor:pointer; animation:fadeIn .4s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .pin img { width:100%; display:block; border-radius:var(--radius); }
  .pin-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.6) 0%,transparent 50%); opacity:0; transition:opacity .2s; border-radius:var(--radius); }
  .pin:hover .pin-overlay, .pin:active .pin-overlay { opacity:1; }
  .pin-actions { position:absolute; bottom:8px; left:8px; right:8px; display:flex; justify-content:space-between; align-items:center; opacity:0; transition:opacity .2s; }
  .pin:hover .pin-actions, .pin:active .pin-actions { opacity:1; }
  .pin-like { color:var(--text); font-size:13px; display:flex; align-items:center; gap:4px; }
  .pin-like.liked { color:var(--accent); }
  .pin-more { color:var(--text); padding:4px; }
  .pin-title { padding:8px 10px 10px; font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Bottom Nav */
  .bottom-nav {
    position:fixed; bottom:0; left:0; right:0; height:56px; background:var(--bg); border-top:1px solid var(--surface2);
    display:flex; justify-content:space-around; align-items:center; padding-bottom:env(safe-area-inset-bottom,0); z-index:100;
  }
  .nav-item { width:48px; height:48px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:50%; transition:background .2s; }
  .nav-item:active { background:var(--surface2); }
  .nav-item svg { width:24px; height:24px; stroke:var(--text2); fill:none; stroke-width:2; }
  .nav-item.active svg { stroke:var(--text); }
  .nav-item.add { background:var(--text); }
  .nav-item.add svg { stroke:var(--bg); }
  .nav-avatar { width:28px; height:28px; border-radius:50%; object-fit:cover; border:2px solid var(--text2); }
  .nav-item.active .nav-avatar { border-color:var(--text); }

  /* Auth Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.show { display:flex; }
  .modal { background:var(--surface); border-radius:var(--radius); padding:28px 24px; width:100%; max-width:340px; }
  .modal h2 { font-size:20px; margin-bottom:20px; text-align:center; }
  .modal input { width:100%; padding:14px 16px; border-radius:12px; border:none; background:var(--surface2); color:var(--text); font-size:15px; margin-bottom:12px; outline:none; }
  .modal input::placeholder { color:var(--text2); }
  .modal button { width:100%; padding:14px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer; margin-top:8px; }
  .modal .switch { text-align:center; margin-top:16px; color:var(--text2); font-size:14px; cursor:pointer; }
  .modal .switch span { color:var(--text); text-decoration:underline; }
  .modal .error { color:#ff4444; font-size:13px; margin-top:8px; text-align:center; display:none; }

  /* Upload Modal */
  .upload-modal { position:fixed; inset:0; background:var(--bg); z-index:200; display:none; flex-direction:column; }
  .upload-modal.show { display:flex; }
  .upload-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--surface2); }
  .upload-header h3 { font-size:16px; }
  .upload-header .cancel { color:var(--text2); font-size:14px; cursor:pointer; }
  .upload-header .done { color:var(--accent); font-size:14px; font-weight:600; cursor:pointer; }
  .upload-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .upload-btn {
    width:160px; height:160px; border-radius:var(--radius); background:var(--surface2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; cursor:pointer; border:2px dashed var(--text2);
  }
  .upload-btn svg { width:40px; height:40px; stroke:var(--text2); fill:none; stroke-width:1.5; }
  .upload-btn span { color:var(--text2); font-size:14px; }
  .upload-preview { width:100%; max-height:50vh; object-fit:contain; border-radius:var(--radius); display:none; }
  .upload-title-input { width:100%; max-width:400px; padding:14px 16px; border-radius:12px; border:none; background:var(--surface2); color:var(--text); font-size:15px; margin-top:16px; outline:none; display:none; }
  .upload-title-input::placeholder { color:var(--text2); }

  /* Loading */
  .loader { position:fixed; inset:0; background:var(--bg); z-index:300; display:flex; align-items:center; justify-content:center; }
  .loader.hide { display:none; }
  .spinner { width:40px; height:40px; border:3px solid var(--surface2); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Empty state */
  .empty { text-align:center; padding:60px 20px; color:var(--text2); }
  .empty svg { width:64px; height:64px; stroke:var(--text2); fill:none; stroke-width:1.5; margin-bottom:16px; }
  .empty p { font-size:15px; }

  /* Toast */
  .toast { position:fixed; bottom:72px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--surface2); color:var(--text); padding:10px 20px; border-radius:20px; font-size:14px; z-index:250; opacity:0; transition:all .3s; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

  /* Scrollbar hide */
  .feed-wrap::-webkit-scrollbar { display:none; }
  .feed-wrap { -ms-overflow-style:none; scrollbar-width:none; }
</style>
</head>
<body>
<div class="loader" id="loader"><div class="spinner"></div></div>

<div id="app">
  <div class="safe-top"></div>
  <div class="header">
    <div class="tabs">
      <div class="tab active" data-tab="for-you">Для вас</div>
      <div class="tab" data-tab="saved">Сохраненное</div>
    </div>
    <div class="filter-btn" id="filterBtn">
      <svg viewBox="0 0 24 24"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
    </div>
  </div>

  <div class="feed-wrap" id="feedWrap">
    <div class="feed" id="feed"></div>
    <div class="empty" id="empty" style="display:none;">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      <p>Нет сохраненных пинов</p>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div class="nav-item" data-nav="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </div>
    <div class="nav-item add" id="addBtn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div class="nav-item" data-nav="messages">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div class="nav-item" data-nav="profile" id="profileNav">
      <svg viewBox="0 0 24 24" id="profileIcon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <img src="" class="nav-avatar" id="navAvatar" style="display:none;">
    </div>
  </div>
</div>

<!-- Auth Modal -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <h2 id="authTitle">Вход</h2>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPass" placeholder="Пароль">
    <div class="error" id="authError"></div>
    <button id="authBtn">Войти</button>
    <div class="switch" id="authSwitch">Нет аккаунта? <span>Регистрация</span></div>
  </div>
</div>

<!-- Upload Modal -->
<div class="upload-modal" id="uploadModal">
  <div class="upload-header">
    <div class="cancel" id="uploadCancel">Отмена</div>
    <h3>Создать пин</h3>
    <div class="done" id="uploadDone" style="opacity:.3;pointer-events:none;">Готово</div>
  </div>
  <div class="upload-area">
    <div class="upload-btn" id="uploadBtn">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Выбрать из галереи</span>
    </div>
    <img class="upload-preview" id="uploadPreview">
    <input type="text" class="upload-title-input" id="uploadTitle" placeholder="Добавьте название">
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
  authDomain: "meow-874ce.firebaseapp.com",
  databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "meow-874ce",
  storageBucket: "meow-874ce.firebasestorage.app",
  messagingSenderId: "471541334599",
  appId: "1:471541334599:web:567af3e7dbe70a37572762"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();

// State
let currentUser = null;
let userKey = null;
let pins = [];
let currentTab = 'for-you';
let uploadFile = null;
let isLogin = true;

// DOM
const loader = document.getElementById('loader');
const authModal = document.getElementById('authModal');
const authTitle = document.getElementById('authTitle');
const authEmail = document.getElementById('authEmail');
const authPass = document.getElementById('authPass');
const authBtn = document.getElementById('authBtn');
const authSwitch = document.getElementById('authSwitch');
const authError = document.getElementById('authError');
const feed = document.getElementById('feed');
const feedWrap = document.getElementById('feedWrap');
const empty = document.getElementById('empty');
const uploadModal = document.getElementById('uploadModal');
const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const uploadPreview = document.getElementById('uploadPreview');
const uploadTitle = document.getElementById('uploadTitle');
const uploadDone = document.getElementById('uploadDone');
const uploadCancel = document.getElementById('uploadCancel');
const toast = document.getElementById('toast');
const navAvatar = document.getElementById('navAvatar');
const profileIcon = document.getElementById('profileIcon');

// Crypto helpers
async function deriveKey(email, password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(email + password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode('meow-salt-fixed'), iterations: 100000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encryptData(key, data) {
  const enc = new TextEncoder();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(data));
  return btoa(String.fromCharCode(...iv, ...new Uint8Array(encrypted)));
}

async function decryptData(key, base64) {
  const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  const iv = bytes.slice(0, 12);
  const data = bytes.slice(12);
  const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(decrypted);
}

// Image compression
async function compressImage(file, maxWidth = 1200, quality = 0.85) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
    };
    img.src = URL.createObjectURL(file);
  });
}

// Auth
authBtn.addEventListener('click', async () => {
  const email = authEmail.value.trim();
  const pass = authPass.value.trim();
  if (!email || !pass) { showAuthError('Введите email и пароль'); return; }
  authBtn.disabled = true; authBtn.textContent = '...';
  try {
    if (isLogin) {
      await auth.signInWithEmailAndPassword(email, pass);
    } else {
      await auth.createUserWithEmailAndPassword(email, pass);
    }
    authModal.classList.remove('show');
  } catch (e) {
    showAuthError(e.message);
  }
  authBtn.disabled = false; authBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
});

authSwitch.addEventListener('click', () => {
  isLogin = !isLogin;
  authTitle.textContent = isLogin ? 'Вход' : 'Регистрация';
  authBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
  authSwitch.innerHTML = isLogin ? 'Нет аккаунта? <span>Регистрация</span>' : 'Есть аккаунт? <span>Вход</span>';
  authError.style.display = 'none';
});

function showAuthError(msg) { authError.textContent = msg; authError.style.display = 'block'; }

// Auth state
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    userKey = btoa(user.email).replace(/[^a-zA-Z0-9]/g, '');
    authModal.classList.remove('show');
    navAvatar.style.display = 'block';
    navAvatar.src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.email}`;
    profileIcon.style.display = 'none';
    await loadPins();
  } else {
    authModal.classList.add('show');
    navAvatar.style.display = 'none';
    profileIcon.style.display = 'block';
  }
  loader.classList.add('hide');
});

// Load pins
async function loadPins() {
  if (!currentUser) return;
  const key = await deriveKey(currentUser.email, authPass.value || '');
  const snap = await db.ref(`pins/${userKey}`).once('value');
  const data = snap.val() || {};
  pins = [];
  for (const id in data) {
    try {
      const decrypted = await decryptData(key, data[id].data);
      pins.push({ id, ...JSON.parse(decrypted) });
    } catch (e) { console.log('Decrypt fail', id); }
  }
  pins.sort((a, b) => b.timestamp - a.timestamp);
  renderPins();
}

// Render
function renderPins() {
  const filtered = currentTab === 'for-you' ? pins : pins.filter(p => p.liked);
  if (filtered.length === 0) { feed.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  feed.innerHTML = filtered.map(p => `
    <div class="pin" data-id="${p.id}">
      <img src="${p.url}" alt="${p.title || ''}" loading="lazy">
      <div class="pin-overlay"></div>
      <div class="pin-actions">
        <div class="pin-like ${p.liked ? 'liked' : ''}" onclick="toggleLike('${p.id}', event)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="${p.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          ${p.likes || 0}
        </div>
        <div class="pin-more" onclick="deletePin('${p.id}', event)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </div>
      </div>
      ${p.title ? `<div class="pin-title">${escapeHtml(p.title)}</div>` : ''}
    </div>
  `).join('');
}

function escapeHtml(t) {
  const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
}

// Tabs
 document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    renderPins();
  });
});

// Upload
addBtn.addEventListener('click', () => {
  if (!currentUser) { showToast('Войдите в аккаунт'); return; }
  uploadModal.classList.add('show');
});

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  uploadFile = file;
  const url = URL.createObjectURL(file);
  uploadPreview.src = url;
  uploadPreview.style.display = 'block';
  uploadBtn.style.display = 'none';
  uploadTitle.style.display = 'block';
  uploadDone.style.opacity = '1';
  uploadDone.style.pointerEvents = 'auto';
});

uploadCancel.addEventListener('click', resetUpload);

uploadDone.addEventListener('click', async () => {
  if (!uploadFile || !currentUser) return;
  uploadDone.textContent = '...'; uploadDone.style.pointerEvents = 'none';
  try {
    const compressed = await compressImage(uploadFile);
    const fileName = `${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
    const ref = storage.ref(`pins/${userKey}/${fileName}`);
    await ref.put(compressed);
    const url = await ref.getDownloadURL();

    const key = await deriveKey(currentUser.email, authPass.value || '');
    const pinData = {
      url, title: uploadTitle.value.trim() || '',
      timestamp: Date.now(), liked: false, likes: 0
    };
    const encrypted = await encryptData(key, JSON.stringify(pinData));
    await db.ref(`pins/${userKey}/${Date.now()}`).set({ data: encrypted });

    showToast('Пин сохранен!');
    resetUpload();
    await loadPins();
  } catch (e) {
    showToast('Ошибка: ' + e.message);
    uploadDone.textContent = 'Готово';
    uploadDone.style.pointerEvents = 'auto';
  }
});

function resetUpload() {
  uploadModal.classList.remove('show');
  uploadFile = null; fileInput.value = '';
  uploadPreview.style.display = 'none';
  uploadBtn.style.display = 'flex';
  uploadTitle.style.display = 'none'; uploadTitle.value = '';
  uploadDone.textContent = 'Готово';
  uploadDone.style.opacity = '.3';
  uploadDone.style.pointerEvents = 'none';
}

// Like
window.toggleLike = async (id, e) => {
  e.stopPropagation();
  const pin = pins.find(p => p.id === id);
  if (!pin || !currentUser) return;
  pin.liked = !pin.liked;
  pin.likes = (pin.likes || 0) + (pin.liked ? 1 : -1);
  const key = await deriveKey(currentUser.email, authPass.value || '');
  const encrypted = await encryptData(key, JSON.stringify(pin));
  await db.ref(`pins/${userKey}/${id}`).update({ data: encrypted });
  renderPins();
};

// Delete
window.deletePin = async (id, e) => {
  e.stopPropagation();
  if (!confirm('Удалить пин?')) return;
  await db.ref(`pins/${userKey}/${id}`).remove();
  pins = pins.filter(p => p.id !== id);
  renderPins();
  showToast('Пин удален');
};

// Toast
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// Bottom nav
 document.querySelectorAll('.nav-item[data-nav]').forEach(n => {
  n.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    n.classList.add('active');
    const nav = n.dataset.nav;
    if (nav === 'home') { currentTab = 'for-you'; renderPins(); }
    if (nav === 'search') showToast('Поиск скоро...');
    if (nav === 'messages') showToast('Сообщения скоро...');
    if (nav === 'profile') { currentTab = 'saved'; renderPins(); }
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
  });
});

// Filter
 document.getElementById('filterBtn').addEventListener('click', () => {
  showToast('Фильтры скоро...');
});

// Infinite scroll
