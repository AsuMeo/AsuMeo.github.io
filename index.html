<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Meow P2P Messenger Ultra</title>
  <!-- Firebase App & Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- PeerJS for WebRTC Abstraction -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- JSZip for Exporting Archive Backups -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    /* PURE BLACK MODERN THEME - NO GRADIENTS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    :root {
      --bg-black: #000000;
      --bg-surface: #0a0a0a;
      --bg-card: #141414;
      --bg-input: #1f1f1f;
      --bg-bubble-self: #1e293b;
      --bg-bubble-peer: #171717;
      --border-color: #262626;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #eab308;
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    body, html {
      background-color: var(--bg-black);
      color: var(--text-main);
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
    }

    /* APP CONTAINER */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background-color: var(--bg-black);
      position: relative;
    }

    /* SCREEN MANAGEMENT */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-black);
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: scale(0.98);
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      z-index: 10;
    }

    /* AUTH SCREEN */
    .auth-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      height: 100%;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }

    .auth-logo {
      width: 72px;
      height: 72px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .auth-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
      text-align: center;
    }

    .form-group {
      width: 100%;
      margin-bottom: 14px;
    }

    .input-field {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .auth-toggle {
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    /* HEADER UI */
    .app-header {
      height: 60px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;\
      padding: 0 16px;
      z-index: 20;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-info-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .online-indicator {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--text-muted);
      display: inline-block;
    }

    .online-indicator.active {
      background-color: var(--success);
    }

    .online-indicator.connecting {
      background-color: var(--warning);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: transparent;
      border: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .icon-btn:active {
      background-color: var(--bg-card);
    }

    /* CHATS LIST SCREEN */
    .chat-search-bar {
      padding: 12px 16px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .chats-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .chat-item:active {
      background-color: var(--bg-card);
    }

    .chat-item-details {
      flex: 1;
      min-width: 0;
    }

    .chat-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-item-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .chat-item-preview {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CONVERSATION MESSAGES SCREEN */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .message-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-break: break-word;
      user-select: text;
    }

    .message-bubble.self {
      align-self: flex-end;
      background-color: var(--bg-bubble-self);
      border-bottom-right-radius: 4px;
      border: 1px solid #334155;
    }

    .message-bubble.peer {
      align-self: flex-start;
      background-color: var(--bg-bubble-peer);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .message-time {
      font-size: 10px;
      color: var(--text-muted);
      text-align: right;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .message-media {
      max-width: 100%;
      border-radius: var(--radius-md);
      margin-top: 4px;
      display: block;
    }

    /* TELEGRAM CIRCLE VIDEO NOTE */
    .circle-video {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      background-color: #000;
    }

    .audio-player {
      width: 220px;
      height: 40px;
      margin-top: 4px;
    }

    /* REACTIONS POPUP */
    .reactions-bar {
      display: flex;
      gap: 6px;
      padding: 4px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      position: absolute;
      top: -38px;
      right: 10px;
      z-index: 100;
    }

    .reaction-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 4px;
    }

    .reaction-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2px 6px;
      font-size: 11px;
      margin-top: 4px;
    }

    /* INPUT BAR */
    .chat-input-bar {
      padding: 10px 12px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 22px;
      font-size: 15px;
      outline: none;
      max-height: 100px;
      resize: none;
    }

    /* MODAL WINDOWS */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.88);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    /* VIDEO CIRCLE RECORDER OVERLAY */
    .circle-recorder-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
    }

    .circle-recorder-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .recorder-preview-container {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--accent);
      background-color: #111;
      position: relative;
    }

    .recorder-preview-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .recording-timer {
      font-size: 20px;
      font-weight: 700;
      color: var(--danger);
    }

    .recorder-controls {
      display: flex;
      gap: 20px;
    }

    /* SVG ICONS */
    .svg-icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="app">

    <!-- 1. AUTH SCREEN -->
    <div id="screen-auth" class="screen active">
      <div class="auth-container">
        <div class="auth-logo">
          <svg class="svg-icon" style="width: 36px; height: 36px;" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="auth-title" id="auth-title-text">Вход в Meow P2P</div>
        <div class="auth-subtitle">Сквозное шифрование &amp; Авто-восстановление P2P</div>

        <div class="form-group">
          <input type="text" id="auth-username" class="input-field" placeholder="Юзернейм (@username)" autocomplete="off">
        </div>
        <div class="form-group">
          <input type="password" id="auth-password" class="input-field" placeholder="Пароль">
        </div>

        <button id="btn-auth-submit" class="btn">
          <span>Войти</span>
        </button>

        <div class="auth-toggle" id="btn-auth-toggle">Нет аккаунта? Зарегистрироваться</div>
      </div>
    </div>

    <!-- 2. MAIN CHATS SCREEN -->
    <div id="screen-chats" class="screen">
      <div class="app-header">
        <div class="header-user" id="btn-open-profile">
          <div class="avatar" id="header-my-avatar">?</div>
          <div>
            <div class="user-info-title" id="header-my-name">@user</div>
            <div class="user-info-subtitle">
              <span class="online-indicator active"></span> Онлайн (P2P)
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-open-search" title="Поиск юзера">
            <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </div>

      <div class="chat-search-bar">
        <input type="text" id="chats-search-input" class="input-field" placeholder="Поиск по чатам...">
      </div>

      <div class="chats-list" id="chats-list-container">
        <!-- Dynamic Chat items -->
      </div>
    </div>

    <!-- 3. CONVERSATION ACTIVE CHAT SCREEN -->
    <div id="screen-chat" class="screen">
      <div class="app-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="icon-btn" id="btn-chat-back">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          </button>
          <div class="avatar" id="chat-peer-avatar">?</div>
          <div>
            <div class="user-info-title" id="chat-peer-name">@peer</div>
            <div class="user-info-subtitle" id="chat-peer-status">
              <span class="online-indicator" id="peer-status-dot"></span>
              <span id="peer-status-text">Соединение...</span>
            </div>
          </div>
        </div>
      </div>

      <div class="messages-container" id="messages-container">
        <!-- Dynamic Messages -->
      </div>

      <div class="chat-input-bar">
        <button class="icon-btn" id="btn-attach-file" title="Прикрепить фото/видео">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input type="file" id="file-input-media" accept="image/*,video/*" class="hidden">

        <button class="icon-btn" id="btn-record-circle" title="Видео-кружочек Telegram">
          <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        </button>

        <textarea id="chat-msg-input" class="chat-input" rows="1" placeholder="Сообщение..."></textarea>

        <button class="icon-btn" id="btn-record-voice" title="Голосовое сообщение">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
        </button>

        <button class="icon-btn" id="btn-send-message" style="color: var(--accent);">
          <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>

  </div>

  <!-- SEARCH USER MODAL -->
  <div class="modal-overlay" id="modal-search">
    <div class="modal-card">
      <div class="modal-title">Найти собеседника</div>
      <input type="text" id="search-input-username" class="input-field" placeholder="Введите @username...">
      <div id="search-result" style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px;"></div>
      <button class="btn btn-secondary" id="btn-close-search">Закрыть</button>
    </div>
  </div>

  <!-- PROFILE & SETTINGS MODAL -->
  <div class="modal-overlay" id="modal-profile">
    <div class="modal-card">
      <div class="modal-title">Мой Профиль</div>
      
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div class="avatar" id="profile-modal-avatar-preview" style="width: 80px; height: 80px; font-size: 28px;">?</div>
        <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; font-size: 13px;" id="btn-choose-avatar">
          Выбрать из галереи
        </button>
        <input type="file" id="file-input-avatar" accept="image/*" class="hidden">
      </div>

      <div class="form-group">
        <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">Описание профиля (Bio)</label>
        <input type="text" id="profile-bio-input" class="input-field" placeholder="О себе...">
      </div>

      <button class="btn" id="btn-save-profile">Сохранить профиль</button>

      <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 4px 0;">

      <!-- EXPORT / IMPORT BACKUP SECTION -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-secondary" id="btn-export-backup">
          📦 Экспортировать ZIP бекап (Ключи + Переписка)
        </button>
        
        <button class="btn btn-secondary" id="btn-import-backup">
          📥 Импортировать ZIP бекап
        </button>
        <input type="file" id="file-input-import" accept=".zip" class="hidden">
      </div>

      <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 4px 0;">
      
      <button class="btn btn-danger" id="btn-clear-cache">
        Очистить кэш и сообщения
      </button>

      <button class="btn btn-secondary" id="btn-logout">Выйти</button>
      <button class="btn btn-secondary" id="btn-close-profile">Закрыть</button>
    </div>
  </div>

  <!-- VIDEO CIRCLE RECORDER OVERLAY -->
  <div class="circle-recorder-overlay" id="circle-recorder-modal">
    <div class="recording-timer" id="circle-timer">00:00</div>
    <div class="recorder-preview-container">
      <video id="circle-video-preview" class="recorder-preview-video" autoplay playsinline muted></video>
    </div>
    <div class="recorder-controls">
      <button class="btn btn-danger" id="btn-cancel-circle" style="width: 100px;">Отмена</button>
      <button class="btn" id="btn-stop-send-circle" style="width: 140px;">Отправить</button>
    </div>
  </div>

  <script>
    /* -------------------------------------------------------------------
       FIREBASE CONFIGURATION

    /* -------------------------------------------------------------------
       STATE & ENCRYPTION CRYPTO MODULE (Web Crypto API ECDH + AES-GCM)

    let currentUser = null; // { username, bio, avatar, keyPair, exportedPrivateKeyJwk, peerId }
    let activePeer = null; // cleanUserKey
    let peerConnections = {}; // cleanUserKey -> { conn: DataConnection, sharedKey: CryptoKey, reconnectTimer, pingInterval, isP2POpen }
    let localDB = null;
    let voiceRecorder = null;

    let typingTimeout = null;
    let peer = null; // PeerJS instance

    function cleanUserKey(username) {
      return username.toLowerCase().replace(/[^a-z0-9_]/g, '');
    }

    async function hashPassword(password) {
      const msgUint8 = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Generate ECDH Key Pair
    async function generateECDHKeyPair() {
      return await window.crypto.subtle.generateKey(
        { name: "ECDH", namedCurve: "P-256" },
        true,
        ["deriveKey", "deriveBits"]
      );
    }

    async function exportPublicKey(key) {
      return await window.crypto.subtle.exportKey("jwk", key);
    }

    async function exportPrivateKey(key) {
      return await window.crypto.subtle.exportKey("jwk", key);
    }

    async function importPrivateKey(jwk) {
      return await window.crypto.subtle.importKey(
        "jwk",
        jwk,
        { name: "ECDH", namedCurve: "P-256" },
        true,
        ["deriveKey", "deriveBits"]
      );
    }

    async function deriveSharedAESKey(privateKey, peerJwk) {
      const peerPublicKey = await window.crypto.subtle.importKey(
        "jwk",
        peerJwk,
        { name: "ECDH", namedCurve: "P-256" },
        true,
        []
      );
      return await window.crypto.subtle.deriveKey(
        { name: "ECDH", public: peerPublicKey },
        privateKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(key, payloadObj) {
      const text = JSON.stringify(payloadObj);
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const encodedText = new TextEncoder().encode(text);
      const encryptedContent = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        encodedText
      );
      return {
        iv: Array.from(iv),
        cipher: Array.from(new Uint8Array(encryptedContent))
      };
    }

    async function decryptPayload(key, encryptedObj) {
      const iv = new Uint8Array(encryptedObj.iv);
      const cipher = new Uint8Array(encryptedObj.cipher);
      const decryptedBuffer = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        cipher
      );
      const decodedText = new TextDecoder().decode(decryptedBuffer);
      return JSON.parse(decodedText);
    }

    /* -------------------------------------------------------------------
       INDEXEDDB LOCAL STORAGE (MOBILE LOCAL CACHE)
       ------------------------------------------------------------------- */
    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("MeowP2P_Cache_DB_v2", 1);
        request.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains("messages")) {
            const store = dbInstance.createObjectStore("messages", { keyPath: "id" });
            store.createIndex("chatPeer", "chatPeer", { unique: false });
          }
        };
        request.onsuccess = (e) => {
          localDB = e.target.result;
          resolve(localDB);
        };
        request.onerror = (e) => reject(e);
      });
    }

    async function saveMessageToLocalDB(msg) {
      if (!localDB) await initIndexedDB();
      const tx = localDB.transaction("messages", "readwrite");
      tx.objectStore("messages").put(msg);
    }

    async function getAllMessagesFromLocalDB() {
      if (!localDB) await initIndexedDB();
      return new Promise((resolve) => {
        const tx = localDB.transaction("messages", "readonly");
        const store = tx.objectStore("messages");
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    async function getLocalMessagesForChat(peerUsername) {
      if (!localDB) await initIndexedDB();
      return new Promise((resolve) => {
        const tx = localDB.transaction("messages", "readonly");
        const store = tx.objectStore("messages");
        const index = store.index("chatPeer");
        const request = index.getAll(peerUsername);
        request.onsuccess = () => resolve(request.result || []);
      });
    }

    async function clearAllLocalCache() {
      if (!localDB) await initIndexedDB();
      const tx = localDB.transaction("messages", "readwrite");
      tx.objectStore("messages").clear();
      localStorage.clear();
    }

    /* -------------------------------------------------------------------
       PEERJS P2P ENGINE WITH AUTO-RECONNECT & PING-PONG
       ------------------------------------------------------------------- */
    
    function listenForIncomingSignals() {
      if (!currentUser) return;
      const myKey = cleanUserKey(currentUser.username);

      // Listen for incoming PeerJS DataConnections
      if (!peer) { // Ensure PeerJS is initialized
        console.error("PeerJS not initialized yet!");
        return;
      }

      peer.on('connection', async (conn) => {
        // Incoming connection from another peer
        const peerId = conn.peer;
        const targetUserKey = cleanUserKey(peerId);
        console.log(`Incoming PeerJS connection from: ${peerId}`);

        peerConnections[targetUserKey] = peerConnections[targetUserKey] || {};

        // Derive shared AES key (public key should be in Firebase)
        const peerSnap = await db.ref(`users/${targetUserKey}`).once('value');
        const peerData = peerSnap.val();
        if (peerData && peerData.publicKey && currentUser.keyPair?.privateKey) {
            peerConnections[targetUserKey].sharedKey = await deriveSharedAESKey(currentUser.keyPair.privateKey, peerData.publicKey);
        } else {
            console.error(`Public key not found for ${targetUserKey}. Cannot establish E2EE for incoming connection.`);
            conn.close(); // Close connection if E2EE not possible
            return;
        }

        setupPeerJSConnectionEvents(targetUserKey, conn);
      });

      peer.on('error', (err) => {
        console.error('PeerJS global error:', err);
        // This often catches errors like network issues for the PeerJS server itself.
        // It doesn't necessarily mean a specific data connection failed.
        // If the peer instance itself fails, consider reloading or re-initializing.
      });

      // Listen for fallback messages (if P2P fails)
      const fallbackMsgsRef = db.ref(`fallback_msgs/${myKey}`);
      fallbackMsgsRef.on('child_added', async (senderSnapshot) => {
        const senderKey = senderSnapshot.key;
        senderSnapshot.forEach(async (msgSnapshot) => {
            const encryptedObj = msgSnapshot.val();
            const msgId = msgSnapshot.key;
            db.ref(`fallback_msgs/${myKey}/${senderKey}/${msgId}`).remove(); // Consume message

            let sharedKey = peerConnections[senderKey]?.sharedKey;
            if (!sharedKey) {
                const senderSnap = await db.ref(`users/${senderKey}`).once('value');
                const senderData = senderSnap.val();
                if (senderData && senderData.publicKey && currentUser.keyPair?.privateKey) {
                     sharedKey = await deriveSharedAESKey(currentUser.keyPair.privateKey, senderData.publicKey);
                     peerConnections[senderKey] = peerConnections[senderKey] || {};
                     peerConnections[senderKey].sharedKey = sharedKey;
                } else {
                    console.error(`Cannot derive shared key for fallback message from ${senderKey}. Missing public key or private key.`);
                    return;
                }
            }

            try {
              const decryptedMsg = await decryptPayload(sharedKey, encryptedObj);
              if (decryptedMsg.type === 'reaction_update') {
                // Update local message reaction
                const localMsgs = await getLocalMessagesForChat(senderKey);
                const target = localMsgs.find(m => m.id === decryptedMsg.msgId);
                if (target) {
                  target.reaction = decryptedMsg.reaction;
                  await saveMessageToLocalDB(target);
                  if (activePeer === senderKey) {
                    const elem = document.querySelector(`[data-msg-id="${target.id}"]`);
                    if (elem) {
                      let badge = elem.querySelector('.reaction-badge');
                      if (!badge) {
                        badge = document.createElement('div');
                        badge.className = 'reaction-badge';
                        elem.appendChild(badge);
                      }
                      badge.innerText = decryptedMsg.reaction;
                    }
                  }
                }
              } else {
                await saveMessageToLocalDB(decryptedMsg);
                if (activePeer === senderKey) {
                  renderSingleMessage(decryptedMsg);
                }
                refreshChatsListUI();
              }
            } catch (e) {
              console.error("Failed to decrypt fallback message:", e);
            }
        });
      });

      // Listen for typing events via Firebase signaling
      db.ref(`typing/${myKey}`).on('value', (snap) => {
        const val = snap.val();
        if (activePeer && val && val.from === activePeer) {
          if (val.isTyping) {
            updatePeerStatusText("печатает...", true);
          } else {
            updatePeerStatusText(peerConnections[activePeer]?.isP2POpen ? "Онлайн (P2P)" : "Онлайн", false);
          }
        }
      });
    }

    async function initP2PConnection(targetUserKey) {
      targetUserKey = cleanUserKey(targetUserKey);
      const myUserKey = cleanUserKey(currentUser.username);

      // If connection exists and open, return it
      if (peerConnections[targetUserKey] && peerConnections[targetUserKey].conn && peerConnections[targetUserKey].conn.open) {
        return peerConnections[targetUserKey];
      }

      cleanupPeerConnection(targetUserKey); // Clear any old state

      // Fetch PeerJS ID and Public Key of target user from Firebase
      const peerSnap = await db.ref(`users/${targetUserKey}`).once('value');
      const peerData = peerSnap.val();
      const peerPeerId = peerData?.peerId;

      if (!peerPeerId) {
        console.warn(`PeerJS ID not found for ${targetUserKey}. Cannot establish P2P.`);
        return null;
      }

      // Initialize peerConnections object for this target
      peerConnections[targetUserKey] = peerConnections[targetUserKey] || {};

      // Derive shared AES key (this part is independent of PeerJS)
      if (peerData && peerData.publicKey) {
        peerConnections[targetUserKey].sharedKey = await deriveSharedAESKey(currentUser.keyPair.privateKey, peerData.publicKey);
      } else {
         console.warn(`Public key not found for ${targetUserKey}. Cannot establish E2EE.`);
         return null;
      }

      // Create a PeerJS DataConnection
      console.log(`Attempting PeerJS connection to ${peerPeerId}`);
      const conn = peer.connect(peerPeerId, { reliable: true }); // reliable: true for ordered, guaranteed delivery

      setupPeerJSConnectionEvents(targetUserKey, conn);

      return peerConnections[targetUserKey];
    }

    function setupPeerJSConnectionEvents(peerKey, conn) {
      peerConnections[peerKey].conn = conn; // Store the PeerJS DataConnection

      conn.on('open', () => {
        peerConnections[peerKey].isP2POpen = true;
        console.log(`PeerJS DataConnection opened with ${peerKey}`);
        if (activePeer === peerKey) {
          updatePeerStatusUI("Онлайн (P2P подключен)", "active");
        }
        startHeartbeat(peerKey);
      });

      conn.on('close', () => {
        peerConnections[peerKey].isP2POpen = false;
        console.log(`PeerJS DataConnection closed with ${peerKey}`);
        stopHeartbeat(peerKey);
        scheduleReconnection(peerKey);
      });

      conn.on('error', (err) => {
        console.error(`PeerJS DataConnection error with ${peerKey}:`, err);
        peerConnections[peerKey].isP2POpen = false;
        stopHeartbeat(peerKey);
        scheduleReconnection(peerKey);
      });

      conn.on('data', async (data) => {
        try {
          const raw = JSON.parse(data);
          
          if (raw.type === 'ping') {
            conn.send(JSON.stringify({ type: 'pong' }));
            return;
          }
          if (raw.type === 'pong') {
            return;
          }

          const decryptedMsg = await decryptPayload(peerConnections[peerKey].sharedKey, raw);
          
          if (decryptedMsg.type === 'reaction_update') {
            // Update local message reaction
            const localMsgs = await getLocalMessagesForChat(peerKey);
            const target = localMsgs.find(m => m.id === decryptedMsg.msgId);
            if (target) {
              target.reaction = decryptedMsg.reaction;
              await saveMessageToLocalDB(target);
              if (activePeer === peerKey) {
                const elem = document.querySelector(`[data-msg-id="${target.id}"]`);
                if (elem) {
                  let badge = elem.querySelector('.reaction-badge');
                  if (!badge) {
                    badge = document.createElement('div');
                    badge.className = 'reaction-badge';
                    elem.appendChild(badge);
                  }
                  badge.innerText = decryptedMsg.reaction;
                }
              }
            }
            return;
          }

          await saveMessageToLocalDB(decryptedMsg);

          if (activePeer === peerKey) {
            renderSingleMessage(decryptedMsg);
          }
          refreshChatsListUI();
        } catch (e) {
          console.error("Payload error (PeerJS DataChannel):", e);
        }
      });
    }

    function startHeartbeat(peerKey) {
      stopHeartbeat(peerKey);
      peerConnections[peerKey].pingInterval = setInterval(() => {
        const conn = peerConnections[peerKey]?.conn;
        if (conn && conn.open) {
          conn.send(JSON.stringify({ type: 'ping' }));
        } else {
          // If connection is not open, schedule reconnection
          scheduleReconnection(peerKey);
        }
      }, 5000); // Send ping every 5 seconds
    }

    function stopHeartbeat(peerKey) {
      if (peerConnections[peerKey]?.pingInterval) {
        clearInterval(peerConnections[peerKey].pingInterval);
        peerConnections[peerKey].pingInterval = null;
      }
    }

    function scheduleReconnection(peerKey) {
      if (peerConnections[peerKey]?.reconnectTimer) {
        // console.log(`Reconnection already scheduled for ${peerKey}`);
        return;
      }
      if (activePeer === peerKey) {
        updatePeerStatusUI("Переподключение P2P...", "connecting");
      }
      console.log(`Scheduling reconnection for ${peerKey}`);
      peerConnections[peerKey].reconnectTimer = setTimeout(() => {
        peerConnections[peerKey].reconnectTimer = null;
        initP2PConnection(peerKey); // Attempt to re-initialize connection
      }, 5000); // Try to reconnect after 5 seconds
    }

    function cleanupPeerConnection(peerKey) {
      stopHeartbeat(peerKey);
      if (peerConnections[peerKey]) {
        if (peerConnections[peerKey].reconnectTimer) {
          clearTimeout(peerConnections[peerKey].reconnectTimer);
          peerConnections[peerKey].reconnectTimer = null;
        }
        if (peerConnections[peerKey].conn) {
          try {
            peerConnections[peerKey].conn.close();
            console.log(`PeerJS connection to ${peerKey} closed during cleanup.`);
          } catch(e) { console.error('Error closing PeerJS conn during cleanup:', e); }
        }
        // No direct RTC object to close if using PeerJS abstraction.
        // PeerJS manages the underlying WebRTC PeerConnection.
      }
    }

    // Send payload over P2P DataChannel (with instant reconnect retry and Firebase fallback)
    async function sendP2PPayload(targetUserKey, payloadObj) {
      targetUserKey = cleanUserKey(targetUserKey);
      let peerConn = peerConnections[targetUserKey];

      // Ensure PeerJS connection is attempted/established
      if (!peerConn || !peerConn.conn || !peerConn.conn.open) {
        peerConn = await initP2PConnection(targetUserKey);
        if (!peerConn || !peerConn.sharedKey) {
          console.warn(`Could not establish PeerJS or shared key for ${targetUserKey}. Falling back to Firebase.`);
          const encrypted = await encryptPayload(peerConnections[targetUserKey]?.sharedKey || currentUser.keyPair.privateKey, payloadObj); // Use current user's private key as a fallback for shared key derivation if needed
          db.ref(`fallback_msgs/${targetUserKey}/${cleanUserKey(currentUser.username)}`).push(encrypted);
          return true;
        }
      }

      let attempts = 0;
      // Wait for PeerJS connection to open
      while ((!peerConn.conn || !peerConn.conn.open) && attempts < 15) { // Max 3 seconds wait
        await new Promise(r => setTimeout(r, 200));
        attempts++;
      }

      if (peerConn.conn && peerConn.conn.open) {
        const encrypted = await encryptPayload(peerConn.sharedKey, payloadObj);
        peerConn.conn.send(JSON.stringify(encrypted));
        return true;
      } else {
        // Fallback: push through signal mailbox fallback if P2P fails after retries
        console.warn('PeerJS DataConnection failed to open after retries. Using Firebase fallback.');
        const encrypted = await encryptPayload(peerConn.sharedKey, payloadObj);
        db.ref(`fallback_msgs/${targetUserKey}/${cleanUserKey(currentUser.username)}`).push(encrypted);
        return true;
      }
    }

    const btnAuthSubmit = document.getElementById('btn-auth-submit');

    btnAuthToggle.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      authTitleText.innerText = isRegisterMode ? "Регистрация Meow P2P" : "Вход в Meow P2P";
      btnAuthSubmit.querySelector('span').innerText = isRegisterMode ? "Зарегистрироваться" : "Войти";

    btnAuthSubmit.addEventListener('click', async () => {
      const usernameInput = document.getElementById('auth-username').value.trim();
      const passwordInput = document.getElementById('auth-password').value;

      if (!usernameInput || !passwordInput) {
        alert("Заполните юзернейм и пароль");
        return;
      }

      const formattedUser = usernameInput.startsWith('@') ? usernameInput : '@' + usernameInput;
      const userKey = cleanUserKey(formattedUser);
      const passHash = await hashPassword(passwordInput);

      const userRef = db.ref(`users/${userKey}`);
      const snapshot = await userRef.once('value');
      const existingData = snapshot.val();

      if (isRegisterMode) {
        if (existingData) {
          alert("Этот юзернейм уже занят!");
          return;
        }

        const keyPair = await generateECDHKeyPair();
        const publicJwk = await exportPublicKey(keyPair.publicKey);
        const privateJwk = await exportPrivateKey(keyPair.privateKey);

        const newUser = {
          username: formattedUser,
          passHash: passHash,
          bio: "Пользователь Meow P2P",
          avatar: "",
          publicKey: publicJwk,
          peerId: userKey, // Using clean username as PeerJS ID
          status: "online",
          lastSeen: Date.now()
        };

        await userRef.set(newUser);
        currentUser = { ...newUser, keyPair, exportedPrivateKeyJwk: privateJwk };
        setupOnlinePresence(userKey);
        finishLogin();
      } else {
        if (!existingData) {
          alert("Пользователь не найден!");
          return;
        }
        if (existingData.passHash !== passHash) {
          alert("Неверный пароль!");
          return;
        }

        // On login, we regenerate keys to ensure fresh session security and update Firebase
        const keyPair = await generateECDHKeyPair();
        const publicJwk = await exportPublicKey(keyPair.publicKey);
        const privateJwk = await exportPrivateKey(keyPair.privateKey);

        await userRef.update({ publicKey: publicJwk, peerId: userKey, status: "online", lastSeen: Date.now() });

        currentUser = { ...existingData, keyPair, exportedPrivateKeyJwk: privateJwk, peerId: userKey };
        setupOnlinePresence(userKey);
        finishLogin();
      }
    });

    function setupOnlinePresence(userKey) {
      const myStatusRef = db.ref(`users/${userKey}/status`);
      const myLastSeenRef = db.ref(`users/${userKey}/lastSeen`);
      const connectedRef = db.ref('.info/connected');

      connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
          myStatusRef.onDisconnect().set('offline');
          myLastSeenRef.onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);
          myStatusRef.set('online');
        }
      });
    }

          localStorage.setItem('meow_user', currentUser.username); // Re-set current user

        } else {
            alert("В бекап-файле отсутствуют ключи шифрования или данные пользователя. Импорт невозможен.");
            return;
        }

        // Import messages
        if (backupObj.messages && Array.isArray(backupObj.messages)) {
          for (const msg of backupObj.messages) {
            await saveMessageToLocalDB(msg);
          }
        }

        alert("Переписка и ключи шифрования успешно восстановлены! Приложение будет перезагружено.");
        window.location.reload();
      } catch (err) {
        alert("Ошибка импорта бекапа: " + err.message);
        console.error("Backup import error:", err);
      }
    });

    /* -------------------------------------------------------------------
       PROFILE & SETTINGS MODAL
       ------------------------------------------------------------------- */
    const modalProfile = document.getElementById('modal-profile');
    document.getElementById('btn-open-profile').addEventListener('click', () => {
      document.getElementById('profile-bio-input').value = currentUser.bio || '';
      updateAvatarElement(document.getElementById('profile-modal-avatar-preview'), currentUser.avatar, currentUser.username);
      modalProfile.classList.add('active');
    });

    document.getElementById('btn-close-profile').addEventListener('click', () => {
      modalProfile.classList.remove('active');
    });

    document.getElementById('btn-choose-avatar').addEventListener('click', () => {
      document.getElementById('file-input-avatar').click();
    });

    document.getElementById('file-input-avatar').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 160;
          canvas.height = 160;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 160, 160);
          const compressed = canvas.toDataURL('image/jpeg', 0.8);
          currentUser.avatar = compressed;
          updateAvatarElement(document.getElementById('profile-modal-avatar-preview'), compressed, currentUser.username);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btn-save-profile').addEventListener('click', async () => {
      const newBio = document.getElementById('profile-bio-input').value.trim();
      currentUser.bio = newBio;
      const userKey = cleanUserKey(currentUser.username);

      await db.ref(`users/${userKey}`).update({
        bio: newBio,
        avatar: currentUser.avatar || ''
      });

      updateAvatarElement(document.getElementById('header-my-avatar'), currentUser.avatar, currentUser.username);
      modalProfile.classList.remove('active');
      alert("Профиль сохранен!");
    });

    document.getElementById('btn-clear-cache').addEventListener('click', async () => {
      const confirmClear = confirm("ПРЕДУПРЕЖДЕНИЕ: Вся история переписки и локальный кэш будут безвозвратно удалены! Продолжить?");
      if (confirmClear) {
        await clearAllLocalCache();
        alert("Локальный кэш полностью очищен! Приложение будет перезагружено.");
        window.location.reload();
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('meow_user');
      if (peer) peer.destroy(); // Destroy PeerJS instance on logout
      window.location.reload();
    });

    /* -------------------------------------------------------------------
       SEARCH USER
       ------------------------------------------------------------------- */
    const modalSearch = document.getElementById('modal-search');
    document.getElementById('btn-open-search').addEventListener('click', () => {
      document.getElementById('search-input-username').value = '';
      document.getElementById('search-result').innerHTML = '';
      modalSearch.classList.add('active');
    });

    document.getElementById('btn-close-search').addEventListener('click', () => {
      modalSearch.classList.remove('active');
    });

    document.getElementById('search-input-username').addEventListener('input', async (e) => {
      const query = e.target.value.trim();
      const searchResDiv = document.getElementById('search-result');
      if (query.length < 2) {
        searchResDiv.innerHTML = '';
        return;
      }

      const targetKey = cleanUserKey(query);
      const snap = await db.ref(`users/${targetKey}`).once('value');
      const userFound = snap.val();

      if (userFound && targetKey !== cleanUserKey(currentUser.username)) {
        searchResDiv.innerHTML = `
          <div style="display: flex; align-items: center; gap: 10px;">
            <div class="avatar">${userFound.username.replace('@','').charAt(0).toUpperCase()}</div>
            <div>
              <div style="font-weight: 600;">${userFound.username}</div>
              <div style="font-size: 12px; color: var(--text-muted);"> ${userFound.bio || ''}</div>
            </div>
          </div>
          <button class="btn" style="width: auto; padding: 6px 12px;" id="btn-start-chat-found">Написать</button>
        `;
        document.getElementById('btn-start-chat-found').onclick = () => {
          modalSearch.classList.remove('active');
          openChatWithPeer(userFound.username);
        };
      } else {
        searchResDiv.innerHTML = `<span style="font-size: 13px; color: var(--text-muted);">Пользователь не найден</span>`;
      }
    });

    /* -------------------------------------------------------------------
       CHATS LIST & ACTIVE CONVERSATION
       ------------------------------------------------------------------- */
    async function refreshChatsListUI() {
      const container = document.getElementById('chats-list-container');
      if (!localDB) await initIndexedDB();

      const msgs = await getAllMessagesFromLocalDB();
      const chatsMap = {};

      msgs.forEach(m => {
        if (!chatsMap[m.chatPeer] || chatsMap[m.chatPeer].timestamp < m.timestamp) {
          chatsMap[m.chatPeer] = m;
        }
      });

      container.innerHTML = '';
      const peers = Object.keys(chatsMap);

      if (peers.length === 0) {
        container.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--text-muted); font-size: 14px;">Нет активных диалогов.<br>Нажмите на поиск, чтобы начать чат!</div>`;
        return;
      }

      peers.forEach(peerUsername => {
        const lastMsg = chatsMap[peerUsername];
        const timeStr = new Date(lastMsg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        let previewText = lastMsg.text || '[Медиафайл]';
        if (lastMsg.type === 'voice') previewText = '🎤 Голосовое сообщение';
        if (lastMsg.type === 'circle') previewText = '🎥 Видео-кружочек';

        const item = document.createElement('div');
        item.className = 'chat-item';
        item.innerHTML = `
          <div class="avatar">${peerUsername.replace('@','').charAt(0).toUpperCase()}</div>
          <div class="chat-item-details">
            <div class="chat-item-top">
              <span class="chat-item-name">${peerUsername}</span>
              <span class="chat-item-time">${timeStr}</span>
            </div>
            <div class="chat-item-preview">${previewText}</div>
          </div>
        `;
        item.onclick = () => openChatWithPeer(peerUsername);
        container.appendChild(item);
      });
    }

    async function openChatWithPeer(peerUsername) {
      activePeer = cleanUserKey(peerUsername);
      document.getElementById('chat-peer-name').innerText = peerUsername;
      updateAvatarElement(document.getElementById('chat-peer-avatar'), null, peerUsername);

      // Listen for peer status in RTDB
      db.ref(`users/${activePeer}`).on('value', (snap) => {
        const peerVal = snap.val();
        if (peerVal) {
          updateAvatarElement(document.getElementById('chat-peer-avatar'), peerVal.avatar, peerUsername);
          // Check P2P connection status first, then Firebase presence
          const isP2POpen = peerConnections[activePeer]?.isP2POpen;
          if (isP2POpen) {
            updatePeerStatusUI("Онлайн (P2P подключен)", "active");
          } else if (peerVal.status === 'online') {
            updatePeerStatusUI("Онлайн", "active");
          } else if (peerVal.lastSeen) {
            const timeStr = new Date(peerVal.lastSeen).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            updatePeerStatusUI(`Заходил(а) в ${timeStr}`, "");
          } else {
            updatePeerStatusUI("Офлайн", "");
          }
        }
      });

      // Init P2P connection
      initP2PConnection(activePeer);

      // Render Messages History
      const messages = await getLocalMessagesForChat(activePeer);
      const msgContainer = document.getElementById('messages-container');
      msgContainer.innerHTML = '';
      messages.sort((a,b) => a.timestamp - b.timestamp).forEach(m => renderSingleMessage(m));
      scrollToBottom();

      showScreen('chat');
    }

    function updatePeerStatusUI(statusText, dotClass) {
      document.getElementById('peer-status-text').innerText = statusText;
      const dot = document.getElementById('peer-status-dot');
      dot.className = 'online-indicator ' + (dotClass || '');
    }

    function updatePeerStatusText(statusText, isTyping) {
      const txtElem = document.getElementById('peer-status-text');
      if (isTyping) {
        txtElem.innerText = statusText;
        txtElem.style.color = "var(--accent)";
      } else {
        // Restore original text or status if not typing
        const peerKey = activePeer;
        const isP2POpen = peerConnections[peerKey]?.isP2POpen;
        const firebaseStatus = document.getElementById('peer-status-dot').classList.contains('active') ? "Онлайн" : "Офлайн";
        txtElem.innerText = isP2POpen ? "Онлайн (P2P подключен)" : firebaseStatus;
        txtElem.style.color = "var(--text-muted)";
      }
    }

    document.getElementById('btn-chat-back').addEventListener('click', () => {
      activePeer = null;
      showScreen('chats');
      refreshChatsListUI();
    });

    function renderSingleMessage(msg) {
      const container = document.getElementById('messages-container');
      const isSelf = msg.sender === currentUser.username;
      
      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isSelf ? 'self' : 'peer'}`;
      bubble.dataset.msgId = msg.id;

      let contentHtml = '';
      if (msg.type === 'text') {
        contentHtml = `<div>${escapeHtml(msg.text)}</div>`;
      } else if (msg.type === 'image') {
        contentHtml = `<img src="${msg.mediaUrl}" class="message-media" alt="image">`;
      } else if (msg.type === 'video') {
        contentHtml = `<video src="${msg.mediaUrl}" class="message-media" controls></video>`;
      } else if (msg.type === 'voice') {
        contentHtml = `<audio src="${msg.mediaUrl}" controls class="audio-player"></audio>`;
      } else if (msg.type === 'circle') {
        contentHtml = `<video src="${msg.mediaUrl}" class="circle-video" autoplay loop muted playsinline onclick="this.muted=!this.muted"></video>`;
      }

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const reactionHtml = msg.reaction ? `<div class="reaction-badge">${msg.reaction}</div>` : '';

      bubble.innerHTML = `
        ${contentHtml}
        ${reactionHtml}
        <div class="message-time">
          ${timeStr} ${isSelf ? '✓✓' : ''}
        </div>
      `;

      bubble.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showReactionMenu(e, msg);
      });

      container.appendChild(bubble);
      scrollToBottom();
    }

    function showReactionMenu(event, msg) {
      const existing = document.querySelector('.reactions-bar');
      if (existing) existing.remove();

      const reactionsBar = document.createElement('div');
      reactionsBar.className = 'reactions-bar';
      const emojis = ['❤️', '👍', '😂', '😮', '😢', '🔥'];

      emojis.forEach(emoji => {
        const btn = document.createElement('button');
        btn.className = 'reaction-btn';
        btn.innerText = emoji;
        btn.onclick = async () => {
          msg.reaction = emoji;
          await saveMessageToLocalDB(msg);
          reactionsBar.remove();
          
          const elem = document.querySelector(`[data-msg-id="${msg.id}"]`);
          if (elem) {
            let badge = elem.querySelector('.reaction-badge');
            if (!badge) {
              badge = document.createElement('div');
              badge.className = 'reaction-badge';
              elem.appendChild(badge);
            }
            badge.innerText = emoji;
          }
          sendP2PPayload(activePeer, { type: 'reaction_update', msgId: msg.id, reaction: emoji });
        };
        reactionsBar.appendChild(btn);
      });

      const bubbleElem = document.querySelector(`[data-msg-id="${msg.id}"]`);
      if (bubbleElem) bubbleElem.appendChild(reactionsBar);
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"\']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    /* -------------------------------------------------------------------
       TYPING INDICATOR (TELEGRAM STYLE)
       ------------------------------------------------------------------- */
    const msgInput = document.getElementById('chat-msg-input');
    const btnSendMessage = document.getElementById('btn-send-message');

    msgInput.addEventListener('input', () => {
      if (!activePeer || !currentUser) return;

      // Broadcast typing state
      db.ref(`typing/${activePeer}`).set({
        from: cleanUserKey(currentUser.username),
        isTyping: true,
        ts: Date.now()
      });

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        db.ref(`typing/${activePeer}`).set({
          from: cleanUserKey(currentUser.username),
          isTyping: false,
          ts: Date.now()
        });
        updatePeerStatusText("", false); // Reset peer status text after typing timeout
      }, 2000); // Show typing for 2 seconds
    });

    /* -------------------------------------------------------------------
       SENDING MESSAGES & ATTACHMENTS
       ------------------------------------------------------------------- */
    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !activePeer) return;

      const msgObj = {
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        chatPeer: activePeer,
        sender: currentUser.username,
        type: 'text',
        text: text,
        timestamp: Date.now()
      };

      msgInput.value = '';
      await saveMessageToLocalDB(msgObj);
      renderSingleMessage(msgObj);
      await sendP2PPayload(activePeer, msgObj);
      refreshChatsListUI();

      // Ensure typing indicator is cleared after sending message
      if (typingTimeout) clearTimeout(typingTimeout);
      db.ref(`typing/${activePeer}`).set({
        from: cleanUserKey(currentUser.username),
        isTyping: false,
        ts: Date.now()
      });
      updatePeerStatusText("", false);
    }

    btnSendMessage.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById('btn-attach-file').addEventListener('click', () => {
      document.getElementById('file-input-media').click();
    });

    document.getElementById('file-input-media').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !activePeer) return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        const isVideo = file.type.startsWith('video');
        const msgObj = {
          id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          chatPeer: activePeer,
          sender: currentUser.username,
          type: isVideo ? 'video' : 'image',
          mediaUrl: evt.target.result,
          timestamp: Date.now()
        };

        await saveMessageToLocalDB(msgObj);
        renderSingleMessage(msgObj);
        await sendP2PPayload(activePeer, msgObj);
        refreshChatsListUI();
      };
      reader.readAsDataURL(file);
    });

    /* -------------------------------------------------------------------
       VOICE MESSAGES
       ------------------------------------------------------------------- */
    const btnRecordVoice = document.getElementById('btn-record-voice');
    let isRecordingVoice = false;

    btnRecordVoice.addEventListener('click', async () => {
      if (!isRecordingVoice) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          voiceChunks = [];
          voiceRecorder = new MediaRecorder(stream);
          voiceRecorder.ondataavailable = (e) => voiceChunks.push(e.data);
          voiceRecorder.onstop = async () => {
            const blob = new Blob(voiceChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = async (evt) => {
              const msgObj = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                chatPeer: activePeer,
                sender: currentUser.username,
                type: 'voice',
                mediaUrl: evt.target.result,
                timestamp: Date.now()
              };
              await saveMessageToLocalDB(msgObj);
              renderSingleMessage(msgObj);
              await sendP2PPayload(activePeer, msgObj);
              refreshChatsListUI();
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(track => track.stop());
          };
          voiceRecorder.start();
          isRecordingVoice = true;
          btnRecordVoice.style.color = 'var(--danger)';
        } catch (err) {
          alert('Доступ к микрофону отклонен!');
          console.error('Microphone access error:', err);
        }
      } else {
        if (voiceRecorder) voiceRecorder.stop();
        isRecordingVoice = false;
        btnRecordVoice.style.color = 'var(--text-main)';
      }
    });

    /* -------------------------------------------------------------------
       VIDEO NOTE CIRCLE RECORDING (КРУЖОЧКИ TELEGRAM)
       ------------------------------------------------------------------- */
    const btnRecordCircle = document.getElementById('btn-record-circle');
    const circleModal = document.getElementById('circle-recorder-modal');
    const circlePreview = document.getElementById('circle-video-preview');
    const circleTimer = document.getElementById('circle-timer');
    let circleStream = null;
    let circleStartTime = 0;

    btnRecordCircle.addEventListener('click', async () => {
      try {
        circleStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 360 }, height: { ideal: 360 } },
          audio: true
        });
        circlePreview.srcObject = circleStream;
        circleModal.classList.add('active');

        circleChunks = [];
        circleRecorder = new MediaRecorder(circleStream, { mimeType: 'video/webm' });
        circleRecorder.ondataavailable = (e) => circleChunks.push(e.data);

        circleRecorder.start();
        circleStartTime = Date.now();
        circleTimerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - circleStartTime) / 1000);
          const sec = (elapsed % 60).toString().padStart(2, '0');
          const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
          circleTimer.innerText = `${min}:${sec}`;
        }, 1000);

      } catch (err) {
        alert('Доступ к камере/микрофону отклонен!');
        console.error('Camera/Mic access error:', err);
      }
    });

    document.getElementById('btn-cancel-circle').addEventListener('click', () => {
      stopCircleRecording(false);
    });

    document.getElementById('btn-stop-send-circle').addEventListener('click', () => {
      stopCircleRecording(true);
    });

    function stopCircleRecording(shouldSend) {
      clearInterval(circleTimerInterval);
      if (circleRecorder && circleRecorder.state !== 'inactive') {
        circleRecorder.onstop = async () => { // Make onstop async
          if (shouldSend) {
            const blob = new Blob(circleChunks, { type: 'video/webm' });
            const reader = new FileReader();
            reader.onload = async (evt) => {
              const msgObj = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                chatPeer: activePeer,
                sender: currentUser.username,
                type: 'circle',
                mediaUrl: evt.target.result,
                timestamp: Date.now()
              };
              await saveMessageToLocalDB(msgObj);
              renderSingleMessage(msgObj);
              await sendP2PPayload(activePeer, msgObj);
              refreshChatsListUI();
            };
            reader.readAsDataURL(blob);
          }
          if (circleStream) circleStream.getTracks().forEach(t => t.stop());
          circlePreview.srcObject = null; // Clear preview
        };
        circleRecorder.stop();
      } else {
        // If recorder was not active, just stop stream and clear UI
        if (circleStream) circleStream.getTracks().forEach(t => t.stop());
        circlePreview.srcObject = null;
      }
      circleModal.classList.remove('active');
    }

    /* -------------------------------------------------------------------
       AUTO SESSION BOOTSTRAP
       ------------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', async () => {
      const savedUser = localStorage.getItem('meow_user');
      if (savedUser) {
        const userKey = cleanUserKey(savedUser);
        const snap = await db.ref(`users/${userKey}`).once('value');
        const userData = snap.val();

        if (userData) {
          // Reconstruct keyPair from stored public key (private key is generated fresh or imported)
          // For simplicity and to ensure E2EE, we'll regenerate the private key if not from import
          const keyPair = await generateECDHKeyPair();
          const publicJwk = await exportPublicKey(keyPair.publicKey);
          const privateJwk = await exportPrivateKey(keyPair.privateKey);

          // Update Firebase with new public key
          await db.ref(`users/${userKey}`).update({
            publicKey: publicJwk,
            peerId: userKey, // Ensure PeerJS ID is consistent
            status: "online",
            lastSeen: Date.now()
          });

          currentUser = { ...userData, keyPair, exportedPrivateKeyJwk: privateJwk, peerId: userKey };
          setupOnlinePresence(userKey);
          finishLogin();
        }
      }
    });
  </script>
</body>
</html>
