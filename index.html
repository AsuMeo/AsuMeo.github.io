<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Она рядом — Глава 1: Случайная встреча</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Roboto:wght@300;400;700&display=swap');
:root { --bg-dark:#0d0d1a; --bg-panel:#1a1a2e; --accent:#ff4d6d; --accent-soft:#ffb3c1; --text:#e8e8e8; --text-dim:#8888a0; --love:#ff6b9d; --fear:#ff4444; --trust:#4ecdc4; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; font-family:'Roboto',sans-serif; background:var(--bg-dark); color:var(--text); }
#loader { position:fixed; inset:0; z-index:9999; background:var(--bg-dark); display:flex; flex-direction:column; align-items:center; justify-content:center; }
#loader h1 { font-family:'Noto Serif',serif; font-size:2.2rem; color:var(--accent); text-shadow:0 0 30px var(--accent); animation:pulse 2s infinite; }
#loader p { margin-top:20px; color:var(--text-dim); font-size:0.9rem; }
#loader .bar { width:200px; height:3px; background:#333; margin-top:30px; border-radius:2px; overflow:hidden; }
#loader .bar-fill { width:0%; height:100%; background:var(--accent); animation:loadBar 0.8s ease forwards; }
@keyframes pulse { 0%,100%{opacity:0.6;} 50%{opacity:1;} }
@keyframes loadBar { to{width:100%;} }
#game { width:100%; height:100%; display:none; flex-direction:column; position:relative; }
#scene { flex:1; position:relative; overflow:hidden; }
#bg { position:absolute; inset:0; background-size:cover; background-position:center; transition:opacity 1s ease; }
#bg-overlay { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 70%, rgba(0,0,0,0.9) 100%); pointer-events:none; }
#char-container { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:500px; height:65%; display:flex; align-items:flex-end; justify-content:center; pointer-events:none; z-index:2; }
#char-sprite { max-height:100%; max-width:100%; opacity:0; transform:translateY(30px); transition:all 0.8s cubic-bezier(0.4,0,0.2,1); filter:drop-shadow(0 0 20px rgba(255,77,109,0.3)); }
#char-sprite.show { opacity:1; transform:translateY(0); }
#char-sprite.shake { animation:shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
#fx { position:absolute; inset:0; pointer-events:none; z-index:3; }
.heartbeat { animation:heartbeat 1.5s ease infinite; }
@keyframes heartbeat { 0%,100%{transform:scale(1);} 14%{transform:scale(1.03);} 28%{transform:scale(1);} 42%{transform:scale(1.03);} 70%{transform:scale(1);} }
.vignette { position:absolute; inset:0; box-shadow:inset 0 0 150px rgba(0,0,0,0.8); pointer-events:none; }
#ui { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:0 12px 12px; }
#name-tag { display:inline-block; background:var(--accent); color:#fff; padding:6px 20px; border-radius:20px 20px 0 0; font-weight:700; font-size:0.85rem; margin-left:8px; opacity:0; transform:translateY(10px); transition:all 0.3s ease; }
#name-tag.show { opacity:1; transform:translateY(0); }
#dialogue-box { background:rgba(13,13,26,0.92); border:1px solid rgba(255,77,109,0.3); border-radius:0 16px 16px 16px; padding:16px 18px; min-height:120px; position:relative; backdrop-filter:blur(10px); }
#dialogue-text { font-size:1rem; line-height:1.7; color:var(--text); min-height:60px; }
#dialogue-text .typing-cursor { display:inline-block; width:2px; height:1.1em; background:var(--accent); margin-left:2px; animation:blink 0.8s infinite; vertical-align:middle; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
#next-indicator { position:absolute; bottom:12px; right:18px; width:24px; height:24px; border-right:2px solid var(--accent); border-bottom:2px solid var(--accent); transform:rotate(45deg); opacity:0; animation:arrowPulse 1.5s infinite; }
@keyframes arrowPulse { 0%,100%{opacity:0.3; transform:rotate(45deg) translate(0,0);} 50%{opacity:1; transform:rotate(45deg) translate(4px,4px);} }
#choices { display:none; flex-direction:column; gap:10px; margin-top:12px; animation:slideUp 0.4s ease; }
@keyframes slideUp { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
.choice-btn { background:rgba(255,77,109,0.15); border:1px solid rgba(255,77,109,0.4); color:var(--text); padding:14px 18px; border-radius:12px; font-size:0.95rem; text-align:left; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
.choice-btn:hover, .choice-btn:active { background:rgba(255,77,109,0.3); border-color:var(--accent); transform:translateX(5px); }
.choice-btn .tag { display:inline-block; font-size:0.7rem; padding:2px 8px; border-radius:10px; margin-right:8px; font-weight:700; }
.tag-love { background:rgba(255,107,157,0.3); color:var(--love); }
.tag-fear { background:rgba(255,68,68,0.3); color:var(--fear); }
.tag-trust { background:rgba(78,205,196,0.3); color:var(--trust); }
#stats-bar { display:flex; gap:12px; padding:8px 12px; background:rgba(13,13,26,0.8); border-radius:12px 12px 0 0; margin-bottom:4px; backdrop-filter:blur(10px); }
.stat { display:flex; align-items:center; gap:6px; font-size:0.75rem; }
.stat-bar { width:60px; height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
.stat-fill { height:100%; border-radius:3px; transition:width 0.5s ease; }
.stat-love { background:var(--love); }
.stat-fear { background:var(--fear); }
.stat-trust { background:var(--trust); }
#top-bar { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:10px 16px; z-index:10; background:linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); }
#chapter-title { font-family:'Noto Serif',serif; font-size:0.85rem; color:var(--accent-soft); }
#menu-btn { width:36px; height:36px; background:rgba(255,255,255,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.2rem; cursor:pointer; border:none; color:var(--text); }
#menu-modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; display:none; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(10px); }
#menu-modal.show { display:flex; animation:fadeIn 0.3s ease; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.menu-btn { width:220px; padding:16px; margin:8px; background:var(--bg-panel); border:1px solid rgba(255,77,109,0.3); border-radius:12px; color:var(--text); font-size:1rem; cursor:pointer; transition:all 0.2s; }
.menu-btn:hover { background:rgba(255,77,109,0.2); border-color:var(--accent); }
#save-modal { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:101; display:none; flex-direction:column; padding:20px; overflow-y:auto; }
#save-modal.show { display:flex; }
.save-slot { background:var(--bg-panel); border:1px solid rgba(255,77,109,0.2); border-radius:12px; padding:14px; margin:8px 0; cursor:pointer; transition:all 0.2s; }
.save-slot:hover { border-color:var(--accent); }
.save-slot .s-time { color:var(--text-dim); font-size:0.75rem; }
.save-slot .s-text { color:var(--text); font-size:0.85rem; margin-top:4px; }
#phone-screen { position:fixed; inset:0; background:#000; z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; }
#phone-screen.show { display:flex; }
.phone-frame { width:90%; max-width:340px; background:var(--bg-panel); border-radius:30px; padding:20px; border:3px solid #333; position:relative; }
.phone-header { display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.1); }
.phone-avatar { width:40px; height:40px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
.phone-name { font-weight:700; color:var(--text); }
.phone-status { font-size:0.75rem; color:var(--text-dim); }
.phone-chat { height:350px; overflow-y:auto; padding:12px 0; display:flex; flex-direction:column; gap:8px; }
.msg { max-width:80%; padding:10px 14px; border-radius:16px; font-size:0.9rem; animation:msgIn 0.3s ease; }
@keyframes msgIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.msg-in { align-self:flex-start; background:rgba(255,255,255,0.1); color:var(--text); border-bottom-left-radius:4px; }
.msg-out { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.msg-time { font-size:0.65rem; color:var(--text-dim); margin-top:4px; text-align:right; }
.phone-input { display:flex; gap:8px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.1); }
.phone-input input { flex:1; background:rgba(255,255,255,0.1); border:none; border-radius:20px; padding:10px 16px; color:var(--text); font-size:0.9rem; }
.phone-input button { background:var(--accent); border:none; border-radius:50%; width:40px; height:40px; color:#fff; font-size:1.2rem; cursor:pointer; }
.phone-close { position:absolute; top:-50px; right:0; background:rgba(255,255,255,0.1); border:none; border-radius:50%; width:40px; height:40px; color:#fff; font-size:1.2rem; cursor:pointer; }
#inv-modal { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:102; display:none; flex-direction:column; padding:20px; }
#inv-modal.show { display:flex; }
#inv-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
.inv-item { background:var(--bg-panel); border:1px solid rgba(255,77,109,0.2); border-radius:12px; padding:16px; text-align:center; cursor:pointer; transition:all 0.2s; }
.inv-item:hover { border-color:var(--accent); }
.inv-item .inv-icon { font-size:2rem; margin-bottom:8px; }
.inv-item .inv-name { font-size:0.8rem; color:var(--text); }
#journal-modal { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:103; display:none; flex-direction:column; padding:20px; }
#journal-modal.show { display:flex; }
.journal-entry { background:var(--bg-panel); border-left:3px solid var(--accent); padding:14px 16px; margin:8px 0; border-radius:0 12px 12px 0; }
.journal-entry .j-date { color:var(--accent-soft); font-size:0.75rem; }
.journal-entry .j-text { color:var(--text); font-size:0.9rem; margin-top:6px; line-height:1.6; }
#minigame-modal { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:200; display:none; flex-direction:column; align-items:center; justify-content:center; }
#minigame-modal.show { display:flex; }
.lock-container { width:280px; height:280px; position:relative; }
.lock-ring { position:absolute; inset:20px; border:8px solid #333; border-radius:50%; }
.lock-target { position:absolute; top:20px; left:50%; transform:translateX(-50%); width:4px; height:30px; background:var(--accent); border-radius:2px; }
.lock-cursor { position:absolute; inset:20px; border-radius:50%; animation:spin 4s linear infinite; }
.lock-cursor::after { content:''; position:absolute; top:12px; left:50%; transform:translateX(-50%); width:6px; height:24px; background:#fff; border-radius:3px; }
@keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.lock-btn { margin-top:30px; padding:14px 40px; background:var(--accent); border:none; border-radius:12px; color:#fff; font-size:1.1rem; cursor:pointer; }
.lock-instruction { color:var(--text-dim); margin-bottom:20px; text-align:center; }
.memory-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.memory-card { width:70px; height:70px; background:var(--bg-panel); border:2px solid rgba(255,77,109,0.3); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; cursor:pointer; transition:all 0.3s; }
.memory-card.flipped { background:var(--accent); border-color:var(--accent); transform:rotateY(180deg); }
.memory-card.matched { background:rgba(78,205,196,0.3); border-color:var(--trust); opacity:0.6; }
#transition { position:fixed; inset:0; background:#000; z-index:500; display:none; align-items:center; justify-content:center; flex-direction:column; }
#transition.show { display:flex; }
#transition-text { font-family:'Noto Serif',serif; font-size:1.5rem; color:var(--accent); text-align:center; padding:20px; }
#transition-sub { color:var(--text-dim); font-size:0.9rem; margin-top:10px; }
#ending { position:fixed; inset:0; background:var(--bg-dark); z-index:600; display:none; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; }
#ending.show { display:flex; }
#ending h2 { font-family:'Noto Serif',serif; font-size:2rem; color:var(--accent); margin-bottom:20px; }
#ending p { color:var(--text-dim); line-height:1.8; max-width:400px; }
#ending .end-stat { margin-top:30px; display:flex; gap:20px; }
.end-stat-item { text-align:center; }
.end-stat-item .es-val { font-size:1.5rem; font-weight:700; color:var(--accent); }
.end-stat-item .es-label { font-size:0.75rem; color:var(--text-dim); }
#notif { position:fixed; top:60px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--bg-panel); border:1px solid var(--accent); border-radius:12px; padding:12px 20px; z-index:300; transition:transform 0.4s ease; max-width:90%; text-align:center; }
#notif.show { transform:translateX(-50%) translateY(0); }
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--accent); border-radius:2px; }
@media(max-width:400px) { #dialogue-text { font-size:0.9rem; } .choice-btn { font-size:0.85rem; padding:12px 14px; } .stat-bar { width:45px; } }
</style>
</head>
<body>

<div id="loader">
  <h1>Она рядом</h1>
  <p>Глава 1: Случайная встреча</p>
  <div class="bar"><div class="bar-fill"></div></div>
</div>

<div id="game">
  <div id="top-bar">
    <div id="chapter-title">Глава 1: Случайная встреча</div>
    <button id="menu-btn" onclick="openMenu()">☰</button>
  </div>
  <div id="scene">
    <div id="bg"></div>
    <div id="bg-overlay"></div>
    <div id="fx"></div>
    <div class="vignette"></div>
    <div id="char-container"><img id="char-sprite" src="" alt=""></div>
  </div>
  <div id="ui">
    <div id="stats-bar">
      <div class="stat"><span>❤️</span><div class="stat-bar"><div class="stat-fill stat-love" id="stat-love" style="width:10%"></div></div></div>
      <div class="stat"><span>😰</span><div class="stat-bar"><div class="stat-fill stat-fear" id="stat-fear" style="width:5%"></div></div></div>
      <div class="stat"><span>🤝</span><div class="stat-bar"><div class="stat-fill stat-trust" id="stat-trust" style="width:20%"></div></div></div>
    </div>
    <div id="name-tag"></div>
    <div id="dialogue-box" onclick="advanceDialogue()">
      <div id="dialogue-text"></div>
      <div id="next-indicator"></div>
    </div>
    <div id="choices"></div>
  </div>
</div>

<div id="menu-modal">
  <h2 style="font-family:'Noto Serif',serif; color:var(--accent); margin-bottom:20px;">Меню</h2>
  <button class="menu-btn" onclick="saveGame()">💾 Сохранить</button>
  <button class="menu-btn" onclick="loadGame()">📂 Загрузить</button>
  <button class="menu-btn" onclick="openJournal()">📓 Дневник</button>
  <button class="menu-btn" onclick="openInventory()">🎒 Инвентарь</button>
  <button class="menu-btn" onclick="toggleAuto()" id="auto-btn">▶️ Авто: ВЫКЛ</button>
  <button class="menu-btn" onclick="closeMenu()">⬅️ Назад</button>
</div>

<div id="save-modal">
  <h2 style="font-family:'Noto Serif',serif; color:var(--accent); margin-bottom:10px;">Сохранения</h2>
  <button class="menu-btn" onclick="closeSaveModal()" style="width:auto; padding:10px 20px; margin:0 0 10px;">⬅️ Назад</button>
  <div id="save-slots"></div>
</div>

<div id="phone-screen">
  <button class="phone-close" onclick="closePhone()">✕</button>
  <div class="phone-frame">
    <div class="phone-header">
      <div class="phone-avatar">👩</div>
      <div><div class="phone-name">Мира 💕</div><div class="phone-status">в сети</div></div>
    </div>
    <div class="phone-chat" id="phone-chat"></div>
    <div class="phone-input">
      <input type="text" id="phone-msg-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendPhoneMsg()">
      <button onclick="sendPhoneMsg()">➤</button>
    </div>
  </div>
</div>

<div id="inv-modal">
  <h2 style="font-family:'Noto Serif',serif; color:var(--accent); margin-bottom:10px;">🎒 Инвентарь</h2>
  <button class="menu-btn" onclick="closeInventory()" style="width:auto; padding:10px 20px; margin:0 0 10px;">⬅️ Назад</button>
  <div id="inv-grid"></div>
</div>

<div id="journal-modal">
  <h2 style="font-family:'Noto Serif',serif; color:var(--accent); margin-bottom:10px;">📓 Дневник</h2>
  <button class="menu-btn" onclick="closeJournal()" style="width:auto; padding:10px 20px; margin:0 0 10px;">⬅️ Назад</button>
  <div id="journal-entries"></div>
</div>

<div id="minigame-modal"><div id="minigame-content"></div></div>

<div id="transition">
  <div id="transition-text"></div>
  <div id="transition-sub"></div>
</div>

<div id="notif"></div>

<div id="ending">
  <h2 id="ending-title"></h2>
  <p id="ending-desc"></p>
  <div class="end-stat">
    <div class="end-stat-item"><div class="es-val" id="end-love">0</div><div class="es-label">Любовь</div></div>
    <div class="end-stat-item"><div class="es-val" id="end-fear">0</div><div class="es-label">Страх</div></div>
    <div class="end-stat-item"><div class="es-val" id="end-trust">0</div><div class="es-label">Доверие</div></div>
  </div>
  <button class="menu-btn" onclick="location.reload()" style="margin-top:30px;">🔄 Начать заново</button>
</div>

<script>

const GAME = {
  love: 10, fear: 5, trust: 20,
  inventory: [], journal: [], flags: {},
  currentScene: 0, currentLine: 0,
  autoMode: false, autoTimer: null,
  isTyping: false,
  saves: JSON.parse(localStorage.getItem('ona_ryadom_saves') || '[]'),
  playTime: 0, timerInterval: null
};

const BGS = {
  room: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)',
  street: 'linear-gradient(180deg, #0d1b2a 0%, #1b2838 40%, #2d3a4a 100%)',
  store: 'linear-gradient(180deg, #1a1a2e 0%, #1e1e3f 50%, #2a2a5a 100%)',
  cafe: 'linear-gradient(135deg, #1a0a0a 0%, #2d1b1b 50%, #1a1a2e 100%)',
  busstop: 'linear-gradient(180deg, #0a0a1a 0%, #1a1a2e 60%, #2a2a4a 100%)',
  apartment: 'linear-gradient(135deg, #1a0a1a 0%, #2a1a2a 50%, #1a1a2e 100%)',
  dark: 'linear-gradient(180deg, #000000 0%, #0d0d1a 100%)',
  phone: 'linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 100%)',
  nightmare: 'linear-gradient(180deg, #1a0000 0%, #0d0d1a 50%, #000000 100%)',
  park: 'linear-gradient(180deg, #0a1a0a 0%, #1a2a1a 50%, #0d1a0d 100%)',
  kitchen: 'linear-gradient(135deg, #1a1a0a 0%, #2a2a1a 50%, #1a1a2e 100%)',
  bedroom: 'linear-gradient(180deg, #1a0a1a 0%, #2a1a2a 100%)',
  mirror: 'linear-gradient(135deg, #0a0a0a 0%, #1a1a2a 50%, #0a0a1a 100%)',
  rain: 'linear-gradient(180deg, #0d1a2a 0%, #1a2a3a 50%, #0d1a2a 100%)'
};

function makeSVG(color1, color2, faceColor, eyeColor, mouthPath, cheeks, label) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">';
  svg += '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + color1 + '"/><stop offset="100%" stop-color="' + color2 + '"/></linearGradient></defs>';
  svg += '<rect width="300" height="500" fill="url(%23g)" rx="20"/>';
  svg += '<circle cx="150" cy="180" r="70" fill="' + faceColor + '"/>';
  svg += '<ellipse cx="120" cy="170" rx="12" ry="8" fill="' + eyeColor + '"/><ellipse cx="180" cy="170" rx="12" ry="8" fill="' + eyeColor + '"/>';
  if (cheeks) svg += '<circle cx="110" cy="190" r="15" fill="rgba(255,0,0,0.3)"/><circle cx="190" cy="190" r="15" fill="rgba(255,0,0,0.3)"/>';
  svg += '<path d="' + mouthPath + '" stroke="#c44569" stroke-width="3" fill="none"/>';
  svg += '<rect x="80" y="250" width="140" height="200" fill="' + color1 + '" rx="20"/>';
  svg += '<text x="150" y="420" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif">' + label + '</text>';
  svg += '</svg>';
  return 'data:image/svg+xml;base64,' + btoa(svg);
}

const CHARS = {
  mira: {

var scriptIndex = 0;
var isPaused = false;
var typingTimer = null;

function init() {
  setTimeout(function() {
    var loader = document.getElementById('loader');
    var game = document.getElementById('game');
    loader.style.opacity = '0';
    setTimeout(function() {
      loader.style.display = 'none';
      game.style.display = 'flex';
      startGame();
    }, 500);
  }, 800);
}

function startGame() {
  GAME.timerInterval = setInterval(function() { GAME.playTime++; }, 1000);
  scriptIndex = 0;
  processScene();
}

function processScene() {
  if (isPaused || scriptIndex >= SCRIPT.length) return;
  var scene = SCRIPT[scriptIndex];
  if (scene.condition && !scene.condition()) {
    scriptIndex++;
    processScene();
    return;
  }
  switch(scene.type) {
    case 'bg':
      setBG(scene.bg);
      scriptIndex++;
      setTimeout(processScene, 500);
      break;
    case 'sprite':
      showSprite(scene.char, scene.emotion);
      scriptIndex++;
      setTimeout(processScene, 600);
      break;
    case 'narrator':
      showDialogue('', scene.text, scene.delay || 1500);
      break;
    case 'hero':
      showDialogue('Ты', scene.text, scene.delay || 1500, 'hero', scene.emotion);
      break;
    case 'char':
      showDialogue(scene.name, scene.text, scene.delay || 1500, 'char', scene.emotion);
      break;
    case 'choices':
      showChoices(scene.choices);
      break;
    case 'phone':
      showPhoneChat(scene.msgs);
      break;
    case 'transition':
      showTransition(scene.text, scene.sub);
      break;
    case 'minigame':
      startMinigame(scene.game, scene.data);
      break;
    case 'ending':
      showEnding(scene.title, scene.desc);
      break;
    default:
      scriptIndex++;
      processScene();
  }
}

function showDialogue(speaker, text, delay, type, emotion) {
  isPaused = true;
  var nameTag = document.getElementById('name-tag');
  var dialogueText = document.getElementById('dialogue-text');
  var nextIndicator = document.getElementById('next-indicator');
  if (speaker) {
    nameTag.textContent = speaker;
    nameTag.className = 'show';
    if (type === 'hero') nameTag.style.background = '#d4a574';
    else if (type === 'char') nameTag.style.background = '#ff6b9d';
    else nameTag.style.background = '#4ecdc4';
  } else {
    nameTag.className = '';
  }
  if (emotion && type === 'hero') {
    showSprite('hero', emotion);
  }
  dialogueText.innerHTML = '<span class="typing-cursor"></span>';
  nextIndicator.style.display = 'none';
  var i = 0;
  GAME.isTyping = true;
  typingTimer = setInterval(function() {
    if (i >= text.length) {
      clearInterval(typingTimer);
      GAME.isTyping = false;
      dialogueText.innerHTML = text;
      nextIndicator.style.display = 'block';
      if (GAME.autoMode) {
        GAME.autoTimer = setTimeout(function() { advanceDialogue(); }, delay);
      }
      return;
    }
    dialogueText.innerHTML = text.substring(0, i + 1) + '<span class="typing-cursor"></span>';
    i++;
  }, GAME.autoMode ? 20 : 35);
}

function advanceDialogue() {
  if (GAME.isTyping) {
    clearInterval(typingTimer);
    clearTimeout(GAME.autoTimer);
    GAME.isTyping = false;
    var scene = SCRIPT[scriptIndex];
    document.getElementById('dialogue-text').innerHTML = scene.text;
    document.getElementById('next-indicator').style.display = 'block';
    if (GAME.autoMode) {
      GAME.autoTimer = setTimeout(function() {
        isPaused = false;
        scriptIndex++;
        processScene();
      }, scene.delay || 1500);
    }
    return;
  }
  clearTimeout(GAME.autoTimer);
  isPaused = false;
  scriptIndex++;
  processScene();
}

function showChoices(choices) {
  isPaused = true;
  var container = document.getElementById('choices');
  container.innerHTML = '';
  container.style.display = 'flex';
  choices.forEach(function(choice) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn';
    var tagHtml = '';
    if (choice.tag === 'love') tagHtml = '<span class="tag tag-love">❤️</span>';
    else if (choice.tag === 'fear') tagHtml = '<span class="tag tag-fear">😰</span>';
    else if (choice.tag === 'trust') tagHtml = '<span class="tag tag-trust">🤝</span>';
    btn.innerHTML = tagHtml + choice.text;
    btn.onclick = function() { selectChoice(choice); };
    container.appendChild(btn);
  });
}

function selectChoice(choice) {
  document.getElementById('choices').style.display = 'none';
  if (choice.effect) choice.effect();
  addJournal('Выбор: ' + choice.text);
  isPaused = false;
  scriptIndex++;
  processScene();
}

function setBG(bgStyle) {
  var bg = document.getElementById('bg');
  bg.style.opacity = '0';
  setTimeout(function() {
    bg.style.background = bgStyle;
    bg.style.opacity = '1';
  }, 300);
}

function showSprite(char, emotion) {
  var sprite = document.getElementById('char-sprite');
  if (!char) {
    sprite.classList.remove('show');
    return;
  }
  var charData = CHARS[char];
  if (!charData) return;
  var img = charData[emotion] || charData.normal;
  sprite.src = img;
  sprite.classList.add('show');
  if (emotion === 'scared' || emotion === 'dark' || emotion === 'yandere') {
    sprite.classList.add('shake');
    setTimeout(function() { sprite.classList.remove('shake'); }, 400);
  }
}

function showTransition(text, sub) {
  isPaused = true;
  var trans = document.getElementById('transition');
  document.getElementById('transition-text').textContent = text;
  document.getElementById('transition-sub').textContent = sub || '';
  trans.classList.add('show');
  setTimeout(function() {
    trans.classList.remove('show');
    isPaused = false;
    scriptIndex++;
    processScene();
  }, 3000);
}

function showPhoneChat(msgs) {
  isPaused = true;
  var phone = document.getElementById('phone-screen');
  var chat = document.getElementById('phone-chat');
  phone.classList.add('show');
  chat.innerHTML = '';
  var msgIndex = 0;
  function showNextMsg() {
    if (msgIndex >= msgs.length) return;
    var msg = msgs[msgIndex];
    var div = document.createElement('div');
    div.className = 'msg msg-' + msg.from;
    div.innerHTML = msg.text + '<div class="msg-time">' + msg.time + '</div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    msgIndex++;
    setTimeout(showNextMsg, 1500);
  }
  setTimeout(showNextMsg, 500);
}

function closePhone() {
  document.getElementById('phone-screen').classList.remove('show');
  isPaused = false;
  scriptIndex++;
  processScene();
}

function sendPhoneMsg() {
  var input = document.getElementById('phone-msg-input');
  var text = input.value.trim();
  if (!text) return;
  var chat = document.getElementById('phone-chat');
  var div = document.createElement('div');
  div.className = 'msg msg-out';
  div.innerHTML = text + '<div class="msg-time">Сейчас</div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  input.value = '';
}

function startMinigame(game, data) {
  isPaused = true;
  var modal = document.getElementById('minigame-modal');
  var content = document.getElementById('minigame-content');
  modal.classList.add('show');
  if (game === 'lockpick') {
    startLockpick(data, function() { endMinigame(); });
  } else if (game === 'memory') {
    startMemory(data, function() { endMinigame(); });
  }
}

function startLockpick(data, onComplete) {
  var content = document.getElementById('minigame-content');
  content.innerHTML = '<div class="lock-instruction">Нажми, когда курсор совпадет с меткой!</div><div class="lock-container"><div class="lock-ring"></div><div class="lock-target"></div><div class="lock-cursor" id="lock-cursor"></div></div><button class="lock-btn" id="lock-btn">ВЗЛОМАТЬ</button><div id="lock-result" style="margin-top:15px;color:#fff;"></div>';
  var angle = 0;
  var speed = 4;
  var targetAngle = Math.random() * 360;
  var attempts = 3;
  var cursor = document.getElementById('lock-cursor');
  var btn = document.getElementById('lock-btn');
  function animate() {
    angle = (angle + speed) % 360;
    cursor.style.transform = 'rotate(' + angle + 'deg)';
    if (document.getElementById('minigame-modal').classList.contains('show')) {
      requestAnimationFrame(animate);
    }
  }
  animate();
  btn.onclick = function() {
    var diff = Math.abs(angle - targetAngle);
    var normalizedDiff = Math.min(diff, 360 - diff);
    if (normalizedDiff < 20) {
      document.getElementById('lock-result').innerHTML = '<span style="color:#4ecdc4;">✓ Взлом успешен!</span>';
      setTimeout(onComplete, 1000);
    } else {
      attempts--;
      if (attempts <= 0) {
        document.getElementById('lock-result').innerHTML = '<span style="color:#ff4444;">✗ Взлом провален</span>';
        setTimeout(onComplete, 1000);
      } else {
        document.getElementById('lock-result').innerHTML = '<span style="color:#ff8fab;">Промах! Осталось попыток: ' + attempts + '</span>';
        targetAngle = Math.random() * 360;
        speed += 1;
      }
    }
  };
}

function startMemory(data, onComplete) {
  var content = document.getElementById('minigame-content');
  var emojis = ['❤️','🔪','💕','😰','🌸','💀','😊','😈'];
  var cards = emojis.concat(emojis).sort(function() { return Math.random() - 0.5; });
  content.innerHTML = '<div style="color:#fff;margin-bottom:15px;text-align:center;">Найди пары воспоминаний</div><div class="memory-grid" id="memory-grid"></div><div id="memory-result" style="margin-top:15px;color:#fff;"></div>';
  var grid = document.getElementById('memory-grid');
  var flipped = [];
  var matched = 0;
  cards.forEach(function(emoji, i) {
    var card = document.createElement('div');
    card.className = 'memory-card';
    card.textContent = '❓';
    card.onclick = function() {
      if (flipped.length >= 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      card.textContent = emoji;
      flipped.push({card:card, emoji:emoji, index:i});
      if (flipped.length === 2) {
        if (flipped[0].emoji === flipped[1].emoji) {
          flipped.forEach(function(c) { c.card.classList.add('matched'); });
          matched++;
          flipped = [];
          if (matched === emojis.length) {
            document.getElementById('memory-result').innerHTML = '<span style="color:#4ecdc4;">✓ Все воспоминания собраны!</span>';
            setTimeout(onComplete, 1000);
          }
        } else {
          setTimeout(function() {
            flipped.forEach(function(c) {
              c.card.classList.remove('flipped');
              c.card.textContent = '❓';
            });
            flipped = [];
          }, 800);
        }
      }
    };
    grid.appendChild(card);
  });
}

function endMinigame() {
  document.getElementById('minigame-modal').classList.remove('show');
  isPaused = false;
  scriptIndex++;
  processScene();
}

function updateStats() {
  document.getElementById('stat-love').style.width = Math.min(100, GAME.love) + '%';
  document.getElementById('stat-fear').style.width = Math.min(100, GAME.fear) + '%';
  document.getElementById('stat-trust').style.width = Math.min(100, GAME.trust) + '%';
  if (GAME.fear > 50) {
    document.getElementById('fx').classList.add('heartbeat');
  }
  if (GAME.fear > 80) {
    document.getElementById('bg').style.filter = 'contrast(1.2) brightness(0.7)';
  }
}

function addItem(icon, name, desc) {
  GAME.inventory.push({icon:icon, name:name, desc:desc});
  showNotif('Получен предмет: ' + name);
}

function addJournal(text) {
  var date = new Date().toLocaleDateString('ru-RU');
  GAME.journal.push({date:date, text:text});
}

function showNotif(text) {
  var notif = document.getElementById('notif');
  notif.textContent = text;
  notif.classList.add('show');
  setTimeout(function() { notif.classList.remove('show'); }, 3000);
}

function openMenu() {
  isPaused = true;
  document.getElementById('menu-modal').classList.add('show');
}

function closeMenu() {
  document.getElementById('menu-modal').classList.remove('show');
  isPaused = false;
}

function toggleAuto() {
  GAME.autoMode = !GAME.autoMode;
  document.getElementById('auto-btn').textContent = GAME.autoMode ? '⏸ Авто: ВКЛ' : '▶️ Авто: ВЫКЛ';
  closeMenu();
}

function saveGame() {
  var saveData = {
    love: GAME.love, fear: GAME.fear, trust: GAME.trust,
    inventory: GAME.inventory, journal: GAME.journal,
    flags: GAME.flags, scriptIndex: scriptIndex,
    playTime: GAME.playTime,
    date: new Date().toLocaleString('ru-RU')
  };
  GAME.saves.push(saveData);
  if (GAME.saves.length > 10) GAME.saves.shift();
  localStorage.setItem('ona_ryadom_saves', JSON.stringify(GAME.saves));
  showNotif('Игра сохранена!');
  closeMenu();
}

function loadGame() {
  closeMenu();
  var modal = document.getElementById('save-modal');
  var slots = document.getElementById('save-slots');
  slots.innerHTML = '';
  if (GAME.saves.length === 0) {
    slots.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">Нет сохранений</div>';
  } else {
    GAME.saves.forEach(function(save, i) {
      var slot = document.createElement('div');
      slot.className = 'save-slot';
      slot.innerHTML = '<div class="s-time">' + save.date + '</div><div class="s-text">❤️' + save.love + ' 😰' + save.fear + ' 🤝' + save.trust + ' | ' + Math.floor(save.playTime/60) + ' мин</div>';
      slot.onclick = function() {
        GAME.love = save.love; GAME.fear = save.fear; GAME.trust = save.trust;
        GAME.inventory = save.inventory; GAME.journal = save.journal;
        GAME.flags = save.flags; scriptIndex = save.scriptIndex;
        GAME.playTime = save.playTime;
        updateStats();
        closeSaveModal();
        showNotif('Игра загружена!');
        processScene();
      };
      slots.appendChild(slot);
    });
  }
  modal.classList.add('show');
}

function closeSaveModal() {
  document.getElementById('save-modal').classList.remove('show');
  isPaused = false;
}

function openInventory() {
  closeMenu();
  var modal = document.getElementById('inv-modal');
  var grid = document.getElementById('inv-grid');
  grid.innerHTML = '';
  if (GAME.inventory.length === 0) {
    grid.innerHTML = '<div style="color:#888;text-align:center;grid-column:1/-1;">Инвентарь пуст</div>';
  } else {
    GAME.inventory.forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'inv-item';
      div.innerHTML = '<div class="inv-icon">' + item.icon + '</div><div class="inv-name">' + item.name + '</div>';
      div.title = item.desc;
      grid.appendChild(div);
    });
  }
  modal.classList.add('show');
}

function closeInventory() {
  document.getElementById('inv-modal').classList.remove('show');
  isPaused = false;
}

function openJournal() {
  closeMenu();
  var modal = document.getElementById('journal-modal');
  var entries = document.getElementById('journal-entries');
  entries.innerHTML = '';
  if (GAME.journal.length === 0) {
    entries.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">Дневник пуст</div>';
  } else {
    GAME.journal.forEach(function(entry) {
      var div = document.createElement('div');
      div.className = 'journal-entry';
      div.innerHTML = '<div class="j-date">' + entry.date + '</div><div class="j-text">' + entry.text + '</div>';
      entries.appendChild(div);
    });
  }
  modal.classList.add('show');
}

function closeJournal() {
  document.getElementById('journal-modal').classList.remove('show');
  isPaused = false;
}

function showEnding(title, desc) {
  clearInterval(GAME.timerInterval);
  var ending = document.getElementById('ending');
  document.getElementById('ending-title').textContent = title;
  document.getElementById('ending-desc').textContent = desc;
  document.getElementById('end-love').textContent = GAME.love;
  document.getElementById('end-fear').textContent = GAME.fear;
  document.getElementById('end-trust').textContent = GAME.trust;
  ending.classList.add('show');
  var completions = JSON.parse(localStorage.getItem('ona_ryadom_complete') || '[]');
  if (!completions.includes(GAME.flags.ending || 'default')) {
    completions.push(GAME.flags.ending || 'default');
    localStorage.setItem('ona_ryadom_complete', JSON.stringify(completions));
  }
}

window.onload = init;
</script>
</body>
</html>
