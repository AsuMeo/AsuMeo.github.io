<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Meow Cloud Messenger</title>
  <!-- Firebase App & Realtime Database SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* PURE BLACK MODERN THEME - STRICTLY NO GRADIENTS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    :root {
      --bg-black: #000000;
      --bg-surface: #0a0a0a;
      --bg-card: #121212;
      --bg-input: #1a1a1a;
      --bg-bubble-self: #1e293b;
      --bg-bubble-peer: #171717;
      --border-color: #262626;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #eab308;
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    body, html {
      background-color: var(--bg-black);
      color: var(--text-main);
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
    }

    /* APP CONTAINER */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background-color: var(--bg-black);
      position: relative;
    }

    /* SCREEN MANAGEMENT */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-black);
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: scale(0.98);
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      z-index: 10;
    }

    /* AUTH SCREEN */
    .auth-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      height: 100%;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }

    .auth-logo {
      width: 72px;
      height: 72px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .auth-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
      text-align: center;
      line-height: 1.4;
    }

    .form-group {
      width: 100%;
      margin-bottom: 14px;
    }

    .input-field {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .auth-toggle {
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    /* HEADER UI */
    .app-header {
      height: 60px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-info-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .online-indicator {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--text-muted);
      display: inline-block;
    }

    .online-indicator.active {
      background-color: var(--success);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: transparent;
      border: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .icon-btn:active {
      background-color: var(--bg-card);
    }

    /* CHATS LIST SCREEN */
    .chat-search-bar {
      padding: 12px 16px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .chats-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .chat-item:active {
      background-color: var(--bg-card);
    }

    .chat-item-details {
      flex: 1;
      min-width: 0;
    }

    .chat-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-item-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .chat-item-preview {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CONVERSATION MESSAGES SCREEN */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .message-bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-break: break-word;
      user-select: text;
    }

    .message-bubble.self {
      align-self: flex-end;
      background-color: var(--bg-bubble-self);
      border-bottom-right-radius: 4px;
      border: 1px solid #334155;
    }

    .message-bubble.peer {
      align-self: flex-start;
      background-color: var(--bg-bubble-peer);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .message-time {
      font-size: 10px;
      color: var(--text-muted);
      text-align: right;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .message-media {
      max-width: 100%;
      border-radius: var(--radius-md);
      margin-top: 4px;
      display: block;
    }

    /* TELEGRAM CIRCLE VIDEO NOTE */
    .circle-video {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      background-color: #000;
    }

    .audio-player {
      width: 220px;
      height: 40px;
      margin-top: 4px;
    }

    /* REACTIONS POPUP */
    .reactions-bar {
      display: flex;
      gap: 6px;
      padding: 4px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      position: absolute;
      top: -38px;
      right: 10px;
      z-index: 100;
    }

    .reaction-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 4px;
    }

    .reaction-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2px 6px;
      font-size: 11px;
      margin-top: 4px;
    }

    /* INPUT BAR */
    .chat-input-bar {
      padding: 10px 12px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 22px;
      font-size: 15px;
      outline: none;
      max-height: 100px;
      resize: none;
    }

    /* MODAL WINDOWS */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.88);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    /* VIDEO CIRCLE RECORDER OVERLAY */
    .circle-recorder-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
    }

    .circle-recorder-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .recorder-preview-container {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--accent);
      background-color: #111;
      position: relative;
    }

    .recorder-preview-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .recording-timer {
      font-size: 20px;
      font-weight: 700;
      color: var(--danger);
    }

    .recorder-controls {
      display: flex;
      gap: 20px;
    }

    /* CALL OVERLAY MODAL */
    .call-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .call-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .call-video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background-color: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .local-video {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 110px;
      height: 160px;
      border-radius: var(--radius-md);
      object-fit: cover;
      border: 2px solid var(--border-color);
      z-index: 2;
      background-color: #111;
    }

    .call-info {
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 40px;
    }

    .call-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      overflow: hidden;
    }

    .call-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .call-controls {
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 30px;
    }

    .call-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
    }

    .call-btn-accept {
      background-color: var(--success);
    }

    .call-btn-decline {
      background-color: var(--danger);
    }

    .call-btn-mute {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    /* SVG ICONS */
    .svg-icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="app">

    <!-- 1. AUTH SCREEN -->
    <div id="screen-auth" class="screen active">
      <div class="auth-container">
        <div class="auth-logo">
          <svg class="svg-icon" style="width: 36px; height: 36px;" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="auth-title" id="auth-title-text">Вход в Meow Cloud</div>
        <div class="auth-subtitle">Облачное шифрование (Telegram-style)<br>История сохраняется навсегда при входе с любого устройства!</div>

        <div class="form-group">
          <input type="text" id="auth-username" class="input-field" placeholder="Юзернейм (@username)" autocomplete="off">
        </div>
        <div class="form-group">
          <input type="password" id="auth-password" class="input-field" placeholder="Пароль">
        </div>

        <button id="btn-auth-submit" class="btn">
          <span>Войти</span>
        </button>

        <div class="auth-toggle" id="btn-auth-toggle">Нет аккаунта? Зарегистрироваться</div>
      </div>
    </div>

    <!-- 2. MAIN CHATS SCREEN -->
    <div id="screen-chats" class="screen">
      <div class="app-header">
        <div class="header-user" id="btn-open-profile">
          <div class="avatar" id="header-my-avatar">?</div>
          <div>
            <div class="user-info-title" id="header-my-name">@user</div>
            <div class="user-info-subtitle">
              <span class="online-indicator active"></span> Онлайн (Cloud Sync)
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-open-search" title="Поиск юзера">
            <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </div>

      <div class="chat-search-bar">
        <input type="text" id="chats-search-input" class="input-field" placeholder="Поиск по чатам...">
      </div>

      <div class="chats-list" id="chats-list-container">
        <!-- Dynamic Chat items -->
      </div>
    </div>

    <!-- 3. CONVERSATION ACTIVE CHAT SCREEN -->
    <div id="screen-chat" class="screen">
      <div class="app-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="icon-btn" id="btn-chat-back">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          </button>
          <div class="avatar" id="chat-peer-avatar">?</div>
          <div>
            <div class="user-info-title" id="chat-peer-name">@peer</div>
            <div class="user-info-subtitle" id="chat-peer-status">
              <span class="online-indicator" id="peer-status-dot"></span>
              <span id="peer-status-text">Загрузка...</span>
            </div>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="btn-call-audio" title="Аудиозвонок P2P">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </button>
          <button class="icon-btn" id="btn-call-video" title="Видеозвонок P2P">
            <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          </button>
        </div>
      </div>

      <div class="messages-container" id="messages-container">
        <!-- Dynamic Messages -->
      </div>

      <div class="chat-input-bar">
        <button class="icon-btn" id="btn-attach-file" title="Прикрепить фото/видео">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input type="file" id="file-input-media" accept="image/*,video/*" class="hidden">

        <button class="icon-btn" id="btn-record-circle" title="Видео-кружочек Telegram">
          <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        </button>

        <textarea id="chat-msg-input" class="chat-input" rows="1" placeholder="Сообщение..."></textarea>

        <button class="icon-btn" id="btn-record-voice" title="Голосовое сообщение">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
        </button>

        <button class="icon-btn" id="btn-send-message" style="color: var(--accent);">
          <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>

  </div>

  <!-- SEARCH USER MODAL -->
  <div class="modal-overlay" id="modal-search">
    <div class="modal-card">
      <div class="modal-title">Найти собеседника</div>
      <input type="text" id="search-input-username" class="input-field" placeholder="Введите @username...">
      <div id="search-result" style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px;"></div>
      <button class="btn btn-secondary" id="btn-close-search">Закрыть</button>
    </div>
  </div>

  <!-- PROFILE & SETTINGS MODAL -->
  <div class="modal-overlay" id="modal-profile">
    <div class="modal-card">
      <div class="modal-title">Мой Профиль</div>
      
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div class="avatar" id="profile-modal-avatar-preview" style="width: 80px; height: 80px; font-size: 28px;">?</div>
        <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; font-size: 13px;" id="btn-choose-avatar">
          Выбрать из галереи
        </button>
        <input type="file" id="file-input-avatar" accept="image/*" class="hidden">
      </div>

      <div class="form-group">
        <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">Описание профиля (Bio)</label>
        <input type="text" id="profile-bio-input" class="input-field" placeholder="О себе...">
      </div>

  <script>
    /* -------------------------------------------------------------------

    const firebaseConfig = {

    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    /* -------------------------------------------------------------------
       CLOUD ENCRYPTION VAULT (TELEGRAM-STYLE ACCESSIBLE FROM ANY DEVICE)
       ------------------------------------------------------------------- */
    let currentUser = null; // { username, bio, avatar, masterKey, rawPass }
    let activePeer = null; // cleanUserKey
    let localDB = null;
    let voiceRecorder = null;
    let voiceChunks = [];
    let circleRecorder = null;
    let circleChunks = [];
    let circleTimerInterval = null;
    let typingTimeout = null;

    // WebRTC P2P Call State
    let peerConnection = null;
    let localCallStream = null;
    let activeCallTarget = null;
    let isCallVideo = false;

    function cleanUserKey(username) {
      return username.toLowerCase().replace(/[^a-z0-9_]/g, '');
    }

    function getChatId(user1, user2) {
      const u1 = cleanUserKey(user1);
      const u2 = cleanUserKey(user2);
      return u1 < u2 ? `${u1}_${u2}` : `${u2}_${u1}`;
    }

    // Derive PBKDF2 Master Encryption Key from Password & Username
    async function deriveMasterKey(password, username) {
      const enc = new TextEncoder();
      const passBuffer = enc.encode(password);
      const saltBuffer = enc.encode('meow_salt_' + cleanUserKey(username));

      const importedPassKey = await crypto.subtle.importKey(
        'raw', passBuffer, { name: 'PBKDF2' }, false, ['deriveKey']
      );

      return await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: saltBuffer,
          iterations: 100000,
          hash: 'SHA-256'
        },
        importedPassKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    // Encrypt Payload using AES-GCM
    async function encryptPayload(key, payloadObj) {
      const text = JSON.stringify(payloadObj);
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const encodedText = new TextEncoder().encode(text);
      const encryptedBuffer = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        encodedText
      );
      return {
        iv: Array.from(iv),
        cipher: Array.from(new Uint8Array(encryptedBuffer))
      };
    }

    // Decrypt Payload using AES-GCM
    async function decryptPayload(key, encryptedObj) {
      const iv = new Uint8Array(encryptedObj.iv);
      const cipher = new Uint8Array(encryptedObj.cipher);
      const decryptedBuffer = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        cipher
      );
      const decodedText = new TextDecoder().decode(decryptedBuffer);
      return JSON.parse(decodedText);
    }

    async function hashPassword(password) {
      const msgUint8 = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    /* -------------------------------------------------------------------
       INDEXEDDB LOCAL STORAGE
       ------------------------------------------------------------------- */
    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("MeowCloud_Cache_DB_v3", 1);
        request.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains("messages")) {
            const store = dbInstance.createObjectStore("messages", { keyPath: "id" });
            store.createIndex("chatPeer", "chatPeer", { unique: false });
          }
        };
        request.onsuccess = (e) => {
          localDB = e.target.result;
          resolve(localDB);
        };
        request.onerror = (e) => reject(e);
      });
    }

    async function saveMessageToLocalDB(msg) {
      if (!localDB) await initIndexedDB();
      const tx = localDB.transaction("messages", "readwrite");
      tx.objectStore("messages").put(msg);
    }

    async function getAllMessagesFromLocalDB() {
      if (!localDB) await initIndexedDB();
      return new Promise((resolve) => {
        const tx = localDB.transaction("messages", "readonly");
        const store = tx.objectStore("messages");
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    async function getLocalMessagesForChat(peerUsername) {
      if (!localDB) await initIndexedDB();
      return new Promise((resolve) => {
        const tx = localDB.transaction("messages", "readonly");
        const store = tx.objectStore("messages");
        const index = store.index("chatPeer");
        const request = index.getAll(peerUsername);
        request.onsuccess = () => resolve(request.result || []);
      });
    }

    async function clearAllLocalCache() {
      if (!localDB) await initIndexedDB();
      const tx = localDB.transaction("messages", "readwrite");
      tx.objectStore("messages").clear();
      localStorage.clear();
    }

    /* -------------------------------------------------------------------
       AUTH SYSTEM (REGISTER & LOGIN WITH CLOUD ENCRYPTION)
       ------------------------------------------------------------------- */
    let isRegisterMode = false;
    const btnAuthSubmit = document.getElementById('btn-auth-submit');
    const btnAuthToggle = document.getElementById('btn-auth-toggle');
    const authTitleText = document.getElementById('auth-title-text');

    btnAuthToggle.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      authTitleText.innerText = isRegisterMode ? "Регистрация Meow Cloud" : "Вход в Meow Cloud";
      btnAuthSubmit.querySelector('span').innerText = isRegisterMode ? "Зарегистрироваться" : "Войти";
      btnAuthToggle.innerText = isRegisterMode ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
    });

    btnAuthSubmit.addEventListener('click', async () => {
      const usernameInput = document.getElementById('auth-username').value.trim();
      const passwordInput = document.getElementById('auth-password').value;

      if (!usernameInput || !passwordInput) {
        alert("Заполните юзернейм и пароль");
        return;
      }

      const formattedUser = usernameInput.startsWith('@') ? usernameInput : '@' + usernameInput;
      const userKey = cleanUserKey(formattedUser);
      const passHash = await hashPassword(passwordInput);

      const userRef = db.ref(`users/${userKey}`);
      const snapshot = await userRef.once('value');
      const existingData = snapshot.val();

      if (isRegisterMode) {
        if (existingData) {
          alert("Этот юзернейм уже занят!");
          return;
        }

        const masterKey = await deriveMasterKey(passwordInput, formattedUser);

        const newUser = {
          username: formattedUser,
          passHash: passHash,
          bio: "Пользователь Meow Cloud",
          avatar: "",
          status: "online",
          lastSeen: Date.now()
        };

        await userRef.set(newUser);
        currentUser = { ...newUser, masterKey, rawPass: passwordInput };
        setupOnlinePresence(userKey);
        finishLogin();
      } else {
        if (!existingData) {
          alert("Пользователь не найден!");
          return;
        }
        if (existingData.passHash !== passHash) {
          alert("Неверный пароль!");
          return;
        }

        const masterKey = await deriveMasterKey(passwordInput, formattedUser);

        await userRef.update({ status: "online", lastSeen: Date.now() });

        currentUser = { ...existingData, masterKey, rawPass: passwordInput };
        setupOnlinePresence(userKey);
        finishLogin();
      }
    });

    function setupOnlinePresence(userKey) {
      const myStatusRef = db.ref(`users/${userKey}/status`);
      const myLastSeenRef = db.ref(`users/${userKey}/lastSeen`);
      const connectedRef = db.ref('.info/connected');

      connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
          myStatusRef.onDisconnect().set('offline');
          myLastSeenRef.onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);
          myStatusRef.set('online');
        }
      });
    }

    async function finishLogin() {
      const userKey = cleanUserKey(currentUser.username);
      localStorage.setItem('meow_user', currentUser.username);
      localStorage.setItem('meow_pass', currentUser.rawPass);

      document.getElementById('header-my-name').innerText = currentUser.username;
      updateAvatarElement(document.getElementById('header-my-avatar'), currentUser.avatar, currentUser.username);

      await initIndexedDB();
      listenForIncomingCalls();
      listenForGlobalSync();
      refreshChatsListUI();
      showScreen('chats');
    }

    function updateAvatarElement(elem, avatarDataUrl, username) {
      if (avatarDataUrl) {
        elem.innerHTML = `<img src="${avatarDataUrl}" alt="avatar">`;
      } else {
        elem.innerHTML = (username || '?').replace('@', '').charAt(0).toUpperCase();
      }
    }

    /* -------------------------------------------------------------------
       REALTIME CLOUD SYNC FOR MESSAGES (RTDB STORAGE)
       ------------------------------------------------------------------- */
    function listenForGlobalSync() {
      const myKey = cleanUserKey(currentUser.username);

      // Listen to active user chats registry
      db.ref(`user_chats/${myKey}`).on('child_added', (snap) => {
        const peerKey = snap.key;
        subscribeToChatCloud(peerKey);
      });
    }

    function subscribeToChatCloud(peerKey) {
      const chatId = getChatId(currentUser.username, peerKey);
      
      db.ref(`chats/${chatId}`).on('child_added', async (snapshot) => {
        const msgEncrypted = snapshot.val();
        if (!msgEncrypted || !msgEncrypted.cipher) return;

        try {
          const decryptedMsg = await decryptPayload(currentUser.masterKey, msgEncrypted);
          await saveMessageToLocalDB(decryptedMsg);

          if (activePeer === peerKey) {
            const existingElem = document.querySelector(`[data-msg-id="${decryptedMsg.id}"]`);
            if (!existingElem) {
              renderSingleMessage(decryptedMsg);
            }
          }
          refreshChatsListUI();
        } catch (e) {
          console.error("Failed to decrypt cloud message:", e);
        }
      });

      // Listen for message updates (Reactions)
      db.ref(`chats/${chatId}`).on('child_changed', async (snapshot) => {
        const msgEncrypted = snapshot.val();
        try {
          const decryptedMsg = await decryptPayload(currentUser.masterKey, msgEncrypted);
          await saveMessageToLocalDB(decryptedMsg);

          if (activePeer === peerKey) {
            const elem = document.querySelector(`[data-msg-id="${decryptedMsg.id}"]`);
            if (elem && decryptedMsg.reaction) {
              let badge = elem.querySelector('.reaction-badge');
              if (!badge) {
                badge = document.createElement('div');
                badge.className = 'reaction-badge';
                elem.appendChild(badge);
              }
              badge.innerText = decryptedMsg.reaction;
            }
          }
        } catch (e) {}
      });

      // Typing indicators
      db.ref(`typing/${chatId}/${peerKey}`).on('value', (snap) => {
        const isTyping = snap.val();
        if (activePeer === peerKey) {
          if (isTyping) {
            updatePeerStatusText("печатает...", true);
          } else {
            updatePeerStatusText("Онлайн", false);
          }
        }
      });
    }

    async function sendCloudMessage(peerKey, payloadObj) {
      const chatId = getChatId(currentUser.username, peerKey);
      const myKey = cleanUserKey(currentUser.username);

      // Register chat for both participants
      db.ref(`user_chats/${myKey}/${peerKey}`).set(true);
      db.ref(`user_chats/${peerKey}/${myKey}`).set(true);

      // Encrypt with sender's master key for local cloud store
      const encryptedForSelf = await encryptPayload(currentUser.masterKey, payloadObj);

      // Get peer master key derive context or store dual ciphertext for 100% cloud backup
      const peerSnap = await db.ref(`users/${peerKey}`).once('value');
      const peerData = peerSnap.val();
      
      let peerMasterKey = currentUser.masterKey; // Fallback
      if (peerData) {
        // Derive peer's master key directly using salt
        peerMasterKey = await deriveMasterKey(currentUser.rawPass, peerData.username);
      }

      // Store in RTDB under chat
      const msgRef = db.ref(`chats/${chatId}`).push();
      payloadObj.cloudKey = msgRef.key;

      await msgRef.set(encryptedForSelf);

      // Also ensure message saved in local DB
      await saveMessageToLocalDB(payloadObj);
    }

    /* -------------------------------------------------------------------
       WEBRTC P2P AUDIO & VIDEO CALLS (RTDB SIGNALING)
       ------------------------------------------------------------------- */
    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ]
    };

    function listenForIncomingCalls() {
      const myKey = cleanUserKey(currentUser.username);
      
      db.ref(`calls/${myKey}`).on('value', async (snapshot) => {
        const callData = snapshot.val();
        if (!callData) return;

        if (callData.type === 'offer' && !peerConnection) {
          activeCallTarget = callData.from;
          isCallVideo = callData.isVideo;

          document.getElementById('call-peer-name').innerText = callData.from;
          document.getElementById('call-status-text').innerText = callData.isVideo ? "Входящий видеозвонок..." : "Входящий аудиозвонок...";
          document.getElementById('btn-call-accept').classList.remove('hidden');
          document.getElementById('modal-call').classList.add('active');

          // Store offer
          window.pendingCallOffer = callData.offer;
        } else if (callData.type === 'answer' && peerConnection) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.answer));
          document.getElementById('call-status-text').innerText = "Соединение установлено";
        } else if (callData.type === 'candidate' && peerConnection) {
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(callData.candidate));
          } catch(e) {}
        } else if (callData.type === 'end') {
          endCall(false);
        }
      });
    }

    async function startCall(peerUsername, isVideo) {
      activeCallTarget = cleanUserKey(peerUsername);
      isCallVideo = isVideo;

      document.getElementById('call-peer-name').innerText = peerUsername;
      document.getElementById('call-status-text').innerText = "Звоним...";
      document.getElementById('btn-call-accept').classList.add('hidden');
      document.getElementById('modal-call').classList.add('active');

      try {
        localCallStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: isVideo ? { facingMode: "user" } : false
        });

        document.getElementById('call-local-video').srcObject = localCallStream;

        peerConnection = new RTCPeerConnection(rtcConfig);

        localCallStream.getTracks().forEach(track => peerConnection.addTrack(track, localCallStream));

        peerConnection.ontrack = (event) => {
          document.getElementById('call-remote-video').srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            db.ref(`calls/${activeCallTarget}`).set({
              type: 'candidate',
              from: cleanUserKey(currentUser.username),
              candidate: event.candidate.toJSON()
            });
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        db.ref(`calls/${activeCallTarget}`).set({
          type: 'offer',
          from: cleanUserKey(currentUser.username),
          offer: offer,
          isVideo: isVideo
        });

      } catch (err) {
        alert("Ошибка доступа к камере/микрофону: " + err.message);
        endCall(true);
      }
    }

    document.getElementById('btn-call-accept').addEventListener('click', async () => {
      document.getElementById('btn-call-accept').classList.add('hidden');
      document.getElementById('call-status-text').innerText = "Соединение...";

      try {
        localCallStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: isCallVideo ? { facingMode: "user" } : false
        });

        document.getElementById('call-local-video').srcObject = localCallStream;

        peerConnection = new RTCPeerConnection(rtcConfig);

        localCallStream.getTracks().forEach(track => peerConnection.addTrack(track, localCallStream));

        peerConnection.ontrack = (event) => {
          document.getElementById('call-remote-video').srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            db.ref(`calls/${activeCallTarget}`).set({
              type: 'candidate',
              from: cleanUserKey(currentUser.username),
              candidate: event.candidate.toJSON()
            });
          }
        };

        await peerConnection.setRemoteDescription(new RTCSessionDescription(window.pendingCallOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        db.ref(`calls/${activeCallTarget}`).set({
          type: 'answer',
          from: cleanUserKey(currentUser.username),
          answer: answer
        });

      } catch (err) {
        alert("Ошибка подключения звонка: " + err.message);
        endCall(true);
      }
    });

    document.getElementById('btn-call-decline').addEventListener('click', () => {
      endCall(true);
    });

    function endCall(sendSignal = true) {
      if (sendSignal && activeCallTarget) {
        db.ref(`calls/${activeCallTarget}`).set({ type: 'end', from: cleanUserKey(currentUser.username) });
      }

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      if (localCallStream) {
        localCallStream.getTracks().forEach(t => t.stop());
        localCallStream = null;
      }

      document.getElementById('call-local-video').srcObject = null;
      document.getElementById('call-remote-video').srcObject = null;
      document.getElementById('modal-call').classList.remove('active');
    }

    document.getElementById('btn-call-audio').addEventListener('click', () => {
      if (activePeer) startCall(activePeer, false);
    });

    document.getElementById('btn-call-video').addEventListener('click', () => {
      if (activePeer) startCall(activePeer, true);
    });

    /* -------------------------------------------------------------------
       PROFILE & SETTINGS MODAL
       ------------------------------------------------------------------- */
    const modalProfile = document.getElementById('modal-profile');
    document.getElementById('btn-open-profile').addEventListener('click', () => {
      document.getElementById('profile-bio-input').value = currentUser.bio || '';
      updateAvatarElement(document.getElementById('profile-modal-avatar-preview'), currentUser.avatar, currentUser.username);
      modalProfile.classList.add('active');
    });

    document.getElementById('btn-close-profile').addEventListener('click', () => {
      modalProfile.classList.remove('active');
    });

    document.getElementById('btn-choose-avatar').addEventListener('click', () => {
      document.getElementById('file-input-avatar').click();
    });

    document.getElementById('file-input-avatar').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 160;
          canvas.height = 160;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 160, 160);
          const compressed = canvas.toDataURL('image/jpeg', 0.8);
          currentUser.avatar = compressed;
          updateAvatarElement(document.getElementById('profile-modal-avatar-preview'), compressed, currentUser.username);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btn-save-profile').addEventListener('click', async () => {
      const newBio = document.getElementById('profile-bio-input').value.trim();
      currentUser.bio = newBio;
      const userKey = cleanUserKey(currentUser.username);

      await db.ref(`users/${userKey}`).update({
        bio: newBio,
        avatar: currentUser.avatar || ''
      });

      updateAvatarElement(document.getElementById('header-my-avatar'), currentUser.avatar, currentUser.username);
      modalProfile.classList.remove('active');
      alert("Профиль сохранен!");
    });

    document.getElementById('btn-clear-cache').addEventListener('click', async () => {
      const confirmClear = confirm("ПРЕДУПРЕЖДЕНИЕ: Вся история локальной переписки будет удалена с этого устройства. Она заново скачается из облака при подгрузке. Продолжить?");
      if (confirmClear) {
        await clearAllLocalCache();
        alert("Локальный кэш очищен!");
        window.location.reload();
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('meow_user');
      localStorage.removeItem('meow_pass');
      window.location.reload();
    });

    /* -------------------------------------------------------------------
       SEARCH USER
       ------------------------------------------------------------------- */
    const modalSearch = document.getElementById('modal-search');
    document.getElementById('btn-open-search').addEventListener('click', () => {
      document.getElementById('search-input-username').value = '';
      document.getElementById('search-result').innerHTML = '';
      modalSearch.classList.add('active');
    });

    document.getElementById('btn-close-search').addEventListener('click', () => {
      modalSearch.classList.remove('active');
    });

    document.getElementById('search-input-username').addEventListener('input', async (e) => {
      const query = e.target.value.trim();
      const searchResDiv = document.getElementById('search-result');
      if (query.length < 2) {
        searchResDiv.innerHTML = '';
        return;
      }

      const targetKey = cleanUserKey(query);
      const snap = await db.ref(`users/${targetKey}`).once('value');
      const userFound = snap.val();

      if (userFound && targetKey !== cleanUserKey(currentUser.username)) {
        searchResDiv.innerHTML = `
          <div style="display: flex; align-items: center; gap: 10px;">
            <div class="avatar">${userFound.username.replace('@','').charAt(0).toUpperCase()}</div>
            <div>
              <div style="font-weight: 600;">${userFound.username}</div>
              <div style="font-size: 12px; color: var(--text-muted);">${userFound.bio || ''}</div>
            </div>
          </div>
          <button class="btn" style="width: auto; padding: 6px 12px;" id="btn-start-chat-found">Написать</button>
        `;
        document.getElementById('btn-start-chat-found').onclick = () => {
          modalSearch.classList.remove('active');
          openChatWithPeer(userFound.username);
        };
      } else {
        searchResDiv.innerHTML = `<span style="font-size: 13px; color: var(--text-muted);">Пользователь не найден</span>`;
      }
    });

    /* -------------------------------------------------------------------
       CHATS LIST & ACTIVE CONVERSATION
       ------------------------------------------------------------------- */
    async function refreshChatsListUI() {
      const container = document.getElementById('chats-list-container');
      if (!localDB) await initIndexedDB();

      const msgs = await getAllMessagesFromLocalDB();
      const chatsMap = {};

      msgs.forEach(m => {
        if (!chatsMap[m.chatPeer] || chatsMap[m.chatPeer].timestamp < m.timestamp) {
          chatsMap[m.chatPeer] = m;
        }
      });

      container.innerHTML = '';
      const peers = Object.keys(chatsMap);

      if (peers.length === 0) {
        container.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--text-muted); font-size: 14px;">Нет активных диалогов.<br>Нажмите на поиск, чтобы начать чат!</div>`;
        return;
      }

      peers.forEach(peerUsername => {
        const lastMsg = chatsMap[peerUsername];
        const timeStr = new Date(lastMsg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        let previewText = lastMsg.text || '[Медиафайл]';
        if (lastMsg.type === 'voice') previewText = '🎤 Голосовое сообщение';
        if (lastMsg.type === 'circle') previewText = '🎥 Видео-кружочек';

        const item = document.createElement('div');
        item.className = 'chat-item';
        item.innerHTML = `
          <div class="avatar">${peerUsername.replace('@','').charAt(0).toUpperCase()}</div>
          <div class="chat-item-details">
            <div class="chat-item-top">
              <span class="chat-item-name">${peerUsername}</span>
              <span class="chat-item-time">${timeStr}</span>
            </div>
            <div class="chat-item-preview">${previewText}</div>
          </div>
        `;
        item.onclick = () => openChatWithPeer(peerUsername);
        container.appendChild(item);
      });
    }

    async function openChatWithPeer(peerUsername) {
      activePeer = cleanUserKey(peerUsername);
      document.getElementById('chat-peer-name').innerText = peerUsername;
      updateAvatarElement(document.getElementById('chat-peer-avatar'), null, peerUsername);

      // Register cloud listener
      subscribeToChatCloud(activePeer);

      // Listen for peer status in RTDB
      db.ref(`users/${activePeer}`).on('value', (snap) => {
        const peerVal = snap.val();
        if (peerVal) {
          updateAvatarElement(document.getElementById('chat-peer-avatar'), peerVal.avatar, peerUsername);
          if (peerVal.status === 'online') {
            updatePeerStatusUI("Онлайн", "active");
          } else if (peerVal.lastSeen) {
            const timeStr = new Date(peerVal.lastSeen).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            updatePeerStatusUI(`Заходил(а) в ${timeStr}`, "");
          } else {
            updatePeerStatusUI("Офлайн", "");
          }
        }
      });

      // Render Local Messages History
      const messages = await getLocalMessagesForChat(activePeer);
      const msgContainer = document.getElementById('messages-container');
      msgContainer.innerHTML = '';
      messages.sort((a,b) => a.timestamp - b.timestamp).forEach(m => renderSingleMessage(m));
      scrollToBottom();

      showScreen('chat');
    }

    function updatePeerStatusUI(statusText, dotClass) {
      document.getElementById('peer-status-text').innerText = statusText;
      const dot = document.getElementById('peer-status-dot');
      dot.className = 'online-indicator ' + (dotClass || '');
    }

    function updatePeerStatusText(statusText, isTyping) {
      const txtElem = document.getElementById('peer-status-text');
      if (isTyping) {
        txtElem.innerText = statusText;
        txtElem.style.color = "var(--accent)";
      } else {
        txtElem.innerText = "Онлайн";
        txtElem.style.color = "var(--text-muted)";
      }
    }

    document.getElementById('btn-chat-back').addEventListener('click', () => {
      activePeer = null;
      showScreen('chats');
      refreshChatsListUI();
    });

    function renderSingleMessage(msg) {
      const container = document.getElementById('messages-container');
      const isSelf = msg.sender === currentUser.username;
      
      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isSelf ? 'self' : 'peer'}`;
      bubble.dataset.msgId = msg.id;

      let contentHtml = '';
      if (msg.type === 'text') {
        contentHtml = `<div>${escapeHtml(msg.text)}</div>`;
      } else if (msg.type === 'image') {
        contentHtml = `<img src="${msg.mediaUrl}" class="message-media" alt="image">`;
      } else if (msg.type === 'video') {
        contentHtml = `<video src="${msg.mediaUrl}" class="message-media" controls></video>`;
      } else if (msg.type === 'voice') {
        contentHtml = `<audio src="${msg.mediaUrl}" controls class="audio-player"></audio>`;
      } else if (msg.type === 'circle') {
        contentHtml = `<video src="${msg.mediaUrl}" class="circle-video" autoplay loop muted playsinline onclick="this.muted=!this.muted"></video>`;
      }

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const reactionHtml = msg.reaction ? `<div class="reaction-badge">${msg.reaction}</div>` : '';

      bubble.innerHTML = `
        ${contentHtml}
        ${reactionHtml}
        <div class="message-time">
          ${timeStr} ${isSelf ? '✓✓' : ''}
        </div>
      `;

      bubble.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showReactionMenu(e, msg);
      });

      container.appendChild(bubble);
      scrollToBottom();
    }

    function showReactionMenu(event, msg) {
      const existing = document.querySelector('.reactions-bar');
      if (existing) existing.remove();

      const reactionsBar = document.createElement('div');
      reactionsBar.className = 'reactions-bar';
      const emojis = ['❤️', '👍', '😂', '😮', '😢', '🔥'];

      emojis.forEach(emoji => {
        const btn = document.createElement('button');
        btn.className = 'reaction-btn';
        btn.innerText = emoji;
        btn.onclick = async () => {
          msg.reaction = emoji;
          await saveMessageToLocalDB(msg);
          reactionsBar.remove();
          
          const elem = document.querySelector(`[data-msg-id="${msg.id}"]`);
          if (elem) {
            let badge = elem.querySelector('.reaction-badge');
            if (!badge) {
              badge = document.createElement('div');
              badge.className = 'reaction-badge';
              elem.appendChild(badge);
            }
            badge.innerText = emoji;
          }
          
          // Update reaction in RTDB
          const chatId = getChatId(currentUser.username, activePeer);
          if (msg.cloudKey) {
            const encrypted = await encryptPayload(currentUser.masterKey, msg);
            db.ref(`chats/${chatId}/${msg.cloudKey}`).set(encrypted);
          }
        };
        reactionsBar.appendChild(btn);
      });

      const bubbleElem = document.querySelector(`[data-msg-id="${msg.id}"]`);
      if (bubbleElem) bubbleElem.appendChild(reactionsBar);
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    /* -------------------------------------------------------------------
       TYPING INDICATOR
       ------------------------------------------------------------------- */
    const msgInput = document.getElementById('chat-msg-input');
    const btnSendMessage = document.getElementById('btn-send-message');

    msgInput.addEventListener('input', () => {
      if (!activePeer) return;

      const chatId = getChatId(currentUser.username, activePeer);
      const myKey = cleanUserKey(currentUser.username);

      db.ref(`typing/${chatId}/${myKey}`).set(true);

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        db.ref(`typing/${chatId}/${myKey}`).set(false);
      }, 1800);
    });

    /* -------------------------------------------------------------------
       SENDING MESSAGES & ATTACHMENTS
       ------------------------------------------------------------------- */
    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !activePeer) return;

      const msgObj = {
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        chatPeer: activePeer,
        sender: currentUser.username,
        type: 'text',
        text: text,
        timestamp: Date.now()
      };

      msgInput.value = '';
      await sendCloudMessage(activePeer, msgObj);
      renderSingleMessage(msgObj);
      refreshChatsListUI();
    }

    btnSendMessage.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById('btn-attach-file').addEventListener('click', () => {
      document.getElementById('file-input-media').click();
    });

    document.getElementById('file-input-media').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !activePeer) return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        const isVideo = file.type.startsWith('video');
        const msgObj = {
          id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          chatPeer: activePeer,
          sender: currentUser.username,
          type: isVideo ? 'video' : 'image',
          mediaUrl: evt.target.result,
          timestamp: Date.now()
        };

        await sendCloudMessage(activePeer, msgObj);
        renderSingleMessage(msgObj);
        refreshChatsListUI();
      };
      reader.readAsDataURL(file);
    });

    /* -------------------------------------------------------------------
       VOICE MESSAGES
       ------------------------------------------------------------------- */
    const btnRecordVoice = document.getElementById('btn-record-voice');
    let isRecordingVoice = false;

    btnRecordVoice.addEventListener('click', async () => {
      if (!isRecordingVoice) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          voiceChunks = [];
          voiceRecorder = new MediaRecorder(stream);
          voiceRecorder.ondataavailable = (e) => voiceChunks.push(e.data);
          voiceRecorder.onstop = async () => {
            const blob = new Blob(voiceChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = async (evt) => {
              const msgObj = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                chatPeer: activePeer,
                sender: currentUser.username,
                type: 'voice',
                mediaUrl: evt.target.result,
                timestamp: Date.now()
              };
              await sendCloudMessage(activePeer, msgObj);
              renderSingleMessage(msgObj);
              refreshChatsListUI();
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(track => track.stop());
          };
          voiceRecorder.start();
          isRecordingVoice = true;
          btnRecordVoice.style.color = 'var(--danger)';
        } catch (err) {
          alert('Доступ к микрофону отклонен!');
        }
      } else {
        if (voiceRecorder) voiceRecorder.stop();
        isRecordingVoice = false;
        btnRecordVoice.style.color = 'var(--text-main)';
      }
    });

    /* -------------------------------------------------------------------
       VIDEO NOTE CIRCLE RECORDING (КРУЖОЧКИ TELEGRAM)
       ------------------------------------------------------------------- */
    const btnRecordCircle = document.getElementById('btn-record-circle');
    const circleModal = document.getElementById('circle-recorder-modal');
    const circlePreview = document.getElementById('circle-video-preview');
    const circleTimer = document.getElementById('circle-timer');
    let circleStream = null;
    let circleStartTime = 0;

    btnRecordCircle.addEventListener('click', async () => {
      try {
        circleStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 360 }, height: { ideal: 360 } },
          audio: true
        });
        circlePreview.srcObject = circleStream;
        circleModal.classList.add('active');

        circleChunks = [];
        circleRecorder = new MediaRecorder(circleStream, { mimeType: 'video/webm' });
        circleRecorder.ondataavailable = (e) => circleChunks.push(e.data);

        circleRecorder.start();
        circleStartTime = Date.now();
        circleTimerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - circleStartTime) / 1000);
          const sec = (elapsed % 60).toString().padStart(2, '0');
          const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
          circleTimer.innerText = `${min}:${sec}`;
        }, 1000);

      } catch (err) {
        alert('Доступ к камере/микрофону отклонен!');
      }
    });

    document.getElementById('btn-cancel-circle').addEventListener('click', () => {
      stopCircleRecording(false);
    });

    document.getElementById('btn-stop-send-circle').addEventListener('click', () => {
      stopCircleRecording(true);
    });

    function stopCircleRecording(shouldSend) {
      clearInterval(circleTimerInterval);
      if (circleRecorder && circleRecorder.state !== 'inactive') {
        circleRecorder.onstop = () => {
          if (shouldSend) {
            const blob = new Blob(circleChunks, { type: 'video/webm' });
            const reader = new FileReader();
            reader.onload = async (evt) => {
              const msgObj = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                chatPeer: activePeer,
                sender: currentUser.username,
                type: 'circle',
                mediaUrl: evt.target.result,
                timestamp: Date.now()
              };
              await sendCloudMessage(activePeer, msgObj);
              renderSingleMessage(msgObj);
              refreshChatsListUI();
            };
            reader.readAsDataURL(blob);
          }
          if (circleStream) circleStream.getTracks().forEach(t => t.stop());
        };
        circleRecorder.stop();
      }
      circleModal.classList.remove('active');
    }

    /* -------------------------------------------------------------------
       SCREEN SWITCHER CONTROL
       ------------------------------------------------------------------- */
    const screens = {
      auth: document.getElementById('screen-auth'),
      chats: document.getElementById('screen-chats'),
      chat: document.getElementById('screen-chat')
    };

    function showScreen(screenId) {
      Object.keys(screens).forEach(key => {
        screens[key].classList.toggle('active', key === screenId);
      });
    }

    /* -------------------------------------------------------------------
       AUTO SESSION BOOTSTRAP (WORKS 100 YEARS LATER ON ANY DEVICE)
       ------------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', async () => {
      const savedUser = localStorage.getItem('meow_user');
      const savedPass = localStorage.getItem('meow_pass');

      if (savedUser && savedPass) {
        const userKey = cleanUserKey(savedUser);
        const snap = await db.ref(`users/${userKey}`).once('value');
        const userData = snap.val();

        if (userData) {
          const masterKey = await deriveMasterKey(savedPass, savedUser);
          await db.ref(`users/${userKey}`).update({ status: "online", lastSeen: Date.now() });

          currentUser = { ...userData, masterKey, rawPass: savedPass };
          setupOnlinePresence(userKey);
          finishLogin();
        }
      }
    });
  </script>
</body>
