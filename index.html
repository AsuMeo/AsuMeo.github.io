<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Meow P2P Messenger</title>
  <!-- Firebase App & Realtime Database Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    /* PURE BLACK MODERN THEME - NO GRADIENTS ALLOWED */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    :root {
      --bg-black: #000000;
      --bg-surface: #0a0a0a;
      --bg-card: #141414;
      --bg-input: #1f1f1f;
      --bg-bubble-self: #1e293b;
      --bg-bubble-peer: #171717;
      --border-color: #262626;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    body, html {
      background-color: var(--bg-black);
      color: var(--text-main);
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
    }

    /* APP CONTAINER */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background-color: var(--bg-black);
      position: relative;
    }

    /* SCREEN MANAGEMENT */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-black);
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      transform: scale(0.98);
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      z-index: 10;
    }

    /* AUTH SCREEN */
    .auth-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      height: 100%;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }

    .auth-logo {
      width: 72px;
      height: 72px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .auth-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
      text-align: center;
    }

    .form-group {
      width: 100%;
      margin-bottom: 14px;
    }

    .input-field {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .auth-toggle {
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    /* HEADER UI */
    .app-header {
      height: 60px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-info-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .online-indicator {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--text-muted);
      display: inline-block;
    }

    .online-indicator.active {
      background-color: var(--success);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: transparent;
      border: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .icon-btn:active {
      background-color: var(--bg-card);
    }

    /* CHATS LIST SCREEN */
    .chat-search-bar {
      padding: 12px 16px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .chats-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .chat-item:active {
      background-color: var(--bg-card);
    }

    .chat-item-details {
      flex: 1;
      min-width: 0;
    }

    .chat-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-item-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .chat-item-preview {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CONVERSATION MESSAGES SCREEN */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .message-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-break: break-word;
      user-select: text;
    }

    .message-bubble.self {
      align-self: flex-end;
      background-color: var(--bg-bubble-self);
      border-bottom-right-radius: 4px;
      border: 1px solid #334155;
    }

    .message-bubble.peer {
      align-self: flex-start;
      background-color: var(--bg-bubble-peer);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .message-time {
      font-size: 10px;
      color: var(--text-muted);
      text-align: right;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .message-media {
      max-width: 100%;
      border-radius: var(--radius-md);
      margin-top: 4px;
      display: block;
    }

    /* TELEGRAM-LIKE CIRCLE VIDEO NOTE */
    .circle-video {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      background-color: #000;
    }

    .audio-player {
      width: 220px;
      height: 40px;
      margin-top: 4px;
    }

    /* REACTIONS POPUP */
    .reactions-bar {
      display: flex;
      gap: 6px;
      padding: 4px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      position: absolute;
      top: -38px;
      right: 10px;
      z-index: 100;
    }

    .reaction-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 4px;
    }

    .reaction-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2px 6px;
      font-size: 11px;
      margin-top: 4px;
    }

    /* INPUT BAR */
    .chat-input-bar {
      padding: 10px 12px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 22px;
      font-size: 15px;
      outline: none;
      max-height: 100px;
      resize: none;
    }

    /* MODAL WINDOWS */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    /* VIDEO CIRCLE RECORDING OVERLAY */
    .circle-recorder-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
    }

    .circle-recorder-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .recorder-preview-container {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--accent);
      background-color: #111;
      position: relative;
    }

    .recorder-preview-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .recording-timer {
      font-size: 20px;
      font-weight: 700;
      color: var(--danger);
    }

    .recorder-controls {
      display: flex;
      gap: 20px;
    }

    /* SVG ICONS */
    .svg-icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="app">

    <!-- 1. AUTH SCREEN -->
    <div id="screen-auth" class="screen active">
      <div class="auth-container">
        <div class="auth-logo">
          <svg class="svg-icon" style="width: 36px; height: 36px;" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="auth-title" id="auth-title-text">Вход в Meow P2P</div>
        <div class="auth-subtitle">Сквозное шифрование &amp; P2P сеть</div>

        <div class="form-group">
          <input type="text" id="auth-username" class="input-field" placeholder="Юзернейм (@username)" autocomplete="off">
        </div>
        <div class="form-group">
          <input type="password" id="auth-password" class="input-field" placeholder="Пароль">
        </div>

        <button id="btn-auth-submit" class="btn">
          <span>Войти</span>
        </button>

        <div class="auth-toggle" id="btn-auth-toggle">Нет аккаунта? Зарегистрироваться</div>
      </div>
    </div>

    <!-- 2. MAIN CHATS SCREEN -->
    <div id="screen-chats" class="screen">
      <div class="app-header">
        <div class="header-user" id="btn-open-profile">
          <div class="avatar" id="header-my-avatar">?</div>
          <div>
            <div class="user-info-title" id="header-my-name">@user</div>
            <div class="user-info-subtitle">
              <span class="online-indicator active"></span> Онлайн (P2P)
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-open-search" title="Поиск юзера">
            <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </div>

      <div class="chat-search-bar">
        <input type="text" id="chats-search-input" class="input-field" placeholder="Поиск по чатам...">
      </div>

      <div class="chats-list" id="chats-list-container">
        <!-- Dynamic Chat items -->
      </div>
    </div>

    <!-- 3. CONVERSATION ACTIVE CHAT SCREEN -->
    <div id="screen-chat" class="screen">
      <div class="app-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="icon-btn" id="btn-chat-back">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          </button>
          <div class="avatar" id="chat-peer-avatar">?</div>
          <div>
            <div class="user-info-title" id="chat-peer-name">@peer</div>
            <div class="user-info-subtitle" id="chat-peer-status">Офлайн</div>
          </div>
        </div>
      </div>

      <div class="messages-container" id="messages-container">
        <!-- Dynamic Messages -->
      </div>

      <div class="chat-input-bar">
        <button class="icon-btn" id="btn-attach-file" title="Прикрепить фото/видео">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input type="file" id="file-input-media" accept="image/*,video/*" class="hidden">

        <button class="icon-btn" id="btn-record-circle" title="Видео-кружочек Telegram">
          <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        </button>

        <textarea id="chat-msg-input" class="chat-input" rows="1" placeholder="Сообщение..."></textarea>

        <button class="icon-btn" id="btn-record-voice" title="Голосовое сообщение">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
        </button>

        <button class="icon-btn" id="btn-send-message" style="color: var(--accent);">
          <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>

  </div>

  <!-- SEARCH USER MODAL -->
  <div class="modal-overlay" id="modal-search">
    <div class="modal-card">
      <div class="modal-title">Найти собеседника</div>
      <input type="text" id="search-input-username" class="input-field" placeholder="Введите @username...">
      <div id="search-result" style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px;"></div>
      <button class="btn btn-secondary" id="btn-close-search">Закрыть</button>
    </div>
  </div>

  <!-- PROFILE & SETTINGS MODAL -->
  <div class="modal-overlay" id="modal-profile">
    <div class="modal-card">
      <div class="modal-title">Мой Профиль</div>
      
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div class="avatar" id="profile-modal-avatar-preview" style="width: 80px; height: 80px; font-size: 28px;">?</div>
        <button class="btn btn-secondary" style="width: auto; padding: 8px 16px; font-size: 13px;" id="btn-choose-avatar">
          Выбрать из галереи
        </button>
        <input type="file" id="file-input-avatar" accept="image/*" class="hidden">
      </div>

      <div class="form-group">
        <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">Описание профиля (Bio)</label>
        <input type="text" id="profile-bio-input" class="input-field" placeholder="О себе...">
      </div>

      <button class="btn" id="btn-save-profile">Сохранить</button>
      
      <button class="btn btn-danger" id="btn-clear-cache">
        Очистить кэш и сообщения
      </button>

      <button class="btn btn-secondary" id="btn-logout">Выйти</button>
      <button class="btn btn-secondary" id="btn-close-profile">Закрыть</button>
    </div>
  </div>

  <!-- VIDEO CIRCLE RECORDER OVERLAY -->
  <div class="circle-recorder-overlay" id="circle-recorder-modal">
    <div class="recording-timer" id="circle-timer">00:00</div>
    <div class="recorder-preview-container">
      <video id="circle-video-preview" class="recorder-preview-video" autoplay playsinline muted></video>
    </div>
    <div class="recorder-controls">
      <button class="btn btn-danger" id="btn-cancel-circle" style="width: 100px;">Отмена</button>
      <button class="btn" id="btn-stop-send-circle" style="width: 140px;">Отправить</button>
    </div>
  </div>

  <script>
    /* -------------------------------------------------------------------
       FIREBASE CONFIGURATION
       ------------------------------------------------------------------- */
    const firebaseConfig = {
      apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
      authDomain: "meow-874ce.firebaseapp.com",
      databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meow-874ce",
      storageBucket: "meow-874ce.firebasestorage.app",
      messagingSenderId: "471541334599",
      appId: "1:471541334599:web:567af3e7dbe70a37572762"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    /* -------------------------------------------------------------------
       STATE & ENCRYPTION CRYPTO MODULE (Web Crypto API ECDH + AES-GCM)
       ------------------------------------------------------------------- */
    let currentUser = null; // { username, bio, avatar, keyPair }
    let activePeer = null; // username
    let peerConnections = {}; // username -> { rtc: RTCPeerConnection, dc: RTCDataChannel, sharedKey: CryptoKey }
    let localDB = null;
    let voiceRecorder = null;
    let voiceChunks = [];
    let circleRecorder = null;
    let circleChunks = [];
    let circleTimerInterval = null;

    // Helper: Clean Username key
    function cleanUserKey(username) {
      return username.toLowerCase().replace(/[^a-z0-9_]/g, '');
    }

    // Hash Password for simple auth verification
    async function hashPassword(password) {
      const msgUint8 = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Generate ECDH Key Pair for E2EE
    async function generateECDHKeyPair() {
      return await window.crypto.subtle.generateKey(
        { name: "ECDH", namedCurve: "P-256" },
        true,
        ["deriveKey", "deriveBits"]
      );
    }

    // Export Public Key to JWK
    async function exportPublicKey(key) {
      return await window.crypto.subtle.exportKey("jwk", key);
    }

    // Derive AES-GCM Shared Symmetric Key from Local Private & Peer Public JWK
    async function deriveSharedAESKey(privateKey, peerJwk) {
      const peerPublicKey = await window.crypto.subtle.importKey(
        "jwk",
        peerJwk,
        { name: "ECDH", namedCurve: "P-256" },
        true,
        []
      );
      return await window.crypto.subtle.deriveKey(
        { name: "ECDH", public: peerPublicKey },
        privateKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    // Encrypt Text / JSON Data
    async function encryptPayload(key, payloadObj) {
      const text = JSON.stringify(payloadObj);
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const encodedText = new TextEncoder().encode(text);
      const encryptedContent = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        encodedText
      );
      return {
        iv: Array.from(iv),
        cipher: Array.from(new Uint8Array(encryptedContent))
      };
    }

    // Decrypt Payload
    async function decryptPayload(key, encryptedObj) {
      const iv = new Uint8Array(encryptedObj.iv);
      const cipher = new Uint8Array(encryptedObj.cipher);
      const decryptedBuffer = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        cipher
      );
      const decodedText = new TextDecoder().decode(decryptedBuffer);
      return JSON.parse(decodedText);
    }

    /* -------------------------------------------------------------------
       INDEXEDDB LOCAL STORAGE (MOBILE LOCAL CACHE)
       ------------------------------------------------------------------- */
    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("MeowP2P_Cache_DB", 1);
        request.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains("messages")) {
            const store = dbInstance.createObjectStore("messages", { keyPath: "id" });
            store.createIndex("chatPeer", "chatPeer", { unique: false });
          }
        };
        request.onsuccess = (e) => {
          localDB = e.target.result;
          resolve(localDB);
        };
        request.onerror = (e) => reject(e);
      });
    }

    async function saveMessageToLocalDB(msg) {
      if (!localDB) await initIndexedDB();
      const tx = localDB.transaction("messages", "readwrite");
      tx.objectStore("messages").put(msg);
    }

    async function getLocalMessagesForChat(peerUsername) {
      if (!localDB) await initIndexedDB();
      return new Promise((resolve) => {
        const tx = localDB.transaction("messages", "readonly");
        const store = tx.objectStore("messages");
        const index = store.index("chatPeer");
        const request = index.getAll(peerUsername);
        request.onsuccess = () => resolve(request.result || []);
      });
    }

    async function clearAllLocalCache() {
      if (!localDB) await initIndexedDB();
      const tx = localDB.transaction("messages", "readwrite");
      tx.objectStore("messages").clear();
      localStorage.clear();
    }

    /* -------------------------------------------------------------------
       WEBRTC P2P SIGNALING & PEER CONNECTION
       ------------------------------------------------------------------- */
    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    function listenForIncomingSignals() {
      if (!currentUser) return;
      const myKey = cleanUserKey(currentUser.username);
      const signalsRef = db.ref(`signals/${myKey}`);

      signalsRef.on('child_added', async (snapshot) => {
        const senderKey = snapshot.key;
        const signalData = snapshot.val();
        db.ref(`signals/${myKey}/${senderKey}`).remove(); // clear consumed signal

        if (signalData.type === 'offer') {
          await handleIncomingOffer(senderKey, signalData.offer, signalData.peerJwk);
        } else if (signalData.type === 'answer') {
          await handleIncomingAnswer(senderKey, signalData.answer);
        } else if (signalData.type === 'candidate') {
          if (peerConnections[senderKey] && peerConnections[senderKey].rtc) {
            await peerConnections[senderKey].rtc.addIceCandidate(new RTCIceCandidate(signalData.candidate));
          }
        }
      });
    }

    async function initP2PConnection(targetUserKey, isInitiator = false) {
      if (peerConnections[targetUserKey] && peerConnections[targetUserKey].dc && peerConnections[targetUserKey].dc.readyState === 'open') {
        return peerConnections[targetUserKey];
      }

      const rtc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetUserKey] = peerConnections[targetUserKey] || {};
      peerConnections[targetUserKey].rtc = rtc;

      // Fetch Peer Public Key from Firebase to derive Shared E2EE Key
      const peerSnap = await db.ref(`users/${targetUserKey}`).once('value');
      const peerData = peerSnap.val();
      if (peerData && peerData.publicKey) {
        peerConnections[targetUserKey].sharedKey = await deriveSharedAESKey(currentUser.keyPair.privateKey, peerData.publicKey);
      }

      rtc.onicecandidate = (event) => {
        if (event.candidate) {
          db.ref(`signals/${targetUserKey}/${cleanUserKey(currentUser.username)}`).set({
            type: 'candidate',
            candidate: event.candidate.toJSON()
          });
        }
      };

      if (isInitiator) {
        const dc = rtc.createDataChannel("chat-channel");
        setupDataChannelEvents(targetUserKey, dc);

        const myJwk = await exportPublicKey(currentUser.keyPair.publicKey);
        const offer = await rtc.createOffer();
        await rtc.setLocalDescription(offer);

        db.ref(`signals/${targetUserKey}/${cleanUserKey(currentUser.username)}`).set({
          type: 'offer',
          offer: offer,
          peerJwk: myJwk
        });
      } else {
        rtc.ondatachannel = (event) => {
          setupDataChannelEvents(targetUserKey, event.channel);
        };
      }

      return peerConnections[targetUserKey];
    }

    async function handleIncomingOffer(senderKey, offer, senderJwk) {
      peerConnections[senderKey] = peerConnections[senderKey] || {};
      peerConnections[senderKey].sharedKey = await deriveSharedAESKey(currentUser.keyPair.privateKey, senderJwk);
      
      const rtc = new RTCPeerConnection(rtcConfig);
      peerConnections[senderKey].rtc = rtc;

      rtc.onicecandidate = (event) => {
        if (event.candidate) {
          db.ref(`signals/${senderKey}/${cleanUserKey(currentUser.username)}`).set({
            type: 'candidate',
            candidate: event.candidate.toJSON()
          });
        }
      };

      rtc.ondatachannel = (event) => {
        setupDataChannelEvents(senderKey, event.channel);
      };

      await rtc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await rtc.createAnswer();
      await rtc.setLocalDescription(answer);

      db.ref(`signals/${senderKey}/${cleanUserKey(currentUser.username)}`).set({
        type: 'answer',
        answer: answer
      });
    }

    async function handleIncomingAnswer(senderKey, answer) {
      if (peerConnections[senderKey] && peerConnections[senderKey].rtc) {
        await peerConnections[senderKey].rtc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    }

    function setupDataChannelEvents(peerKey, dc) {
      peerConnections[peerKey].dc = dc;
      dc.onopen = () => {
        if (activePeer === peerKey) {
          updatePeerStatusUI("Онлайн (P2P подключен)");
        }
      };
      dc.onclose = () => {
        if (activePeer === peerKey) {
          updatePeerStatusUI("Офлайн");
        }
      };
      dc.onmessage = async (event) => {
        try {
          const encryptedObj = JSON.parse(event.data);
          const decryptedMsg = await decryptPayload(peerConnections[peerKey].sharedKey, encryptedObj);
          
          await saveMessageToLocalDB(decryptedMsg);

          if (activePeer === peerKey) {
            renderSingleMessage(decryptedMsg);
          }
          refreshChatsListUI();
        } catch (e) {
          console.error("Failed to decrypt incoming message:", e);
        }
      };
    }

    // Send payload over P2P DataChannel
    async function sendP2PPayload(targetUserKey, payloadObj) {
      let peerConn = peerConnections[targetUserKey];
      if (!peerConn || !peerConn.dc || peerConn.dc.readyState !== 'open') {
        peerConn = await initP2PConnection(targetUserKey, true);
      }

      // Wait brief moment if DC opening
      let attempts = 0;
      while ((!peerConn.dc || peerConn.dc.readyState !== 'open') && attempts < 25) {
        await new Promise(r => setTimeout(r, 200));
        attempts++;
      }

      if (peerConn.dc && peerConn.dc.readyState === 'open') {
        const encrypted = await encryptPayload(peerConn.sharedKey, payloadObj);
        peerConn.dc.send(JSON.stringify(encrypted));
        return true;
      } else {
        alert("Не удалось установить прямое P2P соединение с пользователем.");
        return false;
      }
    }

    btnAuthToggle.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      authTitleText.innerText = isRegisterMode ? "Регистрация Meow P2P" : "Вход в Meow P2P";
      btnAuthSubmit.querySelector('span').innerText = isRegisterMode ? "Зарегистрироваться" : "Войти";
      btnAuthToggle.innerText = isRegisterMode ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";

    btnAuthSubmit.addEventListener('click', async () => {
      const usernameInput = document.getElementById('auth-username').value.trim();
      const passwordInput = document.getElementById('auth-password').value;

      if (!usernameInput || !passwordInput) {
        alert("Заполните юзернейм и пароль");
        return;
      }

      const formattedUser = usernameInput.startsWith('@') ? usernameInput : '@' + usernameInput;
      const userKey = cleanUserKey(formattedUser);
      const passHash = await hashPassword(passwordInput);

      const userRef = db.ref(`users/${userKey}`);
      const snapshot = await userRef.once('value');
      const existingData = snapshot.val();

      if (isRegisterMode) {
        if (existingData) {
          alert("Этот юзернейм уже занят!");
          return;
        }

        // Generate ECDH Keys
        const keyPair = await generateECDHKeyPair();
        const publicJwk = await exportPublicKey(keyPair.publicKey);

        const newUser = {
          username: formattedUser,
          passHash: passHash,
          bio: "Пользователь Meow P2P",
          avatar: "",
          publicKey: publicJwk,
          status: "online",
          lastSeen: Date.now()
        };

        await userRef.set(newUser);
        currentUser = { ...newUser, keyPair };
        setupOnlinePresence(userKey);
        finishLogin();
      } else {
        if (!existingData) {
          alert("Пользователь не найден!");
          return;
        }
        if (existingData.passHash !== passHash) {
          alert("Неверный пароль!");
          return;
        }

        // Regenerate local session keys and update Firebase public key
        const keyPair = await generateECDHKeyPair();
        const publicJwk = await exportPublicKey(keyPair.publicKey);
        await userRef.update({ publicKey: publicJwk, status: "online", lastSeen: Date.now() });

        currentUser = { ...existingData, keyPair };
        setupOnlinePresence(userKey);
        finishLogin();
      }
    });

    function setupOnlinePresence(userKey) {
      const myStatusRef = db.ref(`users/${userKey}/status`);
      const myLastSeenRef = db.ref(`users/${userKey}/lastSeen`);
      const connectedRef = db.ref('.info/connected');

      connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
          myStatusRef.onDisconnect().set('offline');
          myLastSeenRef.onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);
          myStatusRef.set('online');
        }
      });
    }

    /* -------------------------------------------------------------------

       ------------------------------------------------------------------- */
    async function refreshChatsListUI() {
      const container = document.getElementById('chats-list-container');
      if (!localDB) await initIndexedDB();

      const tx = localDB.transaction("messages", "readonly");
      const store = tx.objectStore("messages");
      const allMsgsRequest = store.getAll();

      allMsgsRequest.onsuccess = () => {
        const msgs = allMsgsRequest.result || [];
        const chatsMap = {};

        msgs.forEach(m => {
          if (!chatsMap[m.chatPeer] || chatsMap[m.chatPeer].timestamp < m.timestamp) {
            chatsMap[m.chatPeer] = m;
          }
        });

        container.innerHTML = '';
        const peers = Object.keys(chatsMap);

        if (peers.length === 0) {
          container.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--text-muted); font-size: 14px;">Нет активных диалогов.<br>Нажмите на поиск, чтобы начать чат!</div>`;
          return;
        }

        peers.forEach(peerUsername => {
          const lastMsg = chatsMap[peerUsername];
          const timeStr = new Date(lastMsg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          let previewText = lastMsg.text || '[Медиафайл]';
          if (lastMsg.type === 'voice') previewText = '🎤 Голосовое сообщение';
          if (lastMsg.type === 'circle') previewText = '🎥 Видео-кружочек';

          const item = document.createElement('div');
          item.className = 'chat-item';
          item.innerHTML = `
            <div class="avatar">${peerUsername.replace('@','').charAt(0).toUpperCase()}</div>
            <div class="chat-item-details">
              <div class="chat-item-top">
                <span class="chat-item-name">${peerUsername}</span>
                <span class="chat-item-time">${timeStr}</span>
              </div>
              <div class="chat-item-preview">${previewText}</div>
            </div>
          `;
          item.onclick = () => openChatWithPeer(peerUsername);
          container.appendChild(item);
        });
      };
    }

    async function openChatWithPeer(peerUsername) {
      activePeer = cleanUserKey(peerUsername);
      document.getElementById('chat-peer-name').innerText = peerUsername;
      updateAvatarElement(document.getElementById('chat-peer-avatar'), null, peerUsername);

      // Listen for peer online status in Realtime DB
      db.ref(`users/${activePeer}`).on('value', (snap) => {
        const peerVal = snap.val();
        if (peerVal) {
          updateAvatarElement(document.getElementById('chat-peer-avatar'), peerVal.avatar, peerUsername);
          if (peerVal.status === 'online') {
            updatePeerStatusUI("Онлайн");
          } else if (peerVal.lastSeen) {
            const timeStr = new Date(peerVal.lastSeen).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            updatePeerStatusUI(`Заходил(а) в ${timeStr}`);
          } else {
            updatePeerStatusUI("Офлайн");
          }
        }
      });

      // Establish P2P WebRTC Connection background
      initP2PConnection(activePeer, true);

      // Load local history
      const messages = await getLocalMessagesForChat(activePeer);
      const msgContainer = document.getElementById('messages-container');
      msgContainer.innerHTML = '';
      messages.sort((a,b) => a.timestamp - b.timestamp).forEach(m => renderSingleMessage(m));
      scrollToBottom();

      showScreen('chat');
    }

    function renderSingleMessage(msg) {
      const container = document.getElementById('messages-container');
      const isSelf = msg.sender === currentUser.username;
      
      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isSelf ? 'self' : 'peer'}`;
      bubble.dataset.msgId = msg.id;

      let contentHtml = '';
      if (msg.type === 'text') {
        contentHtml = `<div>${escapeHtml(msg.text)}</div>`;
      } else if (msg.type === 'image') {
        contentHtml = `<img src="${msg.mediaUrl}" class="message-media" alt="image">`;
      } else if (msg.type === 'video') {
        contentHtml = `<video src="${msg.mediaUrl}" class="message-media" controls></video>`;
      } else if (msg.type === 'voice') {
        contentHtml = `<audio src="${msg.mediaUrl}" controls class="audio-player"></audio>`;
      } else if (msg.type === 'circle') {
        contentHtml = `<video src="${msg.mediaUrl}" class="circle-video" autoplay loop muted playsinline onclick="this.muted=!this.muted"></video>`;
      }

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const reactionHtml = msg.reaction ? `<div class="reaction-badge">${msg.reaction}</div>` : '';

      bubble.innerHTML = `
        ${contentHtml}
        ${reactionHtml}
        <div class="message-time">
          ${timeStr} ${isSelf ? '✓✓' : ''}
        </div>
      `;

      // Context menu / click for Reactions
      bubble.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showReactionMenu(e, msg);
      });

      container.appendChild(bubble);
      scrollToBottom();
    }

    function showReactionMenu(event, msg) {
      const existing = document.querySelector('.reactions-bar');
      if (existing) existing.remove();

      const reactionsBar = document.createElement('div');
      reactionsBar.className = 'reactions-bar';
      const emojis = ['❤️', '👍', '😂', '😮', '😢', '🔥'];

      emojis.forEach(emoji => {
        const btn = document.createElement('button');
        btn.className = 'reaction-btn';
        btn.innerText = emoji;
        btn.onclick = async () => {
          msg.reaction = emoji;
          await saveMessageToLocalDB(msg);
          reactionsBar.remove();
          // Re-render
          const elem = document.querySelector(`[data-msg-id="${msg.id}"]`);
          if (elem) {
            let badge = elem.querySelector('.reaction-badge');
            if (!badge) {
              badge = document.createElement('div');
              badge.className = 'reaction-badge';
              elem.appendChild(badge);
            }
            badge.innerText = emoji;
          }
          // Sync reaction via P2P
          sendP2PPayload(activePeer, { type: 'reaction_update', msgId: msg.id, reaction: emoji });
        };
        reactionsBar.appendChild(btn);
      });

      const bubbleElem = document.querySelector(`[data-msg-id="${msg.id}"]`);
      if (bubbleElem) bubbleElem.appendChild(reactionsBar);
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];

    }

          chatPeer: activePeer,
          sender: currentUser.username,
          type: isVideo ? 'video' : 'image',
          mediaUrl: evt.target.result,
          timestamp: Date.now()
        };

        await saveMessageToLocalDB(msgObj);
        renderSingleMessage(msgObj);
        await sendP2PPayload(activePeer, msgObj);
        refreshChatsListUI();
      };
      reader.readAsDataURL(file);
    });

    /* -------------------------------------------------------------------
       VOICE MESSAGES RECORDING (MIC)
       ------------------------------------------------------------------- */
    const btnRecordVoice = document.getElementById('btn-record-voice');
    let isRecordingVoice = false;

    btnRecordVoice.addEventListener('click', async () => {
      if (!isRecordingVoice) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          voiceChunks = [];
          voiceRecorder = new MediaRecorder(stream);
          voiceRecorder.ondataavailable = (e) => voiceChunks.push(e.data);
          voiceRecorder.onstop = async () => {
            const blob = new Blob(voiceChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = async (evt) => {
              const msgObj = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                chatPeer: activePeer,
                sender: currentUser.username,
                type: 'voice',
                mediaUrl: evt.target.result,
                timestamp: Date.now()
              };
              await saveMessageToLocalDB(msgObj);
              renderSingleMessage(msgObj);
              await sendP2PPayload(activePeer, msgObj);
              refreshChatsListUI();
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(track => track.stop());
          };
          voiceRecorder.start();
          isRecordingVoice = true;
          btnRecordVoice.style.color = 'var(--danger)';
        } catch (err) {
          alert('Доступ к микрофону отклонен!');
        }
      } else {
        if (voiceRecorder) voiceRecorder.stop();
        isRecordingVoice = false;
        btnRecordVoice.style.color = 'var(--text-main)';
      }
    });

    /* -------------------------------------------------------------------
       TELEGRAM-LIKE VIDEO NOTE CIRCLE RECORDING (КРУЖОЧКИ)
       ------------------------------------------------------------------- */
    const btnRecordCircle = document.getElementById('btn-record-circle');
    const circleModal = document.getElementById('circle-recorder-modal');
    const circlePreview = document.getElementById('circle-video-preview');
    const circleTimer = document.getElementById('circle-timer');
    let circleStream = null;
    let circleStartTime = 0;

    btnRecordCircle.addEventListener('click', async () => {
      try {
        circleStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 360 }, height: { ideal: 360 } },
          audio: true
        });
        circlePreview.srcObject = circleStream;
        circleModal.classList.add('active');

        circleChunks = [];
        circleRecorder = new MediaRecorder(circleStream, { mimeType: 'video/webm' });
        circleRecorder.ondataavailable = (e) => circleChunks.push(e.data);

        circleRecorder.start();
        circleStartTime = Date.now();
        circleTimerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - circleStartTime) / 1000);
          const sec = (elapsed % 60).toString().padStart(2, '0');
          const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
          circleTimer.innerText = `${min}:${sec}`;
        }, 1000);

      } catch (err) {
        alert('Доступ к камере/микрофону отклонен!');
      }
    });

    document.getElementById('btn-cancel-circle').addEventListener('click', () => {
      stopCircleRecording(false);
    });

    document.getElementById('btn-stop-send-circle').addEventListener('click', () => {
      stopCircleRecording(true);
    });

    function stopCircleRecording(shouldSend) {
      clearInterval(circleTimerInterval);
      if (circleRecorder && circleRecorder.state !== 'inactive') {
        circleRecorder.onstop = () => {
          if (shouldSend) {
            const blob = new Blob(circleChunks, { type: 'video/webm' });
            const reader = new FileReader();
            reader.onload = async (evt) => {
              const msgObj = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                chatPeer: activePeer,
                sender: currentUser.username,
                type: 'circle',
                mediaUrl: evt.target.result,
                timestamp: Date.now()
              };
              await saveMessageToLocalDB(msgObj);
              renderSingleMessage(msgObj);
              await sendP2PPayload(activePeer, msgObj);
              refreshChatsListUI();
            };
            reader.readAsDataURL(blob);
          }
          if (circleStream) circleStream.getTracks().forEach(t => t.stop());
        };
        circleRecorder.stop();
      }
      circleModal.classList.remove('active');
    }

    /* -------------------------------------------------------------------
       AUTO SESSION RESTORE ON BOOT
       ------------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', async () => {
      const savedUser = localStorage.getItem('meow_user');
      if (savedUser) {
        const userKey = cleanUserKey(savedUser);
        const snap = await db.ref(`users/${userKey}`).once('value');
        const userData = snap.val();

        if (userData) {
          const keyPair = await generateECDHKeyPair();
          const publicJwk = await exportPublicKey(keyPair.publicKey);
          await db.ref(`users/${userKey}`).update({ publicKey: publicJwk, status: "online", lastSeen: Date.now() });

          currentUser = { ...userData, keyPair };
          setupOnlinePresence(userKey);
          finishLogin();
        }
      }
    });
  </script>
</body>
</html>
